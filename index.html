<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="assets/brand/favicon.png">
<title>准讯周报 · 今日日报</title>
<style>

  :root {
    --chrome: #2F343A;
    --chrome-line: #23272C;
    --chrome-ink: #F2EFE8;
    --chrome-ink-soft: #C5C0B6;
    --paper: #F7F4EE;
    --paper-deep: #EFEAE0;
    --paper-elev: #FCFBF8;
    --ink: #1F1D1A;
    --ink-soft: #433E37;
    --ink-faint: #6B645A;
    --rule: #DDD6C9;
    --accent: #9E3B2B;
    --accent-soft: #F3E5E1;
    --accent-ink: #FCFBF8;
    --scrim: rgba(24, 22, 19, 0.42);
    --dock-shadow: 0 8px 28px rgba(31, 29, 26, 0.16);
    --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --fs-h1: clamp(30px, 4.8vw, 68px);
    --fs-h2: 26px;
    --fs-h3: 20px;
    --fs-body: 17px;
    --fs-meta: 13px;
  }
  html[data-theme="dark"] {
    --chrome: #16191D;
    --chrome-line: #262B33;
    --chrome-ink: #F0ECE4;
    --chrome-ink-soft: #A7A298;
    --paper: #191C20;
    --paper-deep: #21252B;
    --paper-elev: #232830;
    --ink: #EBE6DD;
    --ink-soft: #C8C2B7;
    --ink-faint: #9E978B;
    --rule: #303640;
    --accent: #D97757;
    --accent-soft: #2E2421;
    --accent-ink: #16191D;
    --scrim: rgba(0, 0, 0, 0.62);
    --dock-shadow: 0 10px 32px rgba(0, 0, 0, 0.48);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  button, select, input { font-family: inherit; }
  img { max-width: 100%; height: auto; display: block; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: var(--fs-body);
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }

  /* 顶部阅读进度条 */
  .reading-progress {
    position: fixed; top: 0; left: 0; height: 3px; width: 0%;
    background: var(--accent); z-index: 120;
  }

  /* 顶栏 chrome 层（日报 / 周刊严格同构，消除割裂感） */
  .layer-chrome {
    position: sticky; top: 0; z-index: 60;
    background: var(--chrome);
    border-bottom: 1px solid var(--chrome-line);
    color: var(--chrome-ink);
  }
  .chrome-inner {
    max-width: 980px; margin: 0 auto;
    padding: 8px max(20px, env(safe-area-inset-left)) 8px max(20px, env(safe-area-inset-right));
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px;
  }
  .brand {
    display: inline-flex; align-items: center; gap: 10px; min-height: 44px;
    font-family: var(--serif); font-size: var(--fs-h3); font-weight: 700;
    letter-spacing: 0.04em; color: var(--chrome-ink); text-decoration: none;
  }
  .brand-logo {
    width: 32px; height: 32px; flex: 0 0 32px; padding: 2px;
    border-radius: 50%; background: var(--chrome-ink); object-fit: contain;
  }
  .footer-brand {
    display: inline-flex; align-items: center; gap: 8px;
  }
  .footer-logo {
    width: 22px; height: 22px; flex: 0 0 22px; padding: 1px;
    border-radius: 50%; background: var(--paper-elev); object-fit: contain;
  }
  .nav-group { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; }
  .nav-link {
    display: inline-flex; align-items: center; min-height: 44px; padding: 0 4px;
    font-size: var(--fs-meta); font-weight: 600; letter-spacing: 0.04em;
    color: var(--chrome-ink-soft); text-decoration: none;
    border-bottom: 2px solid transparent;
  }
  .nav-link:hover { color: var(--chrome-ink); }
  .nav-link.active { color: var(--chrome-ink); border-bottom-color: var(--accent); }
  .chrome-ctrl {
    display: inline-flex; flex-wrap: nowrap; align-items: center; gap: 8px; max-width: 100%;
  }
  .issue-sel, .theme-btn {
    min-height: 44px; padding: 0 12px; max-width: 100%; min-width: 0;
    background: var(--chrome-line); color: var(--chrome-ink);
    border: 1px solid var(--chrome-line); border-radius: 2px;
    font-family: var(--mono); font-size: var(--fs-meta); cursor: pointer;
  }
  .issue-sel { max-width: min(310px, 72vw); height: 44px; white-space: nowrap; }
  .theme-btn { min-width: 48px; white-space: nowrap; }
  .theme-btn:hover, .issue-sel:focus { border-color: var(--chrome-ink-soft); outline: none; }

  /* 嵌套子页返回导航栏 */
  .subpage-bar {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
    padding: 0 0 16px; margin-bottom: 24px;
    border-bottom: 1px solid var(--rule);
  }
  .back-btn {
    display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px 0 0;
    background: transparent; border: 0; color: var(--accent);
    font-size: var(--fs-meta); font-weight: 700; cursor: pointer; text-decoration: none;
  }
  .back-btn:hover { text-decoration: underline; text-underline-offset: 4px; }
  .subpage-crumb {
    font-family: var(--mono); font-size: var(--fs-meta); color: var(--ink-faint);
  }

  /* 通用动作按钮（严格扁平档案风，无多余圆角重阴影） */
  .btn-primary, .btn-ghost {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 44px; padding: 0 16px; border-radius: 2px;
    font-size: var(--fs-meta); font-weight: 700; text-decoration: none; cursor: pointer;
    white-space: nowrap;
  }
  .btn-primary {
    background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent);
  }
  .btn-primary:hover { opacity: 0.9; }
  .btn-ghost {
    background: transparent; color: var(--ink); border: 1px solid var(--rule);
  }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

  /* 真实新闻配图框架 */
  .photo-figure {
    margin: 0; position: relative; overflow: hidden;
    background: var(--paper-deep); border: 1px solid var(--rule);
  }
  .photo-figure img {
    width: 100%; aspect-ratio: 16 / 9; object-fit: cover;
  }
  .photo-cap {
    padding: 8px 12px; font-size: var(--fs-meta); color: var(--ink-faint);
    border-top: 1px solid var(--rule); background: var(--paper-elev);
    line-height: 1.45;
  }

  /* 页脚（为底部悬浮播客留出充足安全高度） */
  .site-footer {
    max-width: 980px; margin: 0 auto;
    padding: 24px 20px calc(108px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--rule);
    font-family: var(--mono); font-size: var(--fs-meta); color: var(--ink-faint);
    display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px;
  }
  .site-footer a {
    color: var(--ink-soft); text-decoration: underline;
    text-decoration-color: var(--accent); text-underline-offset: 3px;
  }

  /* 返回顶部按钮（位于悬浮播客条正上方，永不重叠） */
  .back-top {
    position: fixed; right: 20px; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); z-index: 85;
    width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid var(--accent); background: var(--paper-elev); color: var(--accent);
    font-size: var(--fs-body); cursor: pointer;
    display: grid; place-items: center;
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
  }
  .back-top.show { opacity: 1; pointer-events: auto; }

  /* 悬浮音频播客条 + 醒目「选集」悬浮按钮（全页滚动常驻） */
  .audio-dock {
    position: fixed; right: 20px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    z-index: 100; width: min(460px, calc(100vw - 24px));
    background: var(--paper-elev); color: var(--ink);
    border: 1px solid var(--rule); border-radius: 4px;
    box-shadow: var(--dock-shadow); overflow: hidden;
  }
  .dock-bar-track {
    height: 3px; width: 100%; background: var(--rule);
  }
  .dock-bar-fill {
    height: 100%; width: 0%; background: var(--accent);
    transition: width 0.2s linear;
  }
  .dock-main {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px;
  }
  .dock-play {
    flex: 0 0 44px; width: 44px; height: 44px; border-radius: 50%;
    background: var(--accent); color: var(--accent-ink); border: 0;
    font-size: var(--fs-body); font-weight: 700; cursor: pointer;
    display: grid; place-items: center;
  }
  .dock-play:hover { opacity: 0.92; }
  .dock-info {
    flex: 1; min-width: 0; background: transparent; border: 0; padding: 0;
    text-align: left; color: inherit; cursor: pointer; min-height: 44px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .dock-title {
    font-size: var(--fs-meta); font-weight: 700; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .dock-sub {
    font-family: var(--mono); font-size: var(--fs-meta); color: var(--ink-faint);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .dock-list-btn {
    flex: 0 0 auto; min-height: 44px; padding: 0 14px; border-radius: 2px;
    background: var(--chrome); color: var(--chrome-ink);
    border: 1px solid var(--chrome);
    font-size: var(--fs-meta); font-weight: 700; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .dock-list-btn:hover { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .dock-count {
    font-family: var(--mono); color: var(--accent-ink); background: var(--accent);
    padding: 1px 6px; border-radius: 2px; font-size: var(--fs-meta);
  }
  .dock-list-btn:hover .dock-count {
    background: var(--chrome); color: var(--chrome-ink);
  }

  /* 悬浮选集抽屉 */
  .audio-backdrop {
    position: fixed; inset: 0; background: var(--scrim); z-index: 98;
    display: none;
  }
  .audio-backdrop.open { display: block; }
  .audio-drawer {
    position: fixed; right: 20px; bottom: calc(86px + env(safe-area-inset-bottom, 0px));
    z-index: 101; width: min(460px, calc(100vw - 24px));
    max-height: min(64vh, 520px);
    background: var(--paper-elev); color: var(--ink);
    border: 1px solid var(--rule); border-radius: 4px;
    box-shadow: var(--dock-shadow);
    display: none; flex-direction: column; overflow: hidden;
  }
  .audio-drawer.open { display: flex; }
  .drawer-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 10px 14px; border-bottom: 1px solid var(--rule); background: var(--paper-deep);
  }
  .drawer-title {
    font-family: var(--serif); font-size: var(--fs-body); font-weight: 700; color: var(--ink);
  }
  .drawer-close {
    width: 44px; height: 44px; background: transparent; border: 0;
    color: var(--ink-soft); font-size: var(--fs-h3); cursor: pointer;
  }
  .drawer-controls {
    padding: 10px 14px; border-bottom: 1px solid var(--rule);
    display: flex; flex-direction: column; gap: 8px;
  }
  .drawer-seek-row {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--mono); font-size: var(--fs-meta); color: var(--ink-faint);
  }
  .drawer-seek {
    flex: 1; accent-color: var(--accent); min-height: 36px; cursor: pointer;
  }
  .drawer-btn-row {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  }
  .drawer-ctrl-group { display: inline-flex; align-items: center; gap: 6px; }
  .rate-btn {
    min-height: 44px; min-width: 44px; padding: 0 8px;
    background: transparent; color: var(--ink-faint);
    border: 1px solid transparent; border-radius: 2px;
    font-family: var(--mono); font-size: var(--fs-meta); cursor: pointer;
  }
  .rate-btn.active { color: var(--accent); border-color: var(--accent); font-weight: 700; }
  .drawer-list {
    overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 0;
  }
  .ep-item {
    width: 100%; min-height: 52px; padding: 10px 14px;
    background: transparent; border: 0; border-bottom: 1px solid var(--rule);
    text-align: left; color: var(--ink); cursor: pointer;
    display: grid; grid-template-columns: 52px minmax(0, 1fr) auto;
    align-items: center; gap: 10px;
  }
  .ep-item:last-child { border-bottom: 0; }
  .ep-item:hover { background: var(--paper-deep); }
  .ep-item.active { background: var(--accent-soft); }
  .ep-num {
    font-family: var(--mono); font-size: var(--fs-meta); font-weight: 700;
    color: var(--accent);
  }
  .ep-meta { min-width: 0; }
  .ep-name {
    font-size: var(--fs-meta); font-weight: 700; color: var(--ink);
    line-height: 1.4;
  }
  .ep-group {
    font-size: var(--fs-meta); color: var(--ink-faint); line-height: 1.35;
  }
  .ep-state {
    font-family: var(--mono); font-size: var(--fs-meta); color: var(--accent); font-weight: 700;
    white-space: nowrap;
  }

  @media (max-width: 640px) {
    :root { --fs-h1: 28px; --fs-h2: 22px; --fs-h3: 18px; --fs-body: 16.5px; }
    .chrome-inner {
      padding: 4px max(12px, env(safe-area-inset-left)) 4px max(12px, env(safe-area-inset-right));
      gap: 4px 10px;
    }
    .brand { font-size: var(--fs-body); gap: 8px; }
    .brand-logo { width: 28px; height: 28px; flex: 0 0 28px; }
    .nav-group { gap: 12px; }
    .chrome-ctrl { width: 100%; justify-content: space-between; }
    .issue-sel { flex: 1; max-width: none; height: 44px; padding: 0 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .audio-dock {
      left: 10px; right: 10px; width: auto;
      bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    }
    .audio-drawer {
      left: 10px; right: 10px; width: auto;
      bottom: calc(80px + env(safe-area-inset-bottom, 0px));
    }
    .back-top {
      right: 12px; bottom: calc(84px + env(safe-area-inset-bottom, 0px));
    }
    .site-footer {
      padding: 20px 16px calc(104px + env(safe-area-inset-bottom, 0px));
    }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
  @media print {
    .layer-chrome, .audio-dock, .audio-drawer, .audio-backdrop, .back-top, .reading-progress, .subpage-bar {
      display: none !important;
    }
    blockquote, figure { break-inside: avoid; page-break-inside: avoid; }
    h2, h3 { break-after: avoid; page-break-after: avoid; }
  }


  main.daily-shell {
    max-width: 980px;
    margin: 0 auto;
    padding: 28px max(20px, env(safe-area-inset-left)) 56px max(20px, env(safe-area-inset-right));
    overflow-wrap: break-word;
  }
  main.daily-shell.reading-mode {
    max-width: 680px;
  }

  /* 首页封面头图头条（非对称双栏编辑版式，0 卡片套卡片） */
  .hero-lead {
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
    gap: 28px;
    align-items: start;
    padding-bottom: 32px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 28px;
  }
  .hero-kicker {
    font-family: var(--mono); font-size: var(--fs-meta); color: var(--accent);
    letter-spacing: 0.04em; margin: 0 0 10px; font-weight: 700;
  }
  .hero-lead h1 {
    font-family: var(--serif); font-size: var(--fs-h1);
    line-height: 1.16; font-weight: 700; letter-spacing: -0.015em;
    margin: 0 0 16px; color: var(--ink);
  }
  .hero-excerpt {
    font-size: var(--fs-body); line-height: 1.72; color: var(--ink-soft);
    margin: 0 0 20px;
  }
  .hero-actions {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  }

  /* 今日三件大事（宏观市场 / 国际局势 / 国内与产业 三列横栏，0 嵌套卡片） */
  .top3-section {
    padding-bottom: 28px; margin-bottom: 28px;
    border-bottom: 1px solid var(--rule);
  }
  .top3-grid {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 18px 24px;
  }
  .top3-item {
    display: flex; flex-direction: column; gap: 8px;
    padding-top: 12px; border-top: 2px solid var(--rule);
    text-decoration: none; color: inherit;
  }
  .top3-item:hover { border-top-color: var(--accent); }
  .top3-item:hover .top3-title { color: var(--accent); }
  .top3-tag {
    font-family: var(--mono); font-size: var(--fs-meta); font-weight: 700;
    color: var(--accent); letter-spacing: 0.04em;
  }
  .top3-title {
    font-family: var(--serif); font-size: var(--fs-h3); font-weight: 700;
    line-height: 1.35; margin: 0; color: var(--ink);
  }
  .top3-desc {
    font-size: var(--fs-meta); line-height: 1.65; color: var(--ink-soft); margin: 0;
  }

  /* 日期条 + 板块筛选 + 搜索 */
  .filter-bar {
    display: flex; flex-direction: column; gap: 12px;
    padding-bottom: 20px; margin-bottom: 28px;
    border-bottom: 1px solid var(--rule);
  }
  .date-strip {
    display: flex; align-items: center; gap: 8px;
    overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
    padding-bottom: 2px;
  }
  .date-strip::-webkit-scrollbar { display: none; }
  .date-btn {
    flex: 0 0 auto; min-height: 44px; padding: 0 14px;
    background: transparent; color: var(--ink-soft);
    border: 1px solid var(--rule); border-radius: 2px;
    font-family: var(--mono); font-size: var(--fs-meta); cursor: pointer;
    white-space: nowrap;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--ink); }
  .date-btn.active {
    background: var(--chrome); color: var(--chrome-ink); border-color: var(--chrome); font-weight: 700;
  }
  .filter-row {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
  }
  .domain-tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  .dom-btn {
    min-height: 44px; padding: 0 14px;
    background: transparent; color: var(--ink-faint);
    border: 0; border-bottom: 2px solid transparent;
    font-size: var(--fs-meta); font-weight: 700; cursor: pointer;
  }
  .dom-btn:hover { color: var(--ink); }
  .dom-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .search-input {
    min-height: 44px; width: min(300px, 100%); padding: 0 12px;
    background: var(--paper-elev); color: var(--ink);
    border: 1px solid var(--rule); border-radius: 2px;
    font-size: var(--fs-meta);
  }
  .search-input:focus { border-color: var(--accent); outline: none; }

  /* 区块标头 */
  .sec-head {
    display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px;
    margin: 0 0 18px;
  }
  .sec-title {
    font-family: var(--serif); font-size: var(--fs-h2); font-weight: 700;
    margin: 0; color: var(--ink); position: relative; padding-left: 14px;
  }
  .sec-title::before {
    content: ""; position: absolute; left: 0; top: 5px; bottom: 5px;
    width: 4px; background: var(--accent);
  }
  .sec-meta {
    font-family: var(--mono); font-size: var(--fs-meta); color: var(--ink-faint);
  }

  /* 今日图文精选（真实新闻照片 2 列编辑格） */
  .photo-section {
    padding-bottom: 32px; margin-bottom: 32px;
    border-bottom: 1px solid var(--rule);
  }
  .photo-grid {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 24px 28px;
  }
  .photo-story {
    display: flex; flex-direction: column; gap: 10px;
    text-decoration: none; color: inherit;
    padding-bottom: 16px; border-bottom: 1px solid var(--rule);
  }
  .photo-story:hover .ps-title { color: var(--accent); }
  .ps-img-wrap {
    overflow: hidden; background: var(--paper-deep); border: 1px solid var(--rule);
  }
  .ps-img-wrap img {
    width: 100%; aspect-ratio: 16 / 10; object-fit: cover;
  }
  .ps-meta {
    font-family: var(--mono); font-size: var(--fs-meta); color: var(--ink-faint);
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .ps-dom { color: var(--accent); font-weight: 700; }
  .ps-title {
    font-family: var(--serif); font-size: var(--fs-h3); font-weight: 700;
    line-height: 1.38; color: var(--ink); margin: 0;
  }
  .ps-desc {

<script>
(() => {
  const DATA = JSON.parse(document.getElementById("daily-data").textContent);

  /* 日夜主题同步 + 顶部进度条 + 返回顶部 */
  const themeBtn = document.getElementById("theme-btn");
  function applyTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    try { localStorage.setItem("em-theme", t); } catch (e) {}
    if (themeBtn) themeBtn.textContent = t === "dark" ? "日间" : "夜间";
  }
  let savedTheme = "light";
  try { savedTheme = localStorage.getItem("em-theme") || "light"; } catch (e) {}
  applyTheme(savedTheme);
  if (themeBtn) {
    themeBtn.addEventListener("click", () => {
      const cur = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      applyTheme(cur);
    });
  }

  const prog = document.getElementById("reading-progress");
  const backTop = document.getElementById("back-top");
  function syncScroll() {
    const y = window.scrollY || document.documentElement.scrollTop;
    const h = document.documentElement.scrollHeight - window.innerHeight;
    if (prog) prog.style.width = (h > 0 ? Math.min(100, (y / h) * 100) : 0) + "%";
    if (backTop) backTop.classList.toggle("show", y > 400);
  }
  window.addEventListener("scroll", syncScroll, { passive: true });
  syncScroll();
  if (backTop) backTop.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));

  /* 悬浮音频播放器与选集抽屉（全站统一） */
  window.EMAudio = (function() {
    const dock = document.getElementById("audio-dock");
    const drawer = document.getElementById("audio-drawer");
    const backdrop = document.getElementById("audio-backdrop");
    const player = document.getElementById("em-audio-el");
    const playBtn = document.getElementById("dock-play");
    const infoBtn = document.getElementById("dock-info");
    const listBtn = document.getElementById("dock-list-btn");
    const closeBtn = document.getElementById("drawer-close");
    const titleEl = document.getElementById("dock-title");
    const subEl = document.getElementById("dock-sub");
    const countEl = document.getElementById("dock-count");
    const drawerTitle = document.getElementById("drawer-title");
    const listEl = document.getElementById("drawer-list");
    const fillEl = document.getElementById("dock-bar-fill");
    const seekEl = document.getElementById("audio-seek");
    const curEl = document.getElementById("audio-cur");
    const durEl = document.getElementById("audio-dur");
    const prevBtn = document.getElementById("audio-prev");
    const nextBtn = document.getElementById("audio-next");

    let tracks = [];
    let currentIdx = -1;
    let currentRate = 1;
    let isOpen = false;

    function fmt(sec) {
      if (!isFinite(sec) || sec < 0) return "00:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
    }

    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function setOpen(flag) {
      isOpen = !!flag;
      if (drawer) {
        drawer.hidden = !isOpen;
        drawer.classList.toggle("open", isOpen);
      }
      if (backdrop) backdrop.classList.toggle("open", isOpen);
      if (listBtn) listBtn.setAttribute("aria-expanded", isOpen ? "true" : "false");
    }

    function renderList() {
      if (!listEl) return;
      listEl.innerHTML = tracks.map((t, i) => {
        const on = i === currentIdx;
        return `<button type="button" class="ep-item${on ? " active" : ""}" data-ep="${i}">
          <span class="ep-num">${esc(t.badge || String(i + 1).padStart(2, "0"))}</span>
          <span class="ep-meta">
            <span class="ep-name">${esc(t.title)}</span>
            <span class="ep-group">${esc(t.group || "")}</span>
          </span>
          <span class="ep-state">${on ? (player.paused ? "已选" : "播放中") : "收听"}</span>
        </button>`;
      }).join("");
      listEl.querySelectorAll(".ep-item").forEach(btn => {
        btn.addEventListener("click", () => {
          playIndex(Number(btn.dataset.ep), true);
        });
      });
    }

    function syncDock() {
      const tr = tracks[currentIdx];
      if (!tr) return;
      const playing = !player.paused && !player.ended;
      if (playBtn) {
        playBtn.textContent = playing ? "❚❚" : "▶";
        playBtn.setAttribute("aria-label", playing ? "暂停语音" : "播放语音");
      }
      if (titleEl) titleEl.textContent = (tr.badge ? tr.badge + " · " : "") + tr.title;
      if (subEl) {
        const timeStr = isFinite(player.duration) && player.duration > 0
          ? fmt(player.currentTime) + " / " + fmt(player.duration)
          : (tr.group || "点击「选集」切换章节");
        subEl.textContent = (playing ? "正在播放 · " : "") + timeStr;
      }
      renderList();
    }

    function playIndex(idx, autoPlay) {
      if (!tracks.length) return;
      if (idx < 0 || idx >= tracks.length) idx = 0;
      const tr = tracks[idx];
      const changed = idx !== currentIdx || !player.getAttribute("src");
      currentIdx = idx;
      if (changed) {
        player.src = tr.file;
        player.playbackRate = currentRate;
      }
      if (autoPlay) {
        player.play().catch(() => {});
      }
      syncDock();
    }

    function playByKey(key) {
      const idx = tracks.findIndex(t => t.key === key);
      if (idx >= 0) {
        playIndex(idx, true);
        return true;
      }
      return false;
    }

    function setTracks(list, keepPlayingIfSame) {
      tracks = Array.isArray(list) ? list.filter(t => t && t.file) : [];
      if (!tracks.length) {
        if (dock) dock.hidden = true;
        setOpen(false);
        return;
      }
      if (dock) dock.hidden = false;
      if (countEl) countEl.textContent = String(tracks.length);
      if (drawerTitle) drawerTitle.textContent = "语音播客选集（共 " + tracks.length + " 集）";
      if (!keepPlayingIfSame || currentIdx < 0 || currentIdx >= tracks.length) {
        currentIdx = 0;
        if (!player.getAttribute("src") || player.paused) {
          player.src = tracks[0].file;
          player.playbackRate = currentRate;
        }
      }
      syncDock();
    }

    if (playBtn) {
      playBtn.addEventListener("click", () => {
        if (!tracks.length) return;
        if (currentIdx < 0) {
          playIndex(0, true);
          return;
        }
        if (player.paused) player.play().catch(() => {});
        else player.pause();
        syncDock();
      });
    }
    if (infoBtn) infoBtn.addEventListener("click", () => setOpen(!isOpen));
    if (listBtn) listBtn.addEventListener("click", () => setOpen(!isOpen));
    if (closeBtn) closeBtn.addEventListener("click", () => setOpen(false));
    if (backdrop) backdrop.addEventListener("click", () => setOpen(false));
    document.addEventListener("keydown", e => { if (e.key === "Escape" && isOpen) setOpen(false); });

    if (prevBtn) prevBtn.addEventListener("click", () => { if (tracks.length) playIndex((currentIdx - 1 + tracks.length) % tracks.length, true); });
    if (nextBtn) nextBtn.addEventListener("click", () => { if (tracks.length) playIndex((currentIdx + 1) % tracks.length, true); });

    document.querySelectorAll(".rate-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        currentRate = Number(btn.dataset.rate) || 1;
        player.playbackRate = currentRate;
        document.querySelectorAll(".rate-btn").forEach(x => x.classList.toggle("active", x === btn));
      });
    });

    if (seekEl) {
      seekEl.addEventListener("input", () => {
        if (isFinite(player.duration) && player.duration > 0) {
          player.currentTime = (Number(seekEl.value) / 100) * player.duration;
        }
      });
    }

    player.addEventListener("timeupdate", () => {
      const pct = (isFinite(player.duration) && player.duration > 0) ? (player.currentTime / player.duration) * 100 : 0;
      if (fillEl) fillEl.style.width = pct.toFixed(2) + "%";
      if (seekEl) seekEl.value = String(Math.round(pct));
      if (curEl) curEl.textContent = fmt(player.currentTime);
      if (durEl) durEl.textContent = fmt(player.duration);
      if (subEl && currentIdx >= 0) {
        const playing = !player.paused && !player.ended;
        subEl.textContent = (playing ? "正在播放 · " : "") + fmt(player.currentTime) + " / " + fmt(player.duration);
      }
    });
    player.addEventListener("play", syncDock);
    player.addEventListener("pause", syncDock);
    player.addEventListener("ended", () => {
      if (currentIdx >= 0 && currentIdx + 1 < tracks.length) playIndex(currentIdx + 1, true);
      else syncDock();
    });

    return { setTracks, playIndex, playByKey, openDrawer: () => setOpen(true) };
  })();


  const mainEl = document.getElementById("daily-main");
  const esc = s => String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");

  const state = {
    day: DATA.latest_day || (DATA.days[0] || ""),
    domain: "全部",
    query: "",
    visibleBriefs: 12,
  };

  const itemById = new Map();
  (DATA.items || []).forEach(it => itemById.set(it.id, it));
  const eventById = new Map();
  (DATA.events || []).forEach(ev => eventById.set(ev.id, ev));

  // 初始化全站悬浮音频选集（今日语音 + 往期日报语音 + 本周深度周刊各集）
  if (window.EMAudio && Array.isArray(DATA.audio_tracks)) {
    window.EMAudio.setTracks(DATA.audio_tracks, false);
  }

  function parseRoute() {
    const raw = (location.hash || "").replace(/^#\/?/, "");
    if (!raw) return { view: "home" };
    if (raw === "events") return { view: "events" };
    if (raw.startsWith("event/")) return { view: "event", id: decodeURIComponent(raw.slice(6)) };
    if (raw.startsWith("headline/")) return { view: "headline", day: decodeURIComponent(raw.slice(9)) };
    if (raw.startsWith("item/")) return { view: "item", id: decodeURIComponent(raw.slice(5)) };
    if (raw.startsWith("day/")) {
      const d = decodeURIComponent(raw.slice(4));
      if ((DATA.days || []).includes(d)) state.day = d;
      return { view: "home" };
    }
    return { view: "home" };
  }

  function getHeadline(day) {
    const hmap = DATA.headlines || {};
    return hmap[day] || hmap[DATA.latest_day] || null;
  }

  function getDayItems(day) {
    return (DATA.items || []).filter(it => it.date === day);
  }

  function renderHome() {
    mainEl.classList.remove("reading-mode");
    const day = state.day;
    const hl = getHeadline(day);
    const dayItems = getDayItems(day);
    const q = state.query.trim().toLowerCase();
    const filtered = dayItems.filter(it => {
      if (state.domain !== "全部" && it.domain !== state.domain) return false;
      if (!q) return true;
      return (it.title + " " + it.summary + " " + it.source + " " + it.country).toLowerCase().includes(q);
    });

    // 1. 封面头图头条 + 今日三件大事
    const briefObj = (DATA.daily_briefs || {})[day] || null;
    const heroItem = briefObj && briefObj.headline_item_id ? itemById.get(briefObj.headline_item_id) : null;
    const heroPhoto = (heroItem && heroItem.photo) || (hl && hl.photo) || (filtered.find(x => x.photo) || {}).photo || (dayItems.find(x => x.photo) || {}).photo || null;
    const heroPhotoHtml = heroPhoto ? `
      <figure class="photo-figure">
        <img src="${esc(heroPhoto.file)}" alt="${esc(heroPhoto.caption || (briefObj ? briefObj.headline_title : (hl ? hl.title : "今日新闻实景图")))}" width="${heroPhoto.width || 960}" height="${heroPhoto.height || 540}">
        <figcaption class="photo-cap">${esc(heroPhoto.caption || "")}${heroPhoto.source ? " · 图源：" + esc(heroPhoto.source) : ""}</figcaption>
      </figure>
    ` : "";

    const hlDay = hl ? hl.day : day;
    const hlTrackKey = "daily-" + hlDay;
    const hasHlAudio = (DATA.audio_tracks || []).some(t => t.key === hlTrackKey);
    const heroTitle = (briefObj && briefObj.headline_title) || (hl && hl.title) || "今日经济与时政要闻";
    const heroLead = (briefObj && briefObj.headline_lead) || (hl && hl.lead) || "点击下方任意图文或要闻条目，进入独立阅读页查看完整摘要与原始信源。";
    const heroCtaHref = hl ? ("#/headline/" + encodeURIComponent(hl.day)) : (heroItem ? ("#/item/" + encodeURIComponent(heroItem.id)) : "");

    const heroHtml = `
      <section class="hero-lead" aria-label="今日头条">
        ${heroPhotoHtml}
        <div>
          <p class="hero-kicker">今日主线 · ${esc(day)}</p>
          <h1>${esc(heroTitle)}</h1>
          <p class="hero-excerpt">${esc(heroLead)}</p>
          <div class="hero-actions">
            ${heroCtaHref ? `<a class="btn-primary" href="${heroCtaHref}">阅读深度简读 →</a>` : ""}
            ${hasHlAudio ? `<button class="btn-ghost" type="button" id="hero-play-btn">收听今日语音</button>` : ""}
            <button class="btn-ghost" type="button" id="hero-drawer-btn">打开语音选集</button>
          </div>
        </div>
      </section>
    `;

    const top3List = (briefObj && Array.isArray(briefObj.top3) && briefObj.top3.length) ? briefObj.top3 : [];
    const top3Html = top3List.length ? `
      <section class="top3-section" aria-label="今日三件大事">
        <div class="sec-head">
          <h2 class="sec-title">今日三件大事</h2>
          <span class="sec-meta">宏观市场 · 国际局势 · 国内与产业</span>
        </div>
        <div class="top3-grid">
          ${top3List.map(ev => {
            const targetHref = ev.item_id && itemById.has(ev.item_id) ? ("#/item/" + encodeURIComponent(ev.item_id)) : "#/headline/" + encodeURIComponent(day);
            return `
              <a class="top3-item" href="${targetHref}">
                <span class="top3-tag">${esc(ev.tag || "要闻")}</span>
                <h3 class="top3-title">${esc(ev.title || "")}</h3>
                <p class="top3-desc">${esc(ev.summary || "")}</p>
              </a>
            `;
          }).join("")}
        </div>
      </section>
    ` : "";

    // 2. 日期与筛选栏
    const dateBtns = (DATA.days || []).map(d =>
      `<button type="button" class="date-btn${d === day ? " active" : ""}" aria-pressed="${d === day ? "true" : "false"}" data-day="${esc(d)}">${esc(d.slice(5))}</button>`
    ).join("");
    const doms = ["全部", "经济", "政治", "军事"];
    const domBtns = doms.map(dm => {
      const cnt = dm === "全部" ? dayItems.length : dayItems.filter(x => x.domain === dm).length;
      return `<button type="button" class="dom-btn${dm === state.domain ? " active" : ""}" aria-pressed="${dm === state.domain ? "true" : "false"}" data-dom="${esc(dm)}">${esc(dm)}（${cnt}）</button>`;
    }).join("");

    const filterHtml = `
      <section class="filter-bar" aria-label="日期与板块筛选">
        <div class="date-strip" role="group" aria-label="切换日报日期">${dateBtns}</div>
        <div class="filter-row">
          <div class="domain-tabs" role="group" aria-label="按板块筛选">${domBtns}</div>
          <label class="sr-only" for="daily-search">搜索当日新闻</label>
          <input class="search-input" id="daily-search" type="search" value="${esc(state.query)}" placeholder="搜索标题、摘要或机构…" aria-label="搜索当日新闻">
        </div>
      </section>
    `;

    // 3. 今日图文精选（挑最多 4 条带真实摄影图的新闻，且不重复主图）
    const photoStories = filtered.filter(it => it.photo && (!heroPhoto || it.photo.file !== heroPhoto.file)).slice(0, 4);
    const photoFallback = photoStories.length ? photoStories : filtered.filter(it => it.photo).slice(0, 4);
    const usedIds = new Set(photoFallback.map(x => x.id));

    const photoSectionHtml = photoFallback.length ? `
      <section class="photo-section" aria-label="今日图文精选">
        <div class="sec-head">
          <h2 class="sec-title">今日图文精选</h2>
          <span class="sec-meta">${esc(day)} · 实景新闻配图</span>
        </div>
        <div class="photo-grid">
          ${photoFallback.map(it => `
            <a class="photo-story" href="#/item/${encodeURIComponent(it.id)}">
              <div class="ps-img-wrap">
                <img src="${esc(it.photo.file)}" alt="${esc(it.title)}" width="${it.photo.width || 960}" height="${it.photo.height || 540}" loading="lazy">
              </div>
              <div class="ps-meta">
                <span class="ps-dom">${esc(it.domain || "综合")}</span>
                <span>${esc(it.source || "")}</span>
                <span>${esc(it.date || "")}</span>
              </div>
              <h3 class="ps-title">${esc(it.title)}</h3>
              ${it.summary ? `<p class="ps-desc">${esc(it.summary.slice(0, 82))}${it.summary.length > 82 ? "…" : ""}</p>` : ""}
            </a>
          `).join("")}
        </div>
      </section>
    ` : "";

    // 4. 今日要闻速览（档案层精简分页，点击进嵌套详情子页）
    const restItems = filtered.filter(it => !usedIds.has(it.id));
    const shown = restItems.slice(0, state.visibleBriefs);
    const remain = Math.max(0, restItems.length - shown.length);

    const briefRowsHtml = shown.length ? shown.map(it => `
      <a class="brief-row" href="#/item/${encodeURIComponent(it.id)}">
        <span class="brief-dom">${esc(it.domain || "综合")}</span>
        <div>
          <div class="brief-title">${esc(it.title)}</div>
          <div class="brief-sub">${esc(it.source || "公开信源")}${it.summary ? " · " + esc(it.summary.slice(0, 68)) + (it.summary.length > 68 ? "…" : "") : ""}</div>
        </div>
        <span class="brief-arrow">详情 →</span>
      </a>
    `).join("") : `<p class="sec-meta">当前筛选条件下暂无匹配条目。</p>`;

    const briefSectionHtml = `
      <section class="brief-section layer-archive" aria-label="今日要闻速览">
        <div class="sec-head">
          <h2 class="sec-title">今日要闻速览</h2>
          <span class="sec-meta">共 ${restItems.length} 条 · 点击任意条目查看详情</span>
        </div>
        <div>${briefRowsHtml}</div>
        ${remain > 0 ? `<div class="load-more-wrap"><button class="btn-ghost" type="button" id="load-more-btn">展开更多要闻（还有 ${remain} 条）</button></div>` : ""}
      </section>
    `;

    // 4.5 热点事件持续追溯（首页展示 6 条重点脉络，点击进入独立时间轴子页）
    const allEvents = DATA.events || [];
    const topEvents = allEvents.slice(0, 6);
    const eventsHtml = topEvents.length ? `
      <section class="events-section layer-archive" aria-label="热点事件追溯">
        <div class="sec-head">
          <h2 class="sec-title">热点事件追溯</h2>
          <a class="sec-meta" href="#/events" style="color:var(--accent);text-decoration:underline;text-underline-offset:3px;">查看全部 ${allEvents.length} 条事件脉络 →</a>
        </div>
        <div class="events-grid">
          ${topEvents.map(ev => {
            const isAct = ev.status === "追踪中";
            const span = (ev.start_date || "").slice(5) + " — " + (ev.end_date ? ev.end_date.slice(5) : "至今");
            const latestItem = (ev.timeline || [])[0];
            return `
              <a class="ev-row" href="#/event/${encodeURIComponent(ev.id)}">
                <div class="ev-head">
                  <span class="ev-status${isAct ? " active" : ""}">${esc(ev.status || "追踪中")}</span>
                  <span>${esc(span)}</span>
                  <span>${(ev.timeline || []).length} 条进展</span>
                </div>
                <h3 class="ev-name">${esc(ev.name)}</h3>
                <p class="ev-desc">${esc(ev.description || "")}</p>
                ${latestItem ? `<div class="ev-latest">最新（${esc(latestItem.date.slice(5))}）：${esc(latestItem.title)}</div>` : ""}
              </a>
            `;
          }).join("")}
        </div>
      </section>
    ` : "";

    // 5. 本周深度周刊导读横幅
    const wk = DATA.weekly_teaser;
    const weeklyHtml = wk ? `
      <section class="weekly-banner" aria-label="本周深度周刊">
        ${wk.photo ? `
          <figure class="photo-figure">
            <img src="${esc(wk.photo.file)}" alt="${esc(wk.photo.caption || wk.title)}" width="${wk.photo.width || 600}" height="${wk.photo.height || 358}" loading="lazy">
            <figcaption class="photo-cap">${esc(wk.photo.caption || "")}</figcaption>
          </figure>
        ` : ""}
        <div>
          <p class="wb-kicker">准讯周报 · ${esc(wk.week)}（${esc(wk.range || "")}）</p>
          <h2 class="wb-title">${esc(wk.title)}</h2>
          <ul class="wb-links">
            ${(wk.stories || []).map((st, idx) => `
              <li><a href="weekly.html#${encodeURIComponent(wk.week)}/story-${idx + 1}">
                <span class="wb-num">0${idx + 1}</span>
                <span>${esc(st.title)}</span>
              </a></li>
            `).join("")}
          </ul>
          <a class="btn-primary" href="weekly.html">进入准讯周报封面 →</a>
        </div>
      </section>
    ` : "";

    mainEl.innerHTML = heroHtml + top3Html + eventsHtml + filterHtml + photoSectionHtml + briefSectionHtml + weeklyHtml;

    const hpBtn = document.getElementById("hero-play-btn");
    if (hpBtn && window.EMAudio) hpBtn.addEventListener("click", () => window.EMAudio.playByKey(hlTrackKey));
    const hdBtn = document.getElementById("hero-drawer-btn");
    if (hdBtn && window.EMAudio) hdBtn.addEventListener("click", () => window.EMAudio.openDrawer());

    mainEl.querySelectorAll(".date-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        state.day = btn.dataset.day;
        state.visibleBriefs = 12;
        renderHome();
      });
    });
    mainEl.querySelectorAll(".dom-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        state.domain = btn.dataset.dom;
        state.visibleBriefs = 12;
        renderHome();
      });
    });
    const searchEl = document.getElementById("daily-search");
    if (searchEl) {
      searchEl.addEventListener("input", () => {
        state.query = searchEl.value;
        state.visibleBriefs = 12;
        const pos = searchEl.selectionStart || searchEl.value.length;
        renderHome();
        const nextInput = document.getElementById("daily-search");
        if (nextInput) {
          nextInput.focus();
          try { nextInput.setSelectionRange(pos, pos); } catch (e) {}
        }
      });
    }
    const moreBtn = document.getElementById("load-more-btn");
    if (moreBtn) {
      moreBtn.addEventListener("click", () => {
        state.visibleBriefs += 16;
        renderHome();
      });
    }
    syncScroll();
  }

  function renderHeadlinePage(day) {
    mainEl.classList.add("reading-mode");
    const hl = getHeadline(day);
    if (!hl) { renderHome(); return; }
    const hlTrackKey = "daily-" + hl.day;
    const hasAudio = (DATA.audio_tracks || []).some(t => t.key === hlTrackKey);
    const photoHtml = hl.photo ? `
      <figure class="photo-figure">
        <img src="${esc(hl.photo.file)}" alt="${esc(hl.photo.caption || hl.title)}" width="${hl.photo.width || 960}" height="${hl.photo.height || 540}">
        <figcaption class="photo-cap">${esc(hl.photo.caption || "")}${hl.photo.source ? " · 图源：" + esc(hl.photo.source) : ""}</figcaption>
      </figure>
    ` : "";

    mainEl.innerHTML = `
      <div class="subpage-bar">
        <a class="back-btn" href="#/day/${encodeURIComponent(hl.day)}">← 返回今日日报</a>
        <span class="subpage-crumb">今日头条深读 · ${esc(hl.day)}</span>
      </div>
      <article class="sub-article">
        <h1>${esc(hl.title)}</h1>
        <div class="sub-meta">
          <span>日期：${esc(hl.day)}</span>
          ${hl.source ? `<span>线索来源：${esc(hl.source)}</span>` : ""}
        </div>
        ${photoHtml}
        <div class="sub-prose">
          ${(hl.paragraphs || []).map(p => `<p>${esc(p)}</p>`).join("")}
        </div>
        <div class="sub-actions">
          ${hasAudio ? `<button class="btn-primary" type="button" id="sub-play-btn">收听本篇语音</button>` : ""}
          ${hl.orig_url ? `<a class="btn-ghost" href="${esc(hl.orig_url)}" target="_blank" rel="noopener noreferrer">查看原始公告 ↗</a>` : ""}
          <a class="btn-ghost" href="#/day/${encodeURIComponent(hl.day)}">← 返回日报首页</a>
        </div>
      </article>
    `;
    const sp = document.getElementById("sub-play-btn");
    if (sp && window.EMAudio) sp.addEventListener("click", () => window.EMAudio.playByKey(hlTrackKey));
    window.scrollTo({ top: 0, left: 0, behavior: "instant" });
    requestAnimationFrame(() => window.scrollTo(0, 0));
    syncScroll();
  }

  function renderItemPage(id) {
    mainEl.classList.add("reading-mode");
    const it = itemById.get(id);
    if (!it) { renderHome(); return; }
    state.day = it.date || state.day;
    const related = getDayItems(it.date).filter(x => x.id !== it.id && x.domain === it.domain).slice(0, 4);
    const photoHtml = it.photo ? `
      <figure class="photo-figure">
        <img src="${esc(it.photo.file)}" alt="${esc(it.title)}" width="${it.photo.width || 960}" height="${it.photo.height || 540}">
        <figcaption class="photo-cap">${esc(it.photo.caption || it.title)}${it.photo.source ? " · 图源：" + esc(it.photo.source) : ""}</figcaption>
      </figure>
    ` : "";

    mainEl.innerHTML = `
      <div class="subpage-bar">
        <a class="back-btn" href="#/day/${encodeURIComponent(it.date || state.day)}">← 返回 ${esc(it.date || "")} 日报</a>
        <span class="subpage-crumb">${esc(it.domain || "综合")} · 新闻详情</span>
      </div>
      <article class="sub-article">
        <h1>${esc(it.title)}</h1>
        <div class="sub-meta">
          <span>日期：${esc(it.date || "—")}</span>
          <span>板块：${esc(it.domain || "综合")}${it.subdomain ? " / " + esc(it.subdomain) : ""}</span>
          <span>信源：${esc(it.source || "公开媒体")}</span>
          ${it.country ? `<span>地区：${esc(it.country)}</span>` : ""}
        </div>
        ${photoHtml}
        <div class="sub-prose">
          <p>${esc(it.summary || "该条目来自当日采集信源，可点击下方链接直达原始报道全文。")}</p>
        </div>
        <div class="sub-actions">
          ${it.url ? `<a class="btn-primary" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">阅读原始报道原文 ↗</a>` : ""}
          <a class="btn-ghost" href="#/day/${encodeURIComponent(it.date || state.day)}">← 返回日报列表</a>
        </div>
        ${related.length ? `
          <section class="related-list layer-archive" aria-label="同日相关报道">
            <h2>同日「${esc(it.domain || "综合")}」相关要闻</h2>
            ${related.map(r => `
              <a class="brief-row" href="#/item/${encodeURIComponent(r.id)}">
                <span class="brief-dom">${esc(r.domain || "")}</span>
                <div>
                  <div class="brief-title">${esc(r.title)}</div>
                  <div class="brief-sub">${esc(r.source || "")}</div>
                </div>
                <span class="brief-arrow">查看 →</span>
              </a>
            `).join("")}
          </section>
        ` : ""}
      </article>
    `;
    window.scrollTo({ top: 0, left: 0, behavior: "instant" });
    requestAnimationFrame(() => window.scrollTo(0, 0));
    syncScroll();
  }

  function renderEventsIndex() {
    mainEl.classList.remove("reading-mode");
    const allEvents = DATA.events || [];
    const activeCnt = allEvents.filter(e => e.status === "追踪中").length;
    mainEl.innerHTML = `
      <div class="subpage-bar">
        <a class="back-btn" href="#/day/${encodeURIComponent(state.day)}">← 返回今日日报</a>
        <span class="subpage-crumb">热点事件持续追溯 · 共 ${allEvents.length} 条（追踪中 ${activeCnt} 条）</span>
      </div>
      <section class="events-section layer-archive" aria-label="全部热点事件追溯" style="border-bottom:0;margin-bottom:0;">
        <div class="sec-head">
          <h1 style="font-family:var(--serif);font-size:var(--fs-h1);line-height:1.18;margin:0;color:var(--ink);">热点事件追溯</h1>
          <span class="sec-meta">跨日串联同一事件的演变时间轴</span>
        </div>
        <div class="events-grid">
          ${allEvents.map(ev => {
            const isAct = ev.status === "追踪中";
            const span = (ev.start_date || "").slice(5) + " — " + (ev.end_date ? ev.end_date.slice(5) : "至今");
            const latestItem = (ev.timeline || [])[0];
            return `
              <a class="ev-row" href="#/event/${encodeURIComponent(ev.id)}">
                <div class="ev-head">
                  <span class="ev-status${isAct ? " active" : ""}">${esc(ev.status || "追踪中")}</span>
                  <span>${esc(span)}</span>
                  <span>${(ev.timeline || []).length} 条进展</span>
                </div>
                <h2 class="ev-name">${esc(ev.name)}</h2>
                <p class="ev-desc">${esc(ev.description || "")}</p>
                ${latestItem ? `<div class="ev-latest">最新（${esc(latestItem.date.slice(5))}）：${esc(latestItem.title)}</div>` : ""}
              </a>
            `;
          }).join("")}
        </div>
      </section>
    `;
    window.scrollTo({ top: 0, left: 0, behavior: "instant" });
    requestAnimationFrame(() => window.scrollTo(0, 0));
    syncScroll();
  }

  function renderEventPage(id) {
    mainEl.classList.add("reading-mode");
    const ev = eventById.get(id);
    if (!ev) { renderEventsIndex(); return; }
    const span = (ev.start_date || "") + " 至 " + (ev.end_date || "持续追踪中");
    const tl = ev.timeline || [];
    const heroPhoto = (tl.find(x => x.photo) || {}).photo || null;
    const photoHtml = heroPhoto ? `
      <figure class="photo-figure">
        <img src="${esc(heroPhoto.file)}" alt="${esc(ev.name)}" width="${heroPhoto.width || 960}" height="${heroPhoto.height || 540}">
        <figcaption class="photo-cap">${esc(heroPhoto.caption || ev.name)}${heroPhoto.source ? " · 图源：" + esc(heroPhoto.source) : ""}</figcaption>
      </figure>
    ` : "";

    mainEl.innerHTML = `
      <div class="subpage-bar">
        <a class="back-btn" href="#/events">← 全部事件追溯</a>
        <span class="subpage-crumb">${esc(ev.status || "追踪中")} · 共 ${tl.length} 条进展</span>
      </div>
      <article class="sub-article">
        <h1>${esc(ev.name)}</h1>
        <div class="sub-meta">
          <span>状态：${esc(ev.status || "追踪中")}</span>
          <span>时间跨度：${esc(span)}</span>
          <span>关联报道：${tl.length} 条</span>
        </div>
        ${ev.description ? `<blockquote>${esc(ev.description)}</blockquote>` : ""}
        ${photoHtml}
        <section class="layer-archive" aria-label="事件演变时间轴">
          <div class="tl-rail">
            ${tl.map(node => `
              <div class="tl-node">
                <div class="tl-date">
                  <span>${esc(node.date || "")}</span>
                  <span>${esc(node.domain || "")}</span>
                  <span class="tl-src">${esc(node.source || "")}</span>
                </div>
                <a class="tl-title" href="#/item/${encodeURIComponent(node.id)}">${esc(node.title)}</a>
                ${node.summary ? `<p class="tl-sum">${esc(node.summary)}</p>` : ""}
                ${node.url ? `<a class="tl-link" href="${esc(node.url)}" target="_blank" rel="noopener noreferrer">查看原始报道 ↗</a>` : ""}
              </div>
            `).join("")}
          </div>
        </section>
        <div class="sub-actions">
          <a class="btn-ghost" href="#/events">← 查看全部事件脉络</a>
          <a class="btn-ghost" href="#/day/${encodeURIComponent(state.day)}">返回今日日报</a>
        </div>
      </article>
    `;
    window.scrollTo({ top: 0, left: 0, behavior: "instant" });
    requestAnimationFrame(() => window.scrollTo(0, 0));
    syncScroll();
  }

  function router() {
    const r = parseRoute();
    const navLinks = document.querySelectorAll(".nav-group .nav-link");
    if (navLinks.length >= 2) {
      const onEv = r.view === "events" || r.view === "event";
      navLinks[0].classList.toggle("active", !onEv);
      navLinks[1].classList.toggle("active", onEv);
    }
    if (r.view === "events") renderEventsIndex();
    else if (r.view === "event") renderEventPage(r.id);
    else if (r.view === "headline") renderHeadlinePage(r.day);
    else if (r.view === "item") renderItemPage(r.id);
    else renderHome();
  }

  window.addEventListener("hashchange", router);
  router();
})();
</script>
</body>
</html>
