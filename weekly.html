ody":"这周最拧巴的一幕是：中俄美领导人首次面对面会晤，气氛缓和；但同周美国财政部仍发了涉俄制裁通用许可，授权范围还不公开。市场没等细节，先跌为敬——标普500五日累计跌5.45%，恐慌指数五日涨47.33%。这说明交易员读到的信号是：高层缓和归缓和，底下制裁官僚照常发单。对普通人来说，这种“上面握手、下面卡脖”的状态，意味着油价和物价的波动不会因为一场峰会就平息。","refs":["M12"]},{"heading":"谁在真正承压：银行与贸易商","takeaway":"许可不透明，银行只能按最严口径卡结算，成本层层往下传。","body":"通用许可发了，但逐条清单不公开，受影响交易笔数也不披露。美元清算银行不敢赌，只能按最严合规口径预留保证金、收紧信用证。跨国贸易商每笔涉俄交易都要先算合规成本，绕道和保证金溢价最终会摊进大宗商品价格。这周布伦特原油收89.87美元，单日跌2.29%，但布伦特与WTI价差五日变化不大，说明绕道成本还没完全反映。真正承压的是中小贸易商和出口制造企业——订单还在，结算通道却变窄了。","refs":["M12","KB-A82A294F"]},{"heading":"落到普通人：物价、饭碗与养老金","takeaway":"制裁摩擦推高能源和物流成本，最终落在油价、物价和就业上。","body":"这周黄金单日跌3.98%，美债收益率降到4.912%，说明避险资金在债市和黄金之间来回倒。对普通人来说，更实在的传导是：制裁摩擦推高能源和航运的合规成本，最终会体现在油价和进口商品价格上。国内制造业PMI已连续低于50，10月读49.3，出口企业订单增量难找，就业和工资承压。养老金和储蓄方面，全球债市波动加大，国内稳健型理财收益也会跟着晃。中小企业主这周最该盯的，是跨境结算通道有没有变窄、信用证开立有没有变慢。","refs":["KB-TH-005","KB-TH-006"]}],"spillovers":"【峰会暖风，制裁冷雨】元首握手不等于制裁放松，市场先按最坏情况定价。 这周最拧巴的一幕是：中俄美领导人首次面对面会晤，气氛缓和；但同周美国财政部仍发了涉俄制裁通用许可，授权范围还不公开。市场没等细节，先跌为敬——标普500五日累计跌5.45%，恐慌指数五日涨47.33%。这说明交易员读到的信号是：高层缓和归缓和，底下制裁官僚照常发单。对普通人来说，这种“上面握手、下面卡脖”的状态，意味着油价和物价的波动不会因为一场峰会就平息。\n\n【谁在真正承压：银行与贸易商】许可不透明，银行只能按最严口径卡结算，成本层层往下传。 通用许可发了，但逐条清单不公开，受影响交易笔数也不披露。美元清算银行不敢赌，只能按最严合规口径预留保证金、收紧信用证。跨国贸易商每笔涉俄交易都要先算合规成本，绕道和保证金溢价最终会摊进大宗商品价格。这周布伦特原油收89.87美元，单日跌2.29%，但布伦特与WTI价差五日变化不大，说明绕道成本还没完全反映。真正承压的是中小贸易商和出口制造企业——订单还在，结算通道却变窄了。\n\n【落到普通人：物价、饭碗与养老金】制裁摩擦推高能源和物流成本，最终落在油价、物价和就业上。 这周黄金单日跌3.98%，美债收益率降到4.912%，说明避险资金在债市和黄金之间来回倒。对普通人来说，更实在的传导是：制裁摩擦推高能源和航运的合规成本，最终会体现在油价和进口商品价格上。国内制造业PMI已连续低于50，10月读49.3，出口企业订单增量难找，就业和工资承压。养老金和储蓄方面，全球债市波动加大，国内稳健型理财收益也会跟着晃。中小企业主这周最该盯的，是跨境结算通道有没有变窄、信用证开立有没有变慢。","counter_evidence":{"misreading":"很多人以为元首会晤缓和了，制裁就会松，市场下跌只是短期情绪。","rebuttal":"本周硬事实不支持这个说法。会晤同周，美国财政部照发涉俄通用许可，授权范围还不公开；市场用脚投票，标普500五日跌5.45%，纳指跌5.80%，恐慌指数五日涨47.33%。如果只是情绪，债市不会同步走强——10年期美债收益率降到4.912%，单日下行14个基点。这说明资金在按“制裁摩擦持续”重新定价，而不是按“缓和”定价。峰会改变的是气氛，没改变制裁官僚的发单节奏。","flip_condition":"如果未来两周美国财政部公开通用许可的逐条清单、明确缩小授权范围，且标普500收复本周跌幅，说明市场读错了，缓和确实在传导。"},"watch_signals":[{"object":"美国财政部OFAC通用许可55F与115D","metric":"是否公开逐条授权清单与到期日","threshold":"两周内发布详细清单","deadline":"2026-12-05","verdict":"发了清单说明制裁边界变清晰，银行和贸易商合规成本下降；没发说明不透明状态延续，摩擦成本继续压在结算环节。"},{"object":"标普500与恐慌指数","metric":"五日累计涨跌幅与波动率是否回落","threshold":"标普500五日转正、恐慌指数回落至25以下","deadline":"2026-12-05","verdict":"到了说明市场认为缓和信号压过制裁摩擦；没到说明风险重定价还没结束。"},{"object":"布伦特原油与布伦特-WTI价差","metric":"价差是否继续走阔","threshold":"价差突破7美元/桶","deadline":"2026-12-05","verdict":"价差走阔说明绕道和合规成本在推高欧洲能源账单；价差平稳说明摩擦成本还没完全传导到油价。"},{"object":"中国制造业PMI与出口企业结算","metric":"PMI能否回到50以上、信用证开立周期是否缩短","threshold":"PMI回到50以上","deadline":"2026-12-31","verdict":"回到50以上说明出口订单和结算通道在改善；继续低于50说明中小企业的饭碗压力还没缓解。"}],"chars":2115,"problems":[]},{"chain_id":"CHAIN-ENERGY-CHOKEPOINT","chain_name":"全球能源供应与海运咽喉全链条","title":"霍尔木兹海峡连环触雷，油价为何没飞起来","subtitle":"本周霍尔木兹海峡连续有油轮触雷爆炸，布伦特原油却从高位回落。一边是火药味，一边是投机资金撤退，普通人要看清：能源账单和物价的传导没那么快，但航运保费和炼厂利润已经在悄悄变化。","plain_lead":"本周霍尔木兹海峡连续有油轮触雷爆炸，布伦特原油却从高位回落。一边是火药味，一边是投机资金撤退，普通人要看清：能源账单和物价的传导没那么快，但航运保费和炼厂利润已经在悄悄变化。","domains":["军事","政治","经济"],"days":["2026-11-16","2026-11-18","2026-11-19","2026-11-20","2026-11-21"],"mechanisms":["M11","M10"],"kb_ids":["KB-A82A294F"],"refs":["KB-A82A294F","M11","M10"],"source_count":8,"score":57.45,"facts_timeline":["【11-16】伊朗方面称，两艘油轮在霍尔木兹海峡触雷爆炸，其中一艘载有超过200万桶原油。","【11-18】美国官员称对伊朗格什姆岛实施“自卫”打击；同日安理会通过决议，将联中稳定团任务期限延长一年。","【11-19】“华盛顿”号航空母舰离开中东地区。","【11-20】普京表示，克里米亚大桥遭袭后，不再讨论海上停火。","【11-21】美国商品期货交易委员会数据显示，截至11月17日当周，投机者持有的纽约原油净多头头寸减少9765手，降至60819手，创10个月新低。"],"stakeholders":[{"actor":"伊朗革命卫队（强硬派）","layer":"政治内部派系","one_liner":"海峡北岸的实际控制者，用触雷事件当谈判筹码。","incentive":"想用航道安全风险逼美国在制裁和核问题上让步。","leverage":"手里有快艇、水雷和岸防导弹，能随时让海峡“不安全”。","constraint":"怕封锁过头把伊朗自己的石油出口也掐断，现金流撑不住。","impact":"受益","evidence_tag":"激励推演·待核"},{"actor":"伊朗务实派（石油出口部门）","layer":"政治内部派系","one_liner":"靠卖油吃饭的一派，最怕海峡真被封。","incentive":"想保住每天几十万桶的出口量，换回外汇稳汇率。","leverage":"手里有石油出口通道和客户关系，能跟强硬派讨价还价。","constraint":"怕强硬派玩过火，把买家吓跑、保费抬到没人敢接货。","impact":"受损","evidence_tag":"激励推演·待核"},{"actor":"伦敦劳合社战争险承保辛迪加","layer":"资本与金融派系","one_liner":"给油轮定“过海峡保费”的人，风险一升就涨价。","incentive":"想把战争险保费抬到覆盖潜在船体损失的水平。","leverage":"手里有再保险 capacity，能决定哪些船东买不到保险。","constraint":"怕保费涨太猛导致船东干脆停航，自己也没生意做。","impact":"受益","evidence_tag":"激励推演·待核"},{"actor":"大宗商品对冲基金与原油做市商","layer":"资本与金融派系","one_liner":"本周净多头创10个月新低，地缘脉冲没打动他们。","incentive":"想等宏观去杠杆风险释放完再重新押注地缘溢价。","leverage":"手里有期货和期权仓位，能放大或压平短期油价波动。","constraint":"怕美联储紧缩预期压过地缘事件，做多被套。","impact":"分化/待核","evidence_tag":"公开实锤"},{"actor":"中远海能、招商轮船等油运央企","layer":"国内企业与部门","one_liner":"油轮运价弹性大，海峡风险推高绕行和保费成本。","incentive":"想借运距拉长和运价上涨改善油运板块利润。","leverage":"手里有 VLCC 船队和国内炼厂长期合同，议价能力较强。","constraint":"怕船员安全和保险成本吃掉运价涨幅，实际利润待核。","impact":"分化/待核","evidence_tag":"激励推演·待核"},{"actor":"国内炼厂与化工企业（三桶油炼化板块）","layer":"国内企业与部门","one_liner":"原料升水和运费一起挤压，成品油调价却滞后。","incentive":"想通过成品油调价机制把成本传导出去。","leverage":"手里有国内零售网络和发改委调价窗口。","constraint":"怕调价跟不上原油和运费涨幅，毛利被两头挤。","impact":"受损","evidence_tag":"激励推演·待核"},{"actor":"美国行政层（白宫经济团队）","layer":"政治内部派系","one_liner":"怕油价反弹推高通胀，影响选票和利率决策。","incentive":"想让油价稳在80美元出头，别把通胀预期打上去。","leverage":"手里有战略石油储备释放和外交斡旋工具。","constraint":"怕国会鹰派逼着对伊朗动手，油价失控。","impact":"分化/待核","evidence_tag":"激励推演·待核"},{"actor":"海湾产油国王室（沙特、阿联酋）","layer":"产业链纵深","one_liner":"靠海峡出口原油，航道安全直接关系财政和外资。","incentive":"想保航道畅通，同时维持油价在财政平衡线以上。","leverage":"手里有闲置产能和东西向管道，能部分绕开海峡。","constraint":"怕伊朗把海峡搞乱，自己出口和基建引资一起受损。","impact":"受损","evidence_tag":"激励推演·待核"}],"insights":[{"heading":"油价没飞：投机盘先撤了","takeaway":"地缘事件没转化成持续买盘，原油净多头反而创10个月新低。","body":"本周布伦特原油收在89.87美元，比周内高点回落；纽约原油收83.62美元，布伦特与纽约价差6.25美元。按常理，海峡触雷该推高油价，但美国商品期货交易委员会数据显示，截至11月17日当周，投机者持有的纽约原油净多头减少9765手，降到60819手，创10个月新低。这说明对冲基金和做市商更怕宏观去杠杆，而不是地缘断供。油价里那点“战争溢价”被仓位调整压住了。","refs":["M11"]},{"heading":"保费和运费：真正的隐形涨价","takeaway":"油轮战争险保费和绕行成本在涨，但还没到停航阈值。","body":"海峡风险最先反映在保险和运费上。伦敦劳合社的战争险承保辛迪加会重新评估通行风险，保费跳升直接加在船东账上。船东要么接受涨价，要么绕行好望角，运距拉长、运费抬升。本周波罗的海干散货指数报2980点，上海出口集装箱运价指数报3572.33点，已经包含部分绕行成本。对国内油运央企来说，运价弹性是利好，但船员安全和保险成本会吃掉一部分利润，实际影响待核。","refs":["M11"]},{"heading":"普通人账单：传导慢，但方向清楚","takeaway":"油价和运费上涨会慢慢渗到成品油、化工品和航空票价里。","body":"对普通人来说，最直接的感受是加油站和机票。国内成品油调价看的是国际原油变化率，有滞后；本周原油绝对价格不算离谱，所以短期油价账单压力有限。但运费和战争险保费会先推高化工原料、塑料和航空燃油成本，再慢慢传到日用品价格。10月中国CPI环比为0，说明下游需求偏弱，企业很难把成本全转出去，中小企业毛利会被挤压。储蓄和养老保险收益方面，全球避险情绪推高波动率指数到35.89，股市承压，但国内利率环境相对稳，养老金短期冲击可控。","refs":["M10","M11"]}],"spillovers":"【油价没飞：投机盘先撤了】地缘事件没转化成持续买盘，原油净多头反而创10个月新低。 本周布伦特原油收在89.87美元，比周内高点回落；纽约原油收83.62美元，布伦特与纽约价差6.25美元。按常理，海峡触雷该推高油价，但美国商品期货交易委员会数据显示，截至11月17日当周，投机者持有的纽约原油净多头减少9765手，降到60819手，创10个月新低。这说明对冲基金和做市商更怕宏观去杠杆，而不是地缘断供。油价里那点“战争溢价”被仓位调整压住了。\n\n【保费和运费：真正的隐形涨价】油轮战争险保费和绕行成本在涨，但还没到停航阈值。 海峡风险最先反映在保险和运费上。伦敦劳合社的战争险承保辛迪加会重新评估通行风险，保费跳升直接加在船东账上。船东要么接受涨价，要么绕行好望角，运距拉长、运费抬升。本周波罗的海干散货指数报2980点，上海出口集装箱运价指数报3572.33点，已经包含部分绕行成本。对国内油运央企来说，运价弹性是利好，但船员安全和保险成本会吃掉一部分利润，实际影响待核。\n\n【普通人账单：传导慢，但方向清楚】油价和运费上涨会慢慢渗到成品油、化工品和航空票价里。 对普通人来说，最直接的感受是加油站和机票。国内成品油调价看的是国际原油变化率，有滞后；本周原油绝对价格不算离谱，所以短期油价账单压力有限。但运费和战争险保费会先推高化工原料、塑料和航空燃油成本，再慢慢传到日用品价格。10月中国CPI环比为0，说明下游需求偏弱，企业很难把成本全转出去，中小企业毛利会被挤压。储蓄和养老保险收益方面，全球避险情绪推高波动率指数到35.89，股市承压，但国内利率环境相对稳，养老金短期冲击可控。","counter_evidence":{"misreading":"很多人一看到海峡触雷就喊“油价要飞、通胀重来”，把地缘事件直接当成买油信号。","rebuttal":"本周硬事实不支持这个说法。布伦特原油收89.87美元，当日还跌了2.29%；纽约原油收83.62美元，只涨0.49%。投机者净多头降到60819手，创10个月新低，说明专业资金在撤，不是在追。美国10月能源CPI环比0.699%，低于机械基准，通胀传导并不急。海峡风险真实存在，但油价被宏观去杠杆和需求偏弱压住了。","flip_condition":"如果布伦特原油连续三天收在95美元以上，且纽约原油净多头回升到8万手以上，说明地缘溢价重新主导，我们的判断需要修正。"},"watch_signals":[{"object":"布伦特原油期货","metric":"收盘价是否站稳95美元","threshold":"连续3个交易日收于95美元以上","deadline":"2026-11-28","verdict":"到了说明地缘溢价重新主导，油价传导会加快；没到说明宏观需求担忧仍压着油价。"},{"object":"纽约原油投机净多头","metric":"CFTC每周持仓报告","threshold":"回升至8万手以上","deadline":"2026-11-28","verdict":"到了说明对冲基金重新押注地缘风险；没到说明资金仍在撤退。"},{"object":"波罗的海干散货指数","metric":"是否突破3200点","threshold":"单周涨幅超过7%","deadline":"2026-11-28","verdict":"到了说明绕行和运费压力实质上升；没到说明航运市场还没恐慌。"},{"object":"国内成品油调价窗口","metric":"发改委是否上调零售限价","threshold":"每吨上调超过150元","deadline":"2026-11-28","verdict":"到了说明原油和运费成本开始向终端传导；没到说明国内调价机制还在消化波动。"}],"chars":2083,"problems":[]},{"chain_id":"CHAIN-AI","chain_name":"AI 算力—模型—云厂—资本—监管全链条","title":"英伟达换帅与GPU大融资：算力热下的冷思考","subtitle":"这周英伟达创始人黄仁勋辞职，同时阿波罗和高盛完成440亿美元GPU抵押融资。一边是AI芯片龙头人事巨变，一边是华尔街用债务给算力扩张加杠杆，普通人要留意电价、就业和养老钱会不会被这股热浪波及。","plain_lead":"这周英伟达创始人黄仁勋辞职，同时阿波罗和高盛完成440亿美元 ，快速响应能力","constraint":"海外资本开支一旦放缓，产能过剩","impact":"分化/待核","evidence_tag":"激励推演·待核"},{"actor":"美股科技期权做市与杠杆量化资金","layer":"资本与金融派系","one_liner":"借人事震荡放大波动，加剧市场流动性紧张","incentive":"从波动率上升中获利","leverage":"高频交易与期权做市能力","constraint":"监管收紧与流动性风险","impact":"受益","evidence_tag":"激励推演·待核"}],"insights":[{"heading":"创始人离场，英伟达护城河还在吗","takeaway":"黄仁勋辞职短期冲击信心，但英伟达的CUDA生态和客户黏性仍是缓冲垫。","body":"黄仁勋辞职的消息让英伟达股价承压，但公司真正的护城河不只是创始人。英伟达的CUDA软件生态让开发者习惯了它的平台，换芯片意味着重写代码，成本很高。目前微软、谷歌等大客户仍在大量采购GPU，订单能见度不低。不过，管理层变动可能影响长期战略节奏，竞争对手博通定制芯片和AMD也在追赶。接下来要看新管理层能否稳住客户，以及下一代芯片能否按时交付。","refs":["M7"]},{"heading":"GPU抵押融资：算力资产化的双刃剑","takeaway":"440亿美元GPU抵押融资把算力变成金融资产，但GPU贬值快，杠杆风险不容忽视。","body":"阿波罗和高盛完成440亿美元GPU抵押融资，本质是把GPU未来产生的算力收入打包成债券卖给投资者。这能让云厂商和AI公司提前拿到钱去买更多芯片，加速扩张。但GPU技术迭代快，三五年后可能大幅贬值，抵押物价值缩水会引发连锁反应。2000年电信光缆过度建设导致大量坏账的教训不远。现在华尔街用债务给算力扩张加杠杆，一旦AI需求增速放缓，违约风险可能传导到基金和养老金。","refs":["KB-TH-003","KB-TH-006"]},{"heading":"普通人要留意的账单与饭碗","takeaway":"AI算力扩张推高电力需求，电费可能上涨；同时就业市场分化，储蓄收益受资本市场波动影响。","body":"AI数据中心是耗电大户，美国天然气20日涨幅超过四成，电价压力逐渐显现。普通家庭电费账单可能间接被推高。就业方面，AI编程和网络安全模型替代部分白领工作，微软推便宜模型会加速企业采用，相关岗位工资增长可能放缓。国内出海链企业订单波动，影响工厂开工和工人收入。另外，养老金和理财收益与股市挂钩，英伟达人事震荡引发科技股大跌，标普500单日跌3.7%，波动率指数飙升26%，普通人的储蓄账户也会感受到寒意。","refs":["M13","KB-TH-004"]}],"spillovers":"【创始人离场，英伟达护城河还在吗】黄仁勋辞职短期冲击信心，但英伟达的CUDA生态和客户黏性仍是缓冲垫。 黄仁勋辞职的消息让英伟达股价承压，但公司真正的护城河不只是创始人。英伟达的CUDA软件生态让开发者习惯了它的平台，换芯片意味着重写代码，成本很高。目前微软、谷歌等大客户仍在大量采购GPU，订单能见度不低。不过，管理层变动可能影响长期战略节奏，竞争对手博通定制芯片和AMD也在追赶。接下来要看新管理层能否稳住客户，以及下一代芯片能否按时交付。\n\n【GPU抵押融资：算力资产化的双刃剑】440亿美元GPU抵押融资把算力变成金融资产，但GPU贬值快，杠杆风险不容忽视。 阿波罗和高盛完成440亿美元GPU抵押融资，本质是把GPU未来产生的算力收入打包成债券卖给投资者。这能让云厂商和AI公司提前拿到钱去买更多芯片，加速扩张。但GPU技术迭代快，三五年后可能大幅贬值，抵押物价值缩水会引发连锁反应。2000年电信光缆过度建设导致大量坏账的教训不远。现在华尔街用债务给算力扩张加杠杆，一旦AI需求增速放缓，违约风险可能传导到基金和养老金。\n\n【普通人要留意的账单与饭碗】AI算力扩张推高电力需求，电费可能上涨；同时就业市场分化，储蓄收益受资本市场波动影响。 AI数据中心是耗电大户，美国天然气20日涨幅超过四成，电价压力逐渐显现。普通家庭电费账单可能间接被推高。就业方面，AI编程和网络安全模型替代部分白领工作，微软推便宜模型会加速企业采用，相关岗位工资增长可能放缓。国内出海链企业订单波动，影响工厂开工和工人收入。另外，养老金和理财收益与股市挂钩，英伟达人事震荡引发科技股大跌，标普500单日跌3.7%，波动率指数飙升26%，普通人的储蓄账户也会感受到寒意。","counter_evidence":{"misreading":"很多人说英伟达创始人辞职是AI泡沫破裂的信号，算力故事要结束了。","rebuttal":"这种说法把人事变动和行业基本面混为一谈。本周微软照常发布新模型，Anthropic成功融资11亿美元，SpaceX还要买英伟达芯片，440亿美元GPU融资也顺利定价。这些事实说明算力需求仍在，资本还在涌入。英伟达的CUDA生态和客户关系不是一个人能带走的。真正的风险在于杠杆和电力瓶颈，而不是创始人离开。把短期情绪当成长期趋势，容易误判。","flip_condition":"如果接下来一个季度英伟达大客户公开削减GPU订单，或者GPU抵押融资出现违约，那才说明算力扩张真的踩了刹车。"},"watch_signals":[{"object":"英伟达","metric":"下一季度数据中心收入增速","threshold":"同比增速低于20%","deadline":"2027-02-28","verdict":"低于20%说明客户采购放缓，算力热降温；高于20%则需求仍强。"},{"object":"美国天然气期货","metric":"20日涨跌幅","threshold":"涨幅超过50%","deadline":"","verdict":"涨幅超过50%意味着电力成本压力加大，可能推高电价和通胀。"},{"object":"A股光模块龙头","metric":"季度订单环比变化","threshold":"环比下降10%","deadline":"","verdict":"订单环比下降10%显示海外云厂资本开支收缩，出海链企业承压。"}],"chars":1942,"problems":[]},{"chain_id":"CHAIN-US-RATES-LIQUIDITY","chain_name":"美债期限溢价、财政主导与全球美元流动性链条","title":"加息预期回摆，全球资产同跌","subtitle":"这周市场突然重新押注美联储还要加息，股票、黄金、铜一起大跌，恐慌指数跳升。普通人要留意：房贷和消费贷利率可能更高更久，保险和理财收益、出口企业订单也会跟着晃。","plain_lead":"这周市场突然重新押注美联储还要加息，股票、黄金、铜一起大跌，恐慌指数跳升。普通人要留意：房贷和消费贷利率可能更高更久，保险和理财收益、出口企业订单也会跟着晃。","domains":["政治","经济"],"days":["2026-11-16","2026-11-18","2026-11-19","2026-11-20","2026-11-21"],"mechanisms":["M4","M6","M10"],"kb_ids":["KB-TH-005","KB-TH-006","KB-TH-001","KB-TH-002","KB-711E73CF"],"refs":["KB-TH-005","KB-TH-006","KB-TH-001","KB-TH-002","KB-711E73CF","M10"],"source_count":8,"score":42.3,"facts_timeline":["【11-20】法国巴黎银行预计美联储将连续三次加息、每次25个基点，市场对12月加息的押注随之升温。","【11-21】利率衍生品合约显示，交易员不再充分定价12月加息25个基点，预期出现摇摆。","【11-20】美股标普500单日跌3.70%，纳斯达克跌5.28%，恐慌指数一天跳升26.20%至35.89。","【11-20】黄金期货单日跌3.98%至3539美元，铜期货跌2.84%，股、金、铜同跌。","【11-19】澳大利亚10月就业减少4.35万人，失业率4.9%高于预期，全球利率敏感部门承压。"],"stakeholders":[{"actor":"美联储内部鹰派官员（以沃勒等近期讲话为代表）","layer":"政治内部派系","one_liner":"担心通胀没压干净，倾向把高利率维持更久","incentive":"想保住抗通胀信誉，不愿过早放松","leverage":"手握投票权，能通过讲话引导市场预期","constraint":"怕就业和金融稳定出问题，也怕被指干预政治","impact":"分化/待核","evidence_tag":"公开实锤"},{"actor":"美国财政部发债部门","layer":"政治内部派系","one_liner":"赤字大、发债多，长债供给压着期限溢价","incentive":"想压低发债成本，多发短债少发长债","leverage":"能调整国债发行久期结构","constraint":"短债发太多也有再融资风险，两党预算谈不拢","impact":"分化/待核","evidence_tag":"激励推演·待核"},{"actor":"一级交易商与对冲基金基差交易资金","layer":"资本与金融派系","one_liner":"靠国债期货现货价差加杠杆，波动一大就被追保证金","incentive":"想赚稳定小价差，不愿被强制平仓","leverage":"高杠杆、持仓集中，能放大市场波动","constraint":"恐慌指数飙升时保证金追缴，被迫抛售股票、黄金、铜","impact":"受损","evidence_tag":"激励推演·待核"},{"actor":"华尔街风险平价与波动率目标基金","layer":"资本与金融派系","one_liner":"波动率一高就自动减仓，顺周期抛售放大跌幅","incentive":"想控制组合波动，守住回撤线","leverage":"规模大，调仓会带动市场同向波动","constraint":"规则逼着他们在下跌时卖出，没法逆势","impact":"受损","evidence_tag":"激励推演·待核"},{"actor":"美国利率敏感型科技公司与地产按揭部门","layer":"产业链纵深","one_liner":"长久期估值靠低利率撑着，利率预期一升就挨打","incentive":"想融资成本降下来、估值稳住","leverage":"盈利和现金流是底牌，但久期长怕折现率","constraint":"加息预期回摆直接压估值和再融资","impact":"受损","evidence_tag":"公开实锤"},{"actor":"中国货币与外汇管理部门","layer":"国内企业与部门","one_liner":"要在稳汇率和稳利率之间找平衡","incentive":"想稳住人民币预期和跨境资金流动","leverage":"外储3.4万亿美元、黄金储备3064亿美元","constraint":"美元利率高企压缩降息空间，怕资本外流","impact":"分化/待核","evidence_tag":"公开实锤"},{"actor":"国内保险机构与养老金组合","layer":"国内企业与部门","one_liner":"前三季度平均综合投资收益率仅2.28%，资产端压力大","incentive":"想找收益稳、久期匹配的资产","leverage":"保费和养老金持续流入，但可选高收益资产少","constraint":"全球利率高波动，固收和权益两头难做","impact":"受损","evidence_tag":"公开实锤"},{"actor":"全球央行与海外主权买盘（中日欧官方配置）","layer":"资本与金融派系","one_liner":"美债海外大买家，配置节奏影响期限溢价","incentive":"想兼顾安全性和收益，分散美元资产风险","leverage":"持仓量大，买或抛都能影响收益率","constraint":"地缘政治和汇率波动让他们更谨慎，部分转向购金","impact":"分化/待核","evidence_tag":"激励推演·待核"}],"insights":[{"heading":"加息预期为何突然回摆","takeaway":"通胀数据其实偏弱，但银行和鹰派官员讲话把加息预期又拉了回来。","body":"这周最拧巴的是：10月美国CPI环比只涨0.35%，比市场模型预测的0.475%还低；失业率4.1%也低于预期。按理说该松口气，但法国巴黎银行却发报告预计美联储连续三次加息，利率衍生品市场对12月加息的定价也跟着摇摆。说白了，市场怕的不是现在通胀高，而是怕美联储觉得“还不够紧”。这种预期一反复，长久期资产最受伤——纳斯达克一天跌5.28%，黄金跌3.98%，铜跌2.84%，股、金、铜同跌，说明大家不是在交易基本面，而是在交易“钱更贵了”。","refs":["KB-TH-005","KB-TH-002"]},{"heading":"去杠杆放大器：谁在被迫卖","takeaway":"恐慌指数一天跳26%，高杠杆的基差交易和波动率基金被迫减仓，把跌幅放大。","body":"恐慌指数从二十多一下跳到35.89，单日涨26.20%。这种时候，一级交易商和对冲基金的国债期货现货基差交易最难受——他们赚的是很小的价差，靠高杠杆放大，一旦波动率飙升，保证金追缴就逼着他们卖资产。同时，风险平价和波动率目标基金有规则约束：波动率一高就自动降仓位。这两类资金同时顺周期抛售，股票、黄金、铜一起跌就不奇怪了。这不是谁看空经济，而是杠杆机制在逼人卖。对普通人来说，这意味着市场下跌可能比基本面显示的更急、更猛。","refs":["KB-TH-006"]},{"heading":"普通人的账单与饭碗","takeaway":"利率更高更久，房贷、消费贷、保险收益和出口订单都会受影响。","body":"对国内老百姓来说，这件事通过几条线传过来。第一，美元利率高企压缩国内降息空间，房贷和消费贷利率下行会更慢，背贷款的家庭月供压力难减。第二，保险机构前三季度平均综合投资收益率只有2.28%，养老金和理财收益想明显改善不容易。第三，人民币汇率稳在6.68附近，但美元强、全球需求弱，国内制造业PMI已连续低于50，10月读数为49.3，外向型中小企业的订单和成本两头受挤。第四，黄金大跌对囤金的大妈是账面损失，但也提醒：避险资产不是只涨不跌。","refs":["KB-711E73CF","M10"]}],"spillovers":"【加息预期为何突然回摆】通胀数据其实偏弱，但银行和鹰派官员讲话把加息预期又拉了回来。 这周最拧巴的是：10月美国CPI环比只涨0.35%，比市场模型预测的0.475%还低；失业率4.1%也低于预期。按理说该松口气，但法国巴黎银行却发报告预计美联储连续三次加息，利率衍生品市场对12月加息的定价也跟着摇摆。说白了，市场怕的不是现在通胀高，而是怕美联储觉得“还不够紧”。这种预期一反复，长久期资产最受伤——纳斯达克一天跌5.28%，黄金跌3.98%，铜跌2.84%，股、金、铜同跌，说明大家不是在交易基本面，而是在交易“钱更贵了”。\n\n【去杠杆放大器：谁在被迫卖】恐慌指数一天跳26%，高杠杆的基差交易和波动率基金被迫减仓，把跌幅放大。 恐慌指数从二十多一下跳到35.89，单日涨26.20%。这种时候，一级交易商和对冲基金的国债期货现货基差交易最难受——他们赚的是很小的价差，靠高杠杆放大，一旦波动率飙升，保证金追缴就逼着他们卖资产。同时，风险平价和波动率目标基金有规则约束：波动率一高就自动降仓位。这两类资金同时顺周期抛售，股票、黄金、铜一起跌就不奇怪了。这不是谁看空经济，而是杠杆机制在逼人卖。对普通人来说，这意味着市场下跌可能比基本面显示的更急、更猛。\n\n【普通人的账单与饭碗】利率更高更久，房贷、消费贷、保险收益和出口订单都会受影响。 对国内老百姓来说，这件事通过几条线传过来。第一，美元利率高企压缩国内降息空间，房贷和消费贷利率下行会更慢，背贷款的家庭月供压力难减。第二，保险机构前三季度平均综合投资收益率只有2.28%，养老金和理财收益想明显改善不容易。第三，人民币汇率稳在6.68附近，但美元强、全球需求弱，国内制造业PMI已连续低于50，10月读数为49.3，外向型中小企业的订单和成本两头受挤。第四，黄金大跌对囤金的大妈是账面损失，但也提醒：避险资产不是只涨不跌。","counter_evidence":{"misreading":"很多人说“通胀已经降了，美联储马上要降息，股债金都会涨”。","rebuttal":"本周硬事实不支持这个说法。10月美国CPI环比0.35%确实低于模型预测，但法国巴黎银行偏偏在这时上调加息预期，利率衍生品市场对12月加息的定价也在摇摆。更关键的是，恐慌指数一天跳26.20%，股票、黄金、铜同跌，说明市场在交易“钱更贵”，而不是“钱要松”。美国失业率4.1%偏低、平均时薪环比0.37%还高于模型，就业和工资没明显走弱，美联储鹰派有理由继续嘴硬。国内制造业PMI 49.3低于50，说明外需和实体并不强，但这不是降息就能立刻解决的。","flip_condition":"如果12月美联储明确不加息、且美国CPI连续两个月继续低于模型预测，同时恐慌指数回落到20以下，那说明本周的加息预期回摆只是虚惊，反方成立。"},"watch_signals":[{"object":"美联储12月议息会议","metric":"是否加息25个基点","threshold":"加息或不加息","deadline":"2026-12-16","verdict":"加息说明鹰派占上风，利率更高更久；不加息说明市场本周的恐慌可能过度。"},{"object":"美国10年期国债收益率","metric":"是否站稳4.9%以上","threshold":"4.9%","deadline":"2026-12-31","verdict":"站稳说明期限溢价还在升，全球资产估值继续承压；回落说明压力缓解。"},{"object":"恐慌指数VIX","metric":"是否回落到25以下","threshold":"25","deadline":"2026-12-15","verdict":"回落到25以下说明去杠杆压力减轻；继续高于30说明高杠杆资金还在被迫卖。"},{"object":"中国制造业PMI","metric":"能否回到50以上","threshold":"50","deadline":"2026-12-31","verdic ignals":[]},{"chain_id":"","chain_name":"往期周刊专题","title":"制裁「许可化」与霍尔木兹：风险溢价为何不共振","plain_lead":"","domains":[],"mechanisms":[],"facts_timeline":[],"stakeholders":[],"insights":[{"heading":"① 结果","takeaway":"","body":"11 月 13 日至 14 日，美国财政部 OFAC 发布俄罗斯相关制裁的通用许可证 55F 与 115D；同期布伦特- WTI 价差维持在 7.80 美元/桶，霍尔木兹方向出现触雷事件，WTI 5 日下跌 2.18%、收于 88.25 美元。","refs":[]},{"heading":"② 刻度","takeaway":"","body":"真正的封锁会让三个指标同时跳升：价差走阔、战争险保费上涨、SCFI 运价上行。本周三者均未共振，VIX 也未站上 25。","refs":[]},{"heading":"③ 机制","takeaway":"","body":"制裁正在从「断供」转向「许可 + 合规成本」：通用许可证意味着大部分交易被允许，但每一笔都需要合规审查，成本上升快于供应中断。地缘上同理——触雷是战术骚扰，不是航道封锁。","refs":[]},{"heading":"④ 反证","takeaway":"","body":"如果真是断航，价差应该立刻走阔到两位数、保费跳升；实际没有，说明市场把这次事件定价为「可控骚扰」。这一判断与台账 11 月 14 日的可证伪条目（价差、保费、VIX 三者共振与否）一致。","refs":[]},{"heading":"⑤ 结论","takeaway":"","body":"**合规成本是慢变量，断供是快变量。**本周的证据支持前者。观察信号：Brent-WTI 价差是否在 11 月 30 日前突破 12 美元；霍尔木兹油轮战争险费率是否跳升。","refs":[]}],"counter_evidence":{},"watch_signals":[]}],"ach":{"hypotheses":[],"matrix_headers":[],"evidences":[],"summary_row":null,"kb_notes":[],"divergence_notes":[]},"audio":{}}],"kb_map":{"KB-197A9FF9":{"kb_id":"KB-197A9FF9","title":"CPI 分项与核心 CPI","domain":"宏观","type":"基础概念","status":"legacy","one":"核心 CPI 是\"剔掉会自己乱动的东西\"，不是官方通胀。","excerpt":"核心 CPI 是\"剔掉会自己乱动的东西\"，不是官方通胀。\n中国 CPI 的结构\n八大类：食品烟酒、衣着、居住、生活用品及服务、交通通信、教育文化娱乐、医疗保健、其他用品及服务。2026 年 1 月起以 2025 年为基期（2026–2030 使用期），分类有调整——官方解读稿里出现\"食品烟酒及在外餐饮类\"，即把\"在外餐饮\"从原大类中单列。\n关键限制：统计局不公布逐项权数，只公布分类结构与影响值（\"某类价格变动影响 CPI 上涨/下降约 X 个百分点\"）。所以严格的权重×增速拆解拿不到，但影响值可以直接用——它已经把权重乘进去了，这比权重本身更好用。\n美国 CPI 的结构\nBLS 每月公布 CPI-U 的 8 大支出类别相对重要性（relative importance），权重完全公开。headline = All Items；core = All Items Less Food and Energy。\n核心 CP","indicators":[],"opposing":[]},"KB-4053C878":{"kb_id":"KB-4053C878","title":"PMI 扩散指数","domain":"宏观","type":"口径陷阱","status":"legacy","one":"50 是\"变好与变差的企业数打平\"，不是增速 50%。","excerpt":"50 是\"变好与变差的企业数打平\"，不是增速 50%。\n定义与公式（国家统计局官方原文）\n\u003e \"DI＝'增加'选项百分比×1＋'持平'选项百分比×0.5。即正向回答的企业个数百分比加上回答不变的百分比的一半。\"\n即 DI = %增加 + 0.5 × %持平，取值 0–100，50 是临界值。\n制造业 PMI 是 5 个扩散指数的加权合成（官方公式）\n\u003e PMI = 新订单×30% + 生产×25% + 从业人员×20% + (100 − 供应商配送时间)×15% + 原材料库存×10%\n注意 供应商配送时间要取反——它是逆指数：配送越慢说明需求越旺，所以取值越小对 PMI 贡献越大。\n50 到底意味着什么（本卡核心）\n- 50 = 认为\"比上月好\"的企业占比 与 认为\"比上月差\"的企业占比相等。\n- 因此 50 = 环比零增长。不是\"零增长水平\"，不是\"50% 的企业在扩张\"，更不是\"增长 50%\"。\n- 51 = 略多于一","indicators":[],"opposing":[]},"KB-1E0D8877":{"kb_id":"KB-1E0D8877","title":"PPI 向 CPI 的传导","domain":"宏观","type":"基础概念","status":"legacy","one":"上游涨价能不能变成下游涨价，看需求肯不肯接。","excerpt":"上游涨价能不能变成下游涨价，看需求肯不肯接。\n传导链条是两段，别混成一段\n1. PPI 内部：生产资料（采掘 → 原材料 → 加工）→ 生活资料（食品、衣着、一般日用品、耐用消费品）。\n2. PPI 生活资料 → CPI：这才是与 CPI 直接对口的一段。\n所以看传导要看 PPI 生活资料分项，不是看 PPI 总体。 这是本卡最实用的一条操作规则。\n时滞：没有权威常数\n\"3–6 个月\"是流传最广的说法，但它不是任何一种官方口径，也不是稳定常数。现实证据指向\"传导本身在变弱\"：\n- 评级机构在 2026 年 6 月物价点评里的原话是\"需重点关注 PPI 向 CPI 传导不畅带来的中下游企业盈利压力\"。\n- 学术文献里对应的提法是\"CPI-PPI 背离的传导阻滞机制与市场分割效应\"。\n- 因此具体时滞几个月：待核。 本卡不给一个未核实的数字。\n- 有文献给出的是\"国际大宗商品 → CPI\"的时滞（1–3 个月最大反应、冲","indicators":[],"opposing":[]},"KB-65B33BAC":{"kb_id":"KB-65B33BAC","title":"一致预期从哪来","domain":"宏观","type":"业内门道","status":"legacy","one":"它是几十家机构预测的中位数，不是\"正确答案\"。","excerpt":"它是几十家机构预测的中位数，不是\"正确答案\"。\n三条主要来源\n1. 路透调查（Reuters poll） —— 最常被中文媒体引用\n每月就主要指标（CPI、PPI、PMI、GDP、社融、贸易）向几十家境内外机构发问卷，公布预估中值。\n可核对的具体形态（2026-09 一例，香港经济日报转述）：\n\u003e \"路透綜合 40 家機構預估中值顯示…中國 8 月 CPI 同比漲幅料從 7 月的 0.5% 升至 0.8%。其中 13 家機構預估中值顯示，當月 CPI 環比料上漲 0.3%。\"\n→ 同比 40 家、环比只有 13 家。 这条细节比任何方法论描述都有用（见下\"预期值可不可信\"第 1 条）。\n2. 彭博调查（Bloomberg survey） —— 机制类似，样本数十家，取中位数。具体样本量与发布节奏待核（需终端）。\n3. Wind / Choice「一致预期」 —— 数据商把卖方研报的预测做聚合，取均值或中位数。","indicators":[],"opposing":[]},"KB-3855ACCA":{"kb_id":"KB-3855ACCA","title":"产出缺口与潜在增长率","domain":"宏观","type":"基础概念","status":"legacy","one":"潜在产出看不见，只能估；估法不同，结论相反。","excerpt":"潜在产出看不见，只能估；估法不同，结论相反。\n定义\n\n产出缺口 = (实际GDP − 潜在GDP) / 潜在GDP × 100%\n\n潜在 GDP = 在不引发通胀加速的前提下，经济能持续生产的最大产出（NAIRU 概念的产出侧版本）。它是不可观测的——没有任何统计表直接给这个数。\n三类估法，各有各的病\n1. 统计滤波（HP 滤波最常用；季度数据 λ 常取 1600。也有 Baxter-King、CF 滤波）\n- 病一：端点问题（end-point problem）——最新几期的趋势估计最不稳，而政策最关心的正是最新几期。这是所有双边滤波的通病，不是 HP 独有。\n- 病二：λ 是人选的。换 λ 就换结论。\n- 病三：会把结构性断裂（疫情、产业转移、房地产长周期）平滑成\"周期性波动\"，从而把结构性问题误判为周期问题。\n2. 生产函数法（Cobb-Douglas：Y = A · K^α · (L · h)^","indicators":[],"opposing":[]},"KB-5BBA77B4":{"kb_id":"KB-5BBA77B4","title":"全球失衡与劳工议价（WFR · R−N−G · 三柱框架）","domain":"宏观","type":"基础概念","status":"legacy","one":"一国的“高制造业份额、高资本回报或顺差强势”，必须在 WFR（生产压内需指数）、R−N−G（黄金律缺口）与收编三柱*","excerpt":"一国的“高制造业份额、高资本回报或顺差强势”，必须在 WFR（生产压内需指数）、R−N−G（黄金律缺口）与收编三柱 放在一起才能读懂——单看其中任何一个数，都会把结构性挤压误读成单纯的产业领先或道德故事。\n三套已接入本地流水线的定量观察组（机制库.md · _mechanisms.md）\n1. M1：WFR 世界工厂排斥内需指数（28 国 1960–2019 面板）\n   - 定义：WFR = z(制造业增加值/GDP) + z(出口/GDP) − z(居民消费率) − z(劳动份额)。\n   - 关键直觉：生产强与需求弱同时出现，WFR 才为高正值。2019 截面重点国：韩国 +2.66、中国 +2.63（制造 26.3% / 消费 39.4% / 劳动 58.6%） vs 美","indicators":[],"opposing":[]},"KB-D2E13157":{"kb_id":"KB-D2E13157","title":"分析师看数据的顺序","domain":"宏观","type":"业内门道","status":"legacy","one":"先看方向和结构，再看预期差，最后才看同比标题。","excerpt":"先看方向和结构，再看预期差，最后才看同比标题。\n第 0 步：知道发布顺序——时间表本身就是信息\n中国（每月）\n| 时点 | 数据 | 发布方 |\n|---|---|---|\n| 月末最后一天 09:30 | 制造业 / 非制造业 PMI | 国家统计局 + 中采联 |\n| 次月 9 日左右 | CPI、PPI | 国家统计局 |\n| 次月 10–15 日（不定日） | 社融、M2、新增贷款 | 人民银行 |\n| 次月 15 日左右 | 工业增加值、固投、社零、城镇调查失业率（新闻发布会） | 国家统计局 |\n| 季后 15 天左右 | GDP 初步核算 | 国家统计局 |\n美国：ISM（月初）→ 非农（第一个周五）→ CPI / PPI（月中）→ 零售（月中）→ GDP（季末后第 1 / 2 / 3 个月末，共三次）。\n为什么顺序即信息：先发布的（PMI）会设定市场对后续数据的解读框架。PMI 弱 → 后面的工业数据弱就\"不意外\"，强就\"超","indicators":[],"opposing":[]},"KB-6D84F279":{"kb_id":"KB-6D84F279","title":"同比 / 环比 / 季调 / 折年率","domain":"宏观","type":"口径陷阱","status":"legacy","one":"同一份数据的四种算法，方向可以完全相反。","excerpt":"同一份数据的四种算法，方向可以完全相反。\n四个定义（同一条序列）\n| 读法 | 算式 | 剔除了什么 | 保留了什么 |\n|---|---|---|---|\n| 同比 YoY | P_t / P_{t-12} − 1 | 季节 | 去年基数（见《基数效应》） |\n| 环比 MoM | P_t / P_{t-1} − 1 | 什么都不剔 | 季节、节假日、工作日数 |\n| 季调环比 SA MoM | 先 X-13ARIMA-SEATS 类方法剔季节+节假日，再算环比 | 季节、节假日 | 最新一期的方向 |\n| 折年率 annualized | (1+季调环比)^k − 1，季度 k=4、月度 k=12 | 季节 | 把\"速度\"放大成\"年率\" |\n折算关系（可当场验算）\n- 同比与环比不是两个独立指标：YoY_t = (1+MoM_t)(1+YoY_{t-1}) − 1。这一条就是基数效应的代数形式。\n- 月度环比 0.2% 折年 = 1.002^","indicators":[],"opposing":[]},"KB-8C3EC8BA":{"kb_id":"KB-8C3EC8BA","title":"基数效应","domain":"宏观","type":"口径陷阱","status":"legacy","one":"同比是两年变化之比，去年高低决定今年读数。","excerpt":"同比是两年变化之比，去年高低决定今年读数。\n代数形式（可当场验算）\n\nYoY_t = (1 + MoM_t) × (1 + YoY_{t-1}) − 1\n\n即：今年的同比 = 今年环比 + 去年同月的同比 + 两者乘积。\n- 去年同月的同比 YoY_{t-1}（等价于去年同月的环比累积效应）就是基数。\n- 推论：去年同月环比大涨 → 今年同月即使环比完全正常，同比也会机械性回落，不需要任何\"经济变差\"。\n三步判断法\n1. 拆：把同比拆成\"环比贡献\"与\"基数贡献\"。基数贡献 ≈ YoY_{t-1}，可直接用去年同期值算，不需要统计局给。\n2. 看去年曲线的形状：去年是同月见顶还是同月见底？如果去年是高点，今年同月同比必然难看，与当下无关。\n3. 只信季调环比的方向：同比与环比打架时，环比是唯一还在讲\"当下\"的那个数。\n为什么不直接引用\"翘尾因素\"\n中国通胀分析里\"翘尾因素 / 新涨价因素\"的拆分就是基数贡献","indicators":[],"opposing":[]},"KB-B870AF2F":{"kb_id":"KB-B870AF2F","title":"失业率口径","domain":"宏观","type":"口径陷阱","status":"legacy","one":"美国的 U3 与 U6、中国的调查与登记，是四个不同的数。","excerpt":"美国的 U3 与 U6、中国的调查与登记，是四个不同的数。\n美国：一个官方定义 + 六档备选（BLS）\n- 官方失业率 = U-3：失业人数 / 劳动力（就业 + 失业）。BLS 原文：*\"There is only one official definition of unemployment—people who are jobless, actively seeking work, and available to take a job.\"*\n- U-1 ~ U-6 是六档 \"labor underutilization\"，每月在 *The Employment Situation* 的表 A-15 发布。BLS 对 U-6 的原文定义：\n  \u003e *\"U-6 Total unemployed, plus all people marginally attached to the labor force, plus total employed par","indicators":[],"opposing":[]},"KB-12F97D87":{"kb_id":"KB-12F97D87","title":"工业增加值与企业盈利：应收账款代理","domain":"宏观","type":"口径陷阱","status":"legacy","one":"工业增加值看“工厂到底多干了多少实物活”（量），不看“卖出去之后利润有没有回款、账期是不是被拉长”；要辨别增产是真景气还","excerpt":"工业增加值看“工厂到底多干了多少实物活”（量），不看“卖出去之后利润有没有回款、账期是不是被拉长”；要辨别增产是真景气还是无效内卷，得把工增、PPI 和工业企业应收账款放在一起读。\n三个必须同框对齐的指标（均来自国家统计局月报）\n1. 规模以上工业增加值（同比、季调环比）\n   - 是剔除价格变动的真实产出“量”（实际增长率），主要衡量采矿、制造、电热燃水三大门类的工业增值生产活动，统计对象为年主营业务收入 2000 万元及以上的工业法人单位（俗称“规上工业”）。\n   - 注意看结构：高技术制造业 / 装备制造业 vs 上游原材料 vs 出口交货值同比，避免被单一出口抢运或能源保供拉偏总体印象。\n2. 工业企业营业收入利润率 \u0026 利润累计同比\n   - 营收与利润是名义金额（量 × 价 × 利润率）。当 PPI 为负时，工增“量稳”也会被价格跌拖成“名义营收零增长”。\n   - 更致命的是“增收不增利”或“产成品存货增速 \u003e 营收增速”：","indicators":[],"opposing":[]},"KB-27027CB5":{"kb_id":"KB-27027CB5","title":"市场反应与直觉相反","domain":"宏观","type":"业内门道","status":"legacy","one":"数据落地时交易的是\"意外\"，不是\"好坏\"。","excerpt":"数据落地时交易的是\"意外\"，不是\"好坏\"。\n四个机制，按可靠性排序\n1. 已定价（price in）—— 最硬的一条\n预期形成后价格已经移动。数据落地只是消除不确定性，不提供新信息。若无意外，价格反而回吐预期阶段累积的头寸。这就是\"买预期、卖事实\"。\n推论：反应幅度取决于\"意外 ÷ 已被定价的程度\"。同一份数据，在预期充分发酵后发布，反应可以接近于零。\n2. 二阶信息 \u003e 一阶信息\n市场读的不是 headline，而是：\n- 相对预期的偏离（见《一致预期从哪来》）\n- 分项里对未来政策路径的含义\n- 这份数据是否改变央行反应函数\n所以\"强数据 → 加息预期升 → 股跌债跌\"完全可能，与\"经济好 → 股涨\"并存且不矛盾。两者不是同一个变量在作用。\n3. 头寸与流动性\n拥挤交易在数据落地时集中平仓，会把反应放大到与数据本身无关的量级。这一条无法从数据本身预测，只能从持仓、波动率、资金流观察。\n4. 叙事竞争*","indicators":[],"opposing":[]},"KB-3A64FAAD":{"kb_id":"KB-3A64FAAD","title":"数据修订","domain":"宏观","type":"口径陷阱","status":"legacy","one":"你引用的那个\"去年 GDP\"，可能已经被改过了。","excerpt":"你引用的那个\"去年 GDP\"，可能已经被改过了。\n美国 GDP：一个季度出三次（BEA 官方定义）\n\u003e *\"These estimates are released successively in the 3 months following the end of the quarter: the 'advance' estimates are released near the end of the first month, the 'second' estimates are released near the end of the second month, and the 'third' estimates are released near the end of the third month.\"*\n即：advance（第 1 个月末）→ second（第 2 个月末）→ third（第 3 个月末）。\n之后还有：年度修订（通常每年一次，改前几年）与五年一次","indicators":[],"opposing":[]},"KB-TH-001":{"kb_id":"KB-TH-001","title":"流动性陷阱与资产负债表衰退","domain":"宏观","type":"theory","status":"verified","one":"利率降到近零仍没人借钱扩产：家庭与企业从“利润最大化”转向“债务最小化”，货币政策失灵。","excerpt":"- 原始理论出处：凯恩斯《就业、利息和货币通论》（1936，流动性陷阱）；辜朝明《大衰退：宏观经济学的圣杯》（2008，资产负债表衰退）。\n- 制度前提：私人部门前期经历大幅资产价格下跌或高债务杠杆（高 DSR），且政策传导以商业银行信贷扩张为主。\n- 传导时滞：去杠杆修复通常持续 3~8 年，期间单纯降息对实体信贷的拉动弹性接近 0。\n- 与对立理论的共解现象：短期内均可能观察到「降息/宽货币后 3~6 个月内 CPI 依然低迷」。\n- 能够区分二者的关键观测：看企业与居民新增中长期信贷增速、M1 同比（活期交易需求）与私人部门偿债率（DSR）。若降息后 12 个月以上 M2 稳健但 M1 持续负剪刀差、新增企业中长贷继续萎缩且长债持续走牛，倾向本理论；若 6~12 个月内信贷脉冲企稳、M1 领先回升并随后带动核心 CPI 抬头，则倾向对立理论（KB-TH-002）。\n- 证据不足时的弃判条件：若缺少同期私人部门新增中长贷或 DSR 分项，或观察窗口不足 6 个月，不得单凭单月低 CPI 断言已进入资产负债表衰退，应标「证据不足/待核」。","indicators":["M6:BIS_HH_DEBT_GDP","M6:BIS_DSR","M3:CN_M1_M2_SCISSOR","EM:RPT_ECONOMY_PMI:MAKE_INDEX"],"opposing":[{"id":"KB-TH-002","scope":"宽货币下为何尚未出现通胀（结构性去杠杆失效 vs 货币传导时滞未到）","horizon":"6~24个月"}]},"KB-A425785C":{"kb_id":"KB-A425785C","title":"社会消费品零售总额与居民消费率","domain":"宏观","type":"口径陷阱","status":"legacy","one":"“社零”既包含一部分单位公款购买商品而不含多数房租医疗教育等居民服务消费，因此“社零增速快”不等于“居民消费率高”，两者","excerpt":"“社零”既包含一部分单位公款购买商品而不含多数房租医疗教育等居民服务消费，因此“社零增速快”不等于“居民消费率高”，两者不能混读。\n社零 vs 居民消费（GDP 支出法）的核心差异\n| 维度 | 社会消费品零售总额（社零） | 居民最终消费支出（GDP 口径） |\n|---|---|---|\n| 核心范围 | 实物商品零售 + 餐饮收入 | 实物商品 + 医疗/教育/文旅/通讯 + 自有住房虚拟租金等全部消费性服务 |\n| 购买主体 | 居民个人 + 社会集团（企事业单位、机关采购消费品，不含生产用固定资产） | 仅限于常住居民户 |\n| 发布频率 | 月度（国家统计局月度发布，有同比/环比/除汽车外口径） | 年度完整披露（部分经济体或研究有季度估算，中国月度不直接出全部居民服务总消费） |\n| 价格口径 | 主报道为名义同比，有时附扣除价格因素实际同比 | 区分名义占比（居民消费率 = 居民消费 / GDP）与不变价贡献率 |\n消费倾向与“有钱不花","indicators":[],"opposing":[]},"KB-711E73CF":{"kb_id":"KB-711E73CF","title":"社融 / 新增人民币贷款 / M2","domain":"宏观","type":"口径陷阱","status":"legacy","one":"社融看资产端借钱，M2 看负债端存款，不是一回事。","excerpt":"社融看资产端借钱，M2 看负债端存款，不是一回事。\n三个定义（PBOC 口径）\n- 社会融资规模：\"一定时期内实体经济从金融体系获得的资金总额\"。视角 = 资产端 / 资金来源。是增量指标（月度新增），另有存量（2015 年起公布）与存量同比。\n- 新增人民币贷款：社融里的一项（表内融资）。它在社融中的占比从 2002 年的 91.9% 降到 2010 年的不足 60%（PBOC 自己的数字）——这正是\"社融\"这个指标被发明出来的原因：只看贷款会\"按下葫芦浮起瓢\"。\n- M2：广义货币，是负债端 / 存款视角。与社融是同一枚硬币的两面，但不等值。\n社融的构成（四类，且会随口径调整）\n1. 表内融资：人民币贷款、外币贷款（折人民币）\n2. 表外融资：委托贷款、信托贷款、未贴现银行承兑汇票\n3. 直接融资：企业债券、政府债券、非金融企业境内股票\n4. 其","indicators":[],"opposing":[]},"KB-149AB4D0":{"kb_id":"KB-149AB4D0","title":"一般债 vs 专项债","domain":"财政","type":"基础概念","status":"legacy","one":"两者的区别只有一句话：一般债靠一般公共预算还，专项债靠政府性基金/项目收益还。这一条决定了它们的项目门槛、额度管","excerpt":"两者的区别只有一句话：一般债靠一般公共预算还，专项债靠政府性基金/项目收益还。这一条决定了它们的项目门槛、额度管理和脆弱点。\n### 法源与核心区别\n《预算法》第三十五条（对两者都适用）：地方政府举债「只能用于公益性资本支出，不得用于经常性支出」；举借的债务应当有偿还计划和稳定的偿还资金来源。\n国发〔2014〕43号（《国务院关于加强地方政府性债务管理的意见》）给出分类标准：\n\u003e 「没有收益的公益性事业发展确需政府举借一般债务的，由地方政府发行一般债券融资，主要以一般公共预算收入偿还。有一定收益的公益性事业发展确需政府举借专项债务的，由地方政府通过发行专项债券融资，以对应的政府性基金或专项收入偿还。」\n同一份文件还规定了预算归属：「将一般债务收支纳入一般公共预算管理，将专项债务收支纳入政府性基金预算管理」。\n### 一张表看完\n| 维度 | 一般债券 | 专项债券 |\n|---|---|---|\n| 对应项目 | 没","indicators":[],"opposing":[]},"KB-C0A4FA34":{"kb_id":"KB-C0A4FA34","title":"专项债\"发行\"与\"形成实物工作量\"","domain":"财政","type":"业内门道","status":"legacy","one":"\"发行\"是融资端（债券卖出去了），\"形成实物工作量\"是支出端（钱到了工地变成水泥钢筋）。中间隔着拨付和开工两道闸，93%","excerpt":"\"发行\"是融资端（债券卖出去了），\"形成实物工作量\"是支出端（钱到了工地变成水泥钢筋）。中间隔着拨付和开工两道闸，93% 的发行进度可能对应 0 的实物工作量。\n### 官方自己承认这是两件事（三处铁证）\n① 财政部 2024-10-25 发布会问答原文（第三季度财政收支情况网上新闻发布会）：\n\u003e 「截至 10 月 20 日，各地累计发行专项债券 3.63 万亿元，占全年额度的 93%，支持项目超过 3 万个。经统计，待发额度加上已发未用资金，年内各地共有 2 万亿专项债券资金可安排使用。」\n这一句是整个概念的核心证据：发行 93% 的同时，仍有一大笔钱\"已发未用\"。\n② 《国务院关于 2023 年度政府债务管理情况的报告》（2024-09-10）：\n\u003e 「建立专项债券资金支出进度预警通报制度，推动尽快形成实物工作量。」\n财政部专门建了一个\"支出进度预警\"制度——制度的存在本身，就是\"发行快但支出慢\"是常态的证明。\n③ 国办发〔2024","indicators":[],"opposing":[]},"KB-937E3610":{"kb_id":"KB-937E3610","title":"\"化债\"的三种操作：展期、置换、破产重整","domain":"财政","type":"业内门道","status":"legacy","one":"化债的主体动作是\"换\"（换期限、换利率、换主体），不是\"还\"（真金白银清偿）。三种换法对应三个风险层级，","excerpt":"化债的主体动作是\"换\"（换期限、换利率、换主体），不是\"还\"（真金白银清偿）。三种换法对应三个风险层级，动词本身就在报风险等级。\n### 一、展期（期限重组）\n做什么：与债权人协商，延长本金偿还期限、下调利率、调整还本节奏（常见\"前 N 年只付息不还本\"）。\n机制要点：不改变债权债务关系，不减少本金，只改变时间和价格。法律上是合同变更，不是违约。\n案例：2022 年 12 月，市场公开报道遵义道桥建设（集团）有限公司对约 156 亿元银行贷款进行债务重组：展期 20 年、前 10 年只付息不还本。\n（条款细节标「待核」——本卡未取得公司公告/持有人会议公告一手原文，引用时请只写\"市场公开报道\"，或先核到公告再写。）\n对谁有利：\n- 债务人（城投/地方）：立刻减压——当期还本压力归零，利率下降。\n- 银行：避免当期确认不良（不违约、不计入不良），但资产久期从 3—5 年拉到 20 年、利率下降 → 净息差、资本占用、流","indicators":[],"opposing":[]},"KB-FF454FDC":{"kb_id":"KB-FF454FDC","title":"土地出让收入","domain":"财政","type":"口径陷阱","status":"legacy","one":"卖地收的钱进的是政府性基金预算（不是一般公共预算），而且是毛收入——扣掉征拆成本后才是能花的那部分。","excerpt":"卖地收的钱进的是政府性基金预算（不是一般公共预算），而且是毛收入——扣掉征拆成本后才是能花的那部分。\n### 在哪本账里：政府性基金预算，\"地方政府性基金预算本级收入\"项下\n官方数据可以自己验算（财政部 2023 年财政收支情况）：\n- 全国政府性基金预算收入 70705 亿元（同比 −9.2%）\n- 其中地方政府性基金预算本级收入 66287 亿元（−10.1%）\n- 其中国有土地使用权出让收入 57996 亿元（−13.2%）\n占比：57996 / 70705 ≈ 82%（全国口径），57996 / 66287 ≈ 87%（地方本级口径）。\n这就是「政府性基金的主力」的量化含义——它不是主力，它基本就是全部。\n### 三个必须分清的口径\n① 收入（毛）vs 收益（净）。\n土地出让收入是毛收入。要扣掉：征地拆迁补偿、土地前期开发（七通一平）、按规定计提的各项基金（教育、农田水利等）、以及出让业务费。剩下的才是「土地出让收益","indicators":[],"opposing":[]},"KB-8B0B10B8":{"kb_id":"KB-8B0B10B8","title":"地方债的三个\"名分\"","domain":"财政","type":"口径陷阱","status":"legacy","one":"地方政府债券按用途分三类：新增债、再融资债、置换债。同样叫\"发债\"，一个在加杠杆，一个在还旧账，一个在换名分。","excerpt":"地方政府债券按用途分三类：新增债、再融资债、置换债。同样叫\"发债\"，一个在加杠杆，一个在还旧账，一个在换名分。\n### 官方分类（可核的政府答问口径）\n江门市财政局 2025-01-13 的公众答问（政府网站公开），三类定义完整：\n| 类别 | 用途 | 是否增加债务余额 |\n|---|---|---|\n| 新增债券 | 对应全国人大批准的地方债务新增限额内发行，用于筹集政府投资项目建设资金；按偿还资金来源再分为一般债券和专项债券 | 是（增加余额和限额） |\n| 置换债券 | 用于置换经清理和甄别后纳入预算管理的地方政府存量债务；置换金额原则上为 2018 年 8 月底前清理和甄别纳入预算管理的存量政府债务 | 会计上增加法定债务，但对应减少存量债务/隐性债务 |\n| 再融资债券 | 用于偿还到期政府债券及存量债务 | 否（借新还旧，余额不增） |\n### 三个年度的实际拆分（用于建立量级感）\n财政部部长向全国人大常委会的年度《政","indicators":[],"opposing":[]},"KB-D8309D5D":{"kb_id":"KB-D8309D5D","title":"城投债不是地方政府债券","domain":"财政","type":"口径陷阱","status":"legacy","one":"城投债是企业债务（城投公司发的），地方政府债券是政府债务（省政府发的）。两者法律主体、偿还责任、统计口径","excerpt":"城投债是企业债务（城投公司发的），地方政府债券是政府债务（省政府发的）。两者法律主体、偿还责任、统计口径全都不同，唯一相同的是市场对\"政府会兜底\"的预期。\n\u003e 我们在这一条上踩过坑，所以这张卡写得比别的细。踩坑的具体形态：把\"城投债违约\"当成\"地方政府债务违约\"来读，把市场预期当成法律责任。\n### 四条硬法源（都能查到原文，建议直接引）\n① 《预算法》第三十五条第三款\n\u003e 「除法律另有规定外，地方政府及其所属部门不得为任何单位和个人的债务以任何方式提供担保。」\n② 国发〔2014〕43号（《国务院关于加强地方政府性债务管理的意见》，gov.cn 全文）\n\u003e 基本原则\"分清责任\"：「明确政府和企业的责任，政府债务不得通过企业举借，企业债务不得推给政府偿还，切实做到谁借谁还、风险自担。」\n\u003e 「剥离融资平台公司政府融资职能，融资平台公司不得新增政府债务。」\n\u003e 「政府债务只能通过政府及其部门举借，不得通过企事业单位等举借*","indicators":[],"opposing":[]},"KB-D0ECE31B":{"kb_id":"KB-D0ECE31B","title":"看财政数据要看进度不看增速","domain":"财政","type":"业内门道","status":"legacy","one":"财政是\"预算年\"的流量，同比增速被基数、政策时点、一次性因素搅得很脏；真正判断\"政策落地没有\"的指标是累计完成 ÷","excerpt":"财政是\"预算年\"的流量，同比增速被基数、政策时点、一次性因素搅得很脏；真正判断\"政策落地没有\"的指标是累计完成 ÷ 年初预算，也就是进度。\n### 三种进度，各有分母\n① 支出进度 = 累计一般公共预算支出 ÷ 年初预算支出\n必须手上有年初预算数（每年 3 月《预算报告》）。有预算数才能算，没有就别算。\n一个已核实的实例（可用来自查算法是否对）：\n- 2024 年 1—9 月全国一般公共预算支出 201779 亿元（财政部 2024-10-25 发布会）\n- 2024 年全国一般公共预算支出预算约 28.5 万亿元（推算：2025 年政府工作报告称\"一般公共预算支出规模 29.7 万亿元、比上年增加 1.2 万亿元\"）\n- 进度 ≈ 201779 / 285000 ≈ 70.8%\n对照业内常用的经验区间（一季度约 24%—25%、上半年约 48%—50%、前三季度约 72%—75%）。\n本卡未找到官方发布的进度基准，上列区间标为经验值，用前请用","indicators":[],"opposing":[]},"KB-TH-005":{"kb_id":"KB-TH-005","title":"财政主导与期限溢价重定价","domain":"财政","type":"theory","status":"draft","one":"当持续高财政赤字与巨额滚续发债压倒货币独立性预期时，长端国债不再扮演无风险避风港，而是通过抬升期限溢价强行重定价所有长久","excerpt":"- 原始理论出处：Thomas Sargent \u0026 Neil Wallace（1981）《Some Unpleasant Monetarist Arithmetic》；Eric Leeper（1991）财政-货币政策交互均衡；Adrian, Crump \u0026 Moench（2013）国债期限溢价拆解。\n- 制度前提：主权政府结构性初级赤字高企、债务/GDP 处于历史高位且缺乏可信中期整固路径，市场开始质疑央行抗通胀的政治约束上限。\n- 传导时滞：发债计划超预期或拍卖遇冷可在 1~10 个交易日内冲击长端收益率；财政主导定价的制度切换通常在 1~6 个月的股债相关性漂移中确认。\n- 与对立理论的共解现象：在冲击爆发最初 1~2 周内，均可能观察到「VIX 快速走高、科技与高久期股票显著回调」。\n- 能够区分二者的关键观测：紧盯 VIX 站上 25~30 期间 10 年期美债收益率（MKT:^TNX）的方向、10Y-2Y 曲线斜率与高收益债利差。若股市连跌且 VIX 高企时 ^TNX 仍坚守高位（不跌反涨或跌幅极浅，股债正相关持续），倾向本理论（财政与期限溢价主导）；若 ^TNX 随 VIX 飙升与信用利差走阔迅速下破关键位（例如回落 30~50bp 以上）、股债负相关恢复，则倾向对立理论（KB-TH-006）。\n- 证据不足时的弃判条件：若缺少 10Y 拆解（实际利率 vs 盈亏平衡通胀 vs 期限溢价）或观测窗短于 5 个交易日，不得仅因一两日","indicators":["MKT:^TNX","M4:UST_10Y_2Y_BP","MKT:^VIX","MKT:GC=F"],"opposing":[{"id":"KB-TH-006","scope":"当 VIX 飙升与风险资产回调时，长端美债收益率究竟因“财政主导/发债供给”而居高不下，还是因“金融加速器/衰退避险”而快速下行","horizon":"1~6个月"}]},"KB-9620E5DE":{"kb_id":"KB-9620E5DE","title":"财政乘数与李嘉图等价","domain":"财政","type":"基础概念","status":"legacy","one":"政府多花 1 块钱究竟能拉动多少 GDP（乘数 $k$），取决于民间是否把它存起来防未来加税（李嘉图等价）以及经济是否已","excerpt":"政府多花 1 块钱究竟能拉动多少 GDP（乘数 $k$），取决于民间是否把它存起来防未来加税（李嘉图等价）以及经济是否已充分就业。\n- 凯恩斯开放经济财政乘数（卡恩 / 凯恩斯《通论》）：\n  $$k = \\frac{1}{1 - c(1 - t) + m}$$\n  其中 $c$ 为边际消费倾向（MPC），$t$ 为边际税率，$m$ 为边际进口倾向。\n  - 闲置产能高、降息处于零下限（$ZLB$）且直接基建支出或面向低收入现金补贴（$c$ 高、$m$ 低）时，$k$ 可明显 $\u003e1$；\n  - 若高进口国发放无差别消费券（$m$ 大）或处于充分就业+美联储高利率挤出期，乘数会骤降至 $\u003c0.5$，转化为通胀与进口逆差。\n- 巴罗—李嘉图等价（Ricardian Equivalence）：若理性居民预期“今天政府发债赤字 = 明天政府加税偿还”，便会减少当期消费、把发到手的补贴全部存起来买国债，导致私人储蓄上升正好抵消公共赤字，总需求零净增","indicators":[],"opposing":[]},"KB-CB7D197F":{"kb_id":"KB-CB7D197F","title":"财政四本账","domain":"财政","type":"基础概念","status":"legacy","one":"政府的钱分四个口袋（一般公共预算、政府性基金、国有资本经营、社会保险基金），各收各的、各花各的，但四个口袋之间有法定通道","excerpt":"政府的钱分四个口袋（一般公共预算、政府性基金、国有资本经营、社会保险基金），各收各的、各花各的，但四个口袋之间有法定通道可以互相倒钱。\n### 法源：四本账是预算法定义的，不是习惯说法\n《中华人民共和国预算法》第五条：「预算包括一般公共预算、政府性基金预算、国有资本经营预算、社会保险基金预算。」\n同条第二款：四本账「应当保持完整、独立」，后三本「应当与一般公共预算相衔接」。\n（1994 年通过，2014 年、2018 年两次修正；条文见中国人大网 gov 站原文。）\n### 四个口袋各管什么（条文原文的关键句）\n| 账本 | 法条 | 收入是什么 | 支出干什么 | 编制原则 |\n|---|---|---|---|---|\n| 一般公共预算 | 第六、二十七条 | 以税收为主体的财政收入（另有行政事业性收费、国有资源资产有偿使用收入、转移性收入） | 保障改善民生、推动经济社会发展、维护国家安全、维持国家机构运转 | — |\n| 政府性基金预算 | 第九条 | 依法「在一","indicators":[],"opposing":[]},"KB-2F41E6B4":{"kb_id":"KB-2F41E6B4","title":"财政自给率 / 债务率 / 综合财力","domain":"财政","type":"口径陷阱","status":"legacy","one":"三个都常被叫作\"地方财政风险指标\"，但只有一个（债务率）是财政部官方对外的口径，一个（财政自给率）是市场自造的，而它的分","excerpt":"三个都常被叫作\"地方财政风险指标\"，但只有一个（债务率）是财政部官方对外的口径，一个（财政自给率）是市场自造的，而它的分母\"综合财力\"没有统一定义。\n### 先说一个已核实的重要事实：官方对外只用两个指标\n2021-12-16 国新办政策例行吹风会，财政部副部长许宏才的原话：\n\u003e 「国际上通行的债务指标有两个，一个是从全国汇总来看，主要是负债率指标，即政府债务余额占 GDP 的比重……还有一个是地方政府债务指标。由于不同地区之间经济发展不平衡，为了保证地区基本公共服务均等化，中央政府会对地方实施转移支付。受财政体制、转移支付等因素影响，各个地方衡量债务水平的指标不能用债务余额除以 GDP，而必须跟综合财力相比，这个一般称之为债务率。」\n结论：财政部对外只讲两个指标——负债率（÷GDP）、债务率（÷综合财力）。「财政自给率」不在财政部的指标体系里，是市场/学界自造的。\n这一条本身就是最有价值的信息：看到一个\"权威\"的自给率排行榜，它其实没有官方依据。\n另外，","indicators":[],"opposing":[]},"KB-10F48F00":{"kb_id":"KB-10F48F00","title":"财政部发布会用语的含义","domain":"财政","type":"业内门道","status":"legacy","one":"财政部不预测、不承诺，所以\"说了什么\"往往不如\"怎么说\"重要——措辞可以在同一场合逐年对比，而它比数字更早转向。","excerpt":"财政部不预测、不承诺，所以\"说了什么\"往往不如\"怎么说\"重要——措辞可以在同一场合逐年对比，而它比数字更早转向。\n### 方法：建\"同场合逐年措辞表\"\n只有同场合、同性质文件之间的措辞才可比。可信度排序（从高到低）：\n1. 财政部部长向全国人大常委会作的《政府债务管理情况的报告》（年度，法律要求，最正式）\n2. 《政府工作报告》财政段（年度，总理宣读）\n3. 全国人大常委会新闻发布会（部长出席，答记者问）\n4. 国新办政策例行吹风会（副部长出席）\n5. 财政部季度\"网上新闻发布会\"（司局级，文字实录）\n不要拿央行的措辞套财政部——两家的词汇体系完全不同（央行讲\"流动性\"\"适度宽松\"，财政部讲\"加力\"\"效能\"\"三保\"）。\n### 五组已核实的措辞信号\n#### ① 财政政策的\"定语\"（每年的政策基调，看这一个词就够）\n- 2024 年：「适度加力、提质增效」\n  （财政部 2024-10-25 发布会：\"坚持适度加力、提质增效\"；2024 年度债务报告：\"坚","indicators":[],"opposing":[]},"KB-5C0D8EF9":{"kb_id":"KB-5C0D8EF9","title":"隐性债务","domain":"财政","type":"基础概念","status":"legacy","one":"地方政府在法定预算之外、直接或承诺用财政资金偿还、或违法提供担保举借的债务。它不在法定债务余额里，但会被要求还。","excerpt":"地方政府在法定预算之外、直接或承诺用财政资金偿还、或违法提供担保举借的债务。它不在法定债务余额里，但会被要求还。\n### 定义：官方口径（务必注意\"定义\"和\"文件\"的区别）\n媒体与发布会口径一致的表述（《中国经济周刊》2024-11-15，与财政部新闻发布会表述一致）：\n\u003e 「地方政府隐性债务是指地方政府在法定预算之外，直接或者承诺以财政资金偿还以及违法提供担保等方式举借的债务。」\n严格的官方定义出自 2018 年 8 月中共中央、国务院《关于防范化解地方政府隐性债务风险的意见》。\n该文件未公开发布，gov.cn/中国人大网均无全文。市场普遍引用文号「中发〔2018〕27号」，但本卡未能从官方渠道核实该文号 —— 标「待核」，正式稿件里不要引用文号，只写「2018 年中央文件」。\n制度的起点是 2017 年 7 月中央政治局会议。据《中国经济周刊》梳理，该次会议「首次提出'隐性债务'概念」，表述为：「要积极稳妥化解累积的地方政府债务风险，有","indicators":[],"opposing":[]},"KB-A746B308":{"kb_id":"KB-A746B308","title":"LPR 改革：为什么 LPR 是\"报价\"不是\"央行定的\"","domain":"货币","type":"口径陷阱","status":"legacy","one":"LPR 是 20 家银行报出来的价，央行只\"授权公布\"，不直接定。","excerpt":"LPR 是 20 家银行报出来的价，央行只\"授权公布\"，不直接定。\n形成机制（中国外汇交易中心官方口径）：\n1. 报价行：20 家银行（2019 年改革时为 18 家，后增至 20 家）。\n2. 时间：每月 20 日（遇节假日顺延）9:00 前提交报价；当日 9:00 公布。2024-07-22 起发布时间由 9:15 提前至 9:00。\n3. 步长：以 0.05 个百分点为步长。\n4. 计算：全国银行间同业拆借中心去掉最高和最低报价后算术平均，再向 0.05% 的整数倍就近取整。\n5. 品种：1 年期、5 年期以上。\n\"报价\"意味着什么：\n公式里没有任何一项是央行直接指定的。报价行的锚是\"公开市场操作利率 + 加点\"：\n- 2019-08-20 改革时，锚是 1 年期 MLF 利率；\n- 2024-07 起换锚到 7 天 OMO 利率（实际传导路径：OMO → DR007 → LPR）。\n这个换锚有干净的实","indicators":[],"opposing":[]},"KB-93D1C1F9":{"kb_id":"KB-93D1C1F9","title":"中国政策利率体系（OMO 逆回购 / MLF / LPR / SLF / DR007）","domain":"货币","type":"基础概念","status":"legacy","one":"央行只用一个短期利率当锚，其余都是锚下的水位刻度。","excerpt":"央行只用一个短期利率当锚，其余都是锚下的水位刻度。\n锚是哪一个：7 天期逆回购操作利率（OMO）。\n2024-06-19 陆家嘴论坛，央行行长潘功胜原话：「未来可考虑明确以央行的某个短期操作利率为主要政策利率，目前看，7 天期逆回购操作利率已基本承担了这个功能。其他期限货币政策工具的利率可淡化政策利率的色彩，逐步理顺由短及长的传导关系。」\n传导链（看价格，不看数量）：\n\n7天 OMO 利率（政策利率，央行定）\n   ↓\nDR007（银行间隔夜/7天资金价，市场定）\n   ↓\nLPR（20家报价行报价，月度）\n   ↓\n贷款利率 / 存款利率\n   ↓\n国债收益率曲线（各期限）\n\n五个工具各自的角色：\n| 工具 | 期限 | 角色 | 关键变化 |\n|---|---|---|---|\n| OMO 7 天逆回购 | 7 天 | 唯一政策利率 | 2024-07-22 起改为\"固定利率、数量招标\"：利率央行定，数量市场要 |\n| MLF | 1 年","indicators":[],"opposing":[]},"KB-0FBFAF31":{"kb_id":"KB-0FBFAF31","title":"为什么降息有时股市反跌","domain":"货币","type":"业内门道","status":"legacy","one":"市场交易的是\"降息的理由\"，不是降息本身。","excerpt":"市场交易的是\"降息的理由\"，不是降息本身。\n按解释力排序，四条机制：\n### ① 预期已被充分定价（price in）\n降息前市场隐含概率到 90~100% 时，落地那一刻没有新增信息，只剩\"卖事实\"。\n判据：CME FedWatch 的隐含概率。≥90% 就要预设\"落地无惊喜\"。\n### ② \"降息的理由\"变了：衰退式降息\n降息若为对冲衰退，盈利预期（分子）下修会盖过贴现率（分母）下行。\n最硬的判据不在利率决议里，在 SEP 里：同一场会议如果下调 GDP 预测、上调失业率预测，那这个降息就是保险式/救火式，股票不涨反跌是正常的。\n### ③ 降息但\"未来路径\"变鹰（鹰派降息）\n降 25bp，却在声明或发布会里否掉后续降息。市场定价的是整条路径，不是这一次。\n### ④ 降息但长端不动或上行\n如果降息被读成\"通胀失控下的被动宽松\"，长端收益率与通胀预期反而上行（熊陡），股票估值的锚是长端，不是政策利率——分母没降，估值就不涨。\n### 已核实的标","indicators":[],"opposing":[]},"KB-CB2698B2":{"kb_id":"KB-CB2698B2","title":"人民币汇率机制（中间价 / 在岸离岸 / 逆周期因子 / CFETS 篮子）","domain":"货币","type":"基础概念","status":"legacy","one":"官方每天报一个参考价，市场价只能围着它小幅浮动。","excerpt":"官方每天报一个参考价，市场价只能围着它小幅浮动。\n### 一、中间价怎么形成（CFETS 官方说明）\n每交易日开市前向所有做市商询价；做市商参考：\n1. 上一日银行间外汇市场收盘价；\n2. 当日外汇供求；\n3. 主要货币汇率变化。\nCFETS 去掉最高和最低报价，对剩余报价加权平均（权重按各行成交量与做市表现确定）。\n2015 年\"8·11\"之后的通行表述公式：\n\n中间价 = 上日收盘价 + 一篮子货币汇率变化 (+ 逆周期因子)\n\n关键点：前两项就能解释大部分日常变动。 所以\"中间价调贬 200 点\"多数时候是被动跟随（昨日收盘价 + 美元隔夜走势），不含政策意图。需要解释的是偏离模型的那部分。\n### 二、逆周期因子\n- 性质：报价行自愿加进报价模型的一项，不是央行公布的参数，没有公开数值。\n- 时间线（已核实）：\n  - 2017-05 首次出现，用于修正单向贬值预期；\n  - 2018","indicators":[],"opposing":[]},"KB-CD3A8A26":{"kb_id":"KB-CD3A8A26","title":"加息/降息对资产价格的传导路径","domain":"货币","type":"基础概念","status":"legacy","one":"利率动的是分母，但同一件事会同时改分母和分子。","excerpt":"利率动的是分母，但同一件事会同时改分母和分子。\n### 一、两个定价式\n股票：\n\nP = Σ [ CFt / (1 + r + ERP)^t ]\n\n利率 ↓ → 分母 ↓ → 估值 ↑。但利率往往是为应对增长/通胀而动的，所以 CF（盈利预期）几乎同时变化。净效果取决于哪一项动得更大。\n债券：\n\nPrice = Σ [ Ct / (1 + y)^t ]    久期越长，对 y 越敏感\n\n降息 → 债券涨（这条确定性最高，因为不涉及\"分子\"）。\n### 二、四种情景（这张表是核心）\n| 情景 | 短端 | 长端 / 期限溢价 | 盈利预期 | 股 | 债 | 判据 |\n|---|---|---|---|---|---|---|\n| 通胀回落式降息（软着陆） | ↓ | ↓ 或平 | 稳 / 升 | ↑ | ↑ | 通胀下行 + 增长不崩 |\n| 衰退式降息 | ↓ | ↓（避险） | ↓↓ | ↓ | ↑ | 失业率抬","indicators":[],"opposing":[]},"KB-646F6F76":{"kb_id":"KB-646F6F76","title":"家庭债务与私人偿债率（WS_TC / WS_DSR）","domain":"货币","type":"口径陷阱","status":"legacy","one":"居民杠杆率看的是“欠了多少本金（存量÷GDP）”，真正决定消费链何时断裂的，是包含还本付息压力与收入分布的偿债率（D","excerpt":"居民杠杆率看的是“欠了多少本金（存量÷GDP）”，真正决定消费链何时断裂的，是包含还本付息压力与收入分布的偿债率（DSR）。\n两个核心口径对比（均来自 BIS 季度库）\n| 指标 | BIS 数据集 | 分子与分母 | 真正回答的问题 |\n|---|---|---|---|\n| 家庭债务/GDP | WS_TC | 住户及非营利机构信贷存量 ÷ 名义 GDP | 债务相对整体经济盘子有多厚（慢变量） |\n| 私人非金融部门偿债率 | WS_DSR | 私人非金融部门（居民+非金融企业）当期还本+付息现金流 ÷ 可支配总收入 | 当期现金流里有多少被拿去还债（痛感代理） |\nBIS 实测参照（2026-Q1 季度）\n- 家庭债务 / GDP（WS_TC）：澳大利亚 114.1% · 加拿大 100.0% · 韩国 85.1% · 英国 72.6% · 美国 67.2% · 日本 60.8% ·","indicators":[],"opposing":[]},"KB-74A81C65":{"kb_id":"KB-74A81C65","title":"\"已 price in\"是什么意思、怎么判断","domain":"货币","type":"业内门道","status":"legacy","one":"价格里已经算进了多少预期；算进去了，落地就不涨。","excerpt":"价格里已经算进了多少预期；算进去了，落地就不涨。\n### 一、定义（先去掉模糊说法）\nprice in 不是\"涨过了\"\"跌过了\"这种事后描述。它有一个可测的定义：\n\u003e 当前价格隐含的未来路径，与\"事件按基准情形发生\"的路径之间的差。\n差值 ≈ 0 → 已充分定价，落地无惊喜。\n差值 ≠ 0 → 还有可交易的分歧。\n### 二、美国：联邦基金利率期货 → CME FedWatch\n工具：30-Day Federal Funds 期货（代码 ZQ）。每张合约的价格反映该月平均 EFFR 的市场预期。\n核心公式（三步）：\n\n① 隐含平均 EFFR = 100 − 期货价格\n   （例：ZQ 报 96.9400 → 隐含 3.0600%）\n② 月内变动 = EFFR(月末) − EFFR(月初)\n③ P(变动) = [EFFR(月末) − EFFR(月初)] / 25bp\n\n跨月怎么接：没有 FOMC 会议的月份，其期货价 = 该月平均","indicators":[],"opposing":[]},"KB-61ACCC42":{"kb_id":"KB-61ACCC42","title":"收益率曲线（期限利差 / 倒挂）","domain":"货币","type":"基础概念","status":"legacy","one":"同一发行人不同期限的利率连成的线，斜率是对未来的定价。","excerpt":"同一发行人不同期限的利率连成的线，斜率是对未来的定价。\n基本量：\n- 期限利差 = 长端收益率 − 短端收益率。常用 10Y − 2Y（美国）、10Y − 1Y（中国）。\n- 利差为负 = 倒挂。\n分解（核心公式，必须记住）：\n\n长端收益率 ≈ 未来短端利率的预期平均值 + 期限溢价(term premium)\n\n这条式子直接决定了倒挂的信号强度：\n- 若倒挂由预期项驱动（市场认为未来短端会大幅下行 = 预期衰退、预期降息）→ 传统衰退信号；\n- 若倒挂由期限溢价被压到极低甚至负值驱动（QE 买长债、监管资本规则、海外储备买盘、避险）→ 同样的倒挂，信息含量大幅下降。\n所以看到倒挂，先问两个问题：\n1. 是短端被加息顶上去的，还是长端被避险买下去的？（看 2Y 与 10Y 各自的方向）\n2. 期限溢价在什么水平？（纽约联储 ACM 期限溢价模型有公开数据）\n历史标尺（美国 10Y−2Y，已核实","indicators":[],"opposing":[]},"KB-5438FBED":{"kb_id":"KB-5438FBED","title":"汇率管理的手势语言","domain":"货币","type":"业内门道","status":"legacy","one":"官方不动利率也能管汇率，靠的是一组可逆的小工具。","excerpt":"官方不动利率也能管汇率，靠的是一组可逆的小工具。\n### 工具清单（附方向读法）\n① 中间价偏离（最灵敏的日频信号）\n做法：用\"上日收盘价 + 一篮子货币汇率变化\"算出理论中间价，与实际公布值比较。\n- 实际值连续多日强于理论值（更偏人民币升值方向）→ 过滤/逆周期因子在起作用 → 不希望贬得太快。\n- 实际值贴近理论值 → 回归中性。\n注意：篮子权重不公开，各券商测算有差异，只能做方向判断，不能做精确归因。\n② 逆周期因子重启 / 退出\n它不是央行公告的参数，而是报价行自行调整。官方的表露方式是 CFETS 发公告或答记者问。\n- 已核实的表述：2018-08-24 夜，CFETS 公告「绝大多数中间价报价行已经对逆周期系数进行了调整」——这就是\"重启\"的官方说法。\n- 市场含义：明确不希望单边。首次出现是 2017-05，2018-01 报价行陆续调为零。\n③ 远期售汇业务外汇风险准备金率（0% / 20% 两档）*","indicators":[],"opposing":[]},"KB-91792A64":{"kb_id":"KB-91792A64","title":"美元指数构成（DXY）","domain":"货币","type":"口径陷阱","status":"legacy","one":"DXY 是美元对 6 种货币的几何加权，欧元占近六成。","excerpt":"DXY 是美元对 6 种货币的几何加权，欧元占近六成。\n### 一、权重（ICE 设计并维护，加权几何平均）\n| 货币 | 权重 |\n|---|---|\n| 欧元 EUR | 57.6% |\n| 日元 JPY | 13.6% |\n| 英镑 GBP | 11.9% |\n| 加元 CAD | 9.1% |\n| 瑞典克朗 SEK | 4.2% |\n| 瑞士法郎 CHF | 3.6% |\n### 二、三个结构性事实（决定了它不能被当\"美元强弱\"的唯一度量）\n① 只有 6 种货币，且不含当下主要贸易伙伴。\n人民币、墨西哥比索、韩元、巴西雷亚尔都不在篮子里——而它们是美国现在的重量级贸易伙伴。\n② 篮子只改过一次，权重沿用 1970 年代初的贸易结构。\n1999 年欧元诞生时，把多种欧洲货币合并为欧元，这是篮子唯一一次调整。此后瑞典、瑞士仍在篮内，尽管它们对美贸易的重要性早已远不如 1970 年代；这一点长期被批评为\"该改了\"。\n③ 它是相对价格，不是绝对水平。*","indicators":[],"opposing":[]},"KB-A7123AFB":{"kb_id":"KB-A7123AFB","title":"美联储工具箱（目标区间 / EFFR / 点阵图 / 缩表）","domain":"货币","type":"基础概念","status":"legacy","one":"定一个区间、调两个行政利率、管一张资产负债表。","excerpt":"定一个区间、调两个行政利率、管一张资产负债表。\n### 一、三件套\n① 目标区间（target range）：FOMC 会议决定，通常 25bp 宽（如 3.75%–4.00%）。这是\"政策立场\"的唯一表达。\n② EFFR（effective federal funds rate）：纽约联储每个交易日发布，是前一日隔夜无担保拆借的成交量加权中位数。政策的目标是让 EFFR 落在区间内——判断政策落地看 EFFR，不看区间中值。\n③ 两个行政利率（administered rates）：\n| 工具 | 位置 | 作用 |\n|---|---|---|\n| IORB（准备金余额利率） | 区间上部（主工具） | 银行把准备金存在美联储的利率，构成实际\"天花板\" |\n| ON RRP（隔夜逆回购利率） | 区间下部（地板） | 货币基金等非银机构的停放利率，构成\"地板\" |\nEFFR 在区间里的具体位置，由这两个利率的相对位置、以及","indicators":[],"opposing":[]},"KB-TH-002":{"kb_id":"KB-TH-002","title":"货币数量论与通胀传导时滞","domain":"货币","type":"theory","status":"verified","one":"$MV = PY$ 是恒等式而非因果律；货币变化传到物价通常存在 12~24 个月的“长而多变时滞”。","excerpt":"- 原始理论出处：欧文·费雪《货币的购买力》（1911）；米尔顿·弗里德曼 \u0026 安娜·施瓦茨《美国货币史》（1963，“长而多变的时滞”）。\n- 制度前提：货币流通速度 $V$ 在中期相对稳定（未发生系统性债务通缩塌陷），私人部门仍以利润最大化为目标、对实际利率敏感。\n- 传导时滞：金融资产与汇率 3~6 个月 → 产出与就业 6~12 个月 → 核心 CPI 12~24 个月。\n- 与对立理论的共解现象：宽货币启动后 前 6 个月 物价与实体数据均可能偏弱，短期内无法仅凭 CPI 区分“时滞未到”还是“流动性陷阱”。\n- 能够区分二者的关键观测：跟踪广义货币与信贷脉冲后 6~12 个月内的 M1 活期增速、商品/服务核心 CPI 环比与实际利率弹性。若 M1 在 6~9 个月内拐头向上且 12~18 个月内核心通胀回升，支持本理论；若宽货币持续超 12 个月但流通速度 $V$（名义 $GDP/M2$）持续下台阶、资金滞留定期/国债，则支持对立理论（KB-TH-001）。\n- 证据不足时的弃判条件：若政策转向距今不足 6 个月、或同时存在大规模财政直发/供给冲击干扰 $V$ 与 $Y$，不得强行用单一 M2 增速外推通胀，应标「时滞窗口未满/混杂因子待核」。","indicators":["M3:CN_M1_M2_SCISSOR","BLS:CUSR0000SA0L1E","EM:RPT_ECONOMY_CPI:NATIONAL_SEQUENTIAL"],"opposing":[{"id":"KB-TH-001","scope":"宽货币下为何尚未出现通胀（货币传导时滞未到 vs 资产负债表衰退导致宽货币失效）","horizon":"6~24个月"}]},"KB-93ED4816":{"kb_id":"KB-93ED4816","title":"资本账户开放度（Chinn-Ito）与实际有效汇率（REER）","domain":"货币","type":"口径陷阱","status":"legacy","one":"双边汇率只看对美元涨跌、Chinn-Ito 只测法条层面的“门开多大”，两者都不是实时跨境资金流量，必须配着 BIS","excerpt":"双边汇率只看对美元涨跌、Chinn-Ito 只测法条层面的“门开多大”，两者都不是实时跨境资金流量，必须配着 BIS 实际有效汇率（REER） 和国际收支分项一起看。\n三套核心量尺的分工（已接入机制 M8）\n| 指标 | 数据源 | 测的是什么 | 典型最新值（本库实测） |\n|---|---|---|---|\n| Chinn-Ito 指数（ka_open） | kaopen_2023.xls（归一化 [0, 1]，越大越开放） | 法定（de jure）资本账户规则开放度 | 美/德/日/英/韩 1.0（kaopen=2.281）· 中国 0.162（kaopen=-1.254），止于 2023 |\n| 实际有效汇率（REER） | BIS WS_EER（月度，宽篮子） | 对一篮子贸易伙伴加权并剔除通胀差后的真实货币购买力 | 2026-09：英 111.48 · 美 107","indicators":[],"opposing":[]},"KB-56A173A3":{"kb_id":"KB-56A173A3","title":"VIX 与期权隐含波动率结构","domain":"市场","type":"基础概念","status":"legacy","one":"VIX 度量的不是“恐慌情绪有多悲观”，而是未来 30 天标普 500 期权市场里“为防范大波动而买保险的成本有多贵”。","excerpt":"VIX 度量的不是“恐慌情绪有多悲观”，而是未来 30 天标普 500 期权市场里“为防范大波动而买保险的成本有多贵”。\nVIX 是怎么算出来的\n- 全称 Cboe Volatility Index，基于未来约 30 天到期的标普 500（SPX）一篮子虚值看涨/看跌期权的隐含波动率（IV）加权推算，年化百分比口径（例如 VIX = 18.7 ≈ 期权定价隐含未来一年约 18.7% 的年化波动，粗略按 ÷ √252 ≈ ÷16 换算为每日 ≈ ±1.17% 的单标准差日波动空间）。\n- 天然存在波动率风险溢价（VRP）：常态下 VIX \u003e 实际已实现波动率（RV），因为投资者愿意长期多花钱买下跌保险。\n比单点位更重要的是两条结构\n\n常态（Contango 升水）：  现货 VIX \u003c 近月 VIX 期货 \u003c 次月 VIX 期货\n  → 市场认为当下风平浪静，保险费随时间递增\n压力（Backwardation 贴水）：现货 VI","indicators":[],"opposing":[]},"KB-89CFF82B":{"kb_id":"KB-89CFF82B","title":"信用利差与高收益债利差","domain":"市场","type":"基础概念","status":"legacy","one":"国债利率给“无风险时间价值”定价，信用利差给“违约风险 + 流动性补偿”定价；企业融资成本看两者之和，市场压力突变先看利","excerpt":"国债利率给“无风险时间价值”定价，信用利差给“违约风险 + 流动性补偿”定价；企业融资成本看两者之和，市场压力突变先看利差。\n基本定义与口径\n- 信用利差（Credit Spread） = 同期限企业债/信用债收益率 − 同期限无风险基准（国债或国开债，中债口径常分别列示）收益率。\n- OAS（期权调整利差）：剔除可赎回/可回售等内嵌期权影响后的纯信用与流动性利差，比直接减到期收益率更可比。\n- 等级梯度：投资级（IG：AAA / AA+，美债对应 BBB− 及以上）对利率久期更敏感；高收益级（HY / 垃圾债：BB+ 及以下）与低主体评级债对违约预期与再融资墙更敏感。\n利差的四层拆解\n\n信用利差 = 预期违约损失（PD × LGD） + 违约风险溢价 + 流动性溢价 + 税收/监管溢价\n\n- 经济放缓初期：违约率尚未跳升，但流动性溢价与风险厌恶先抬升，HY 利差往往先于实际违约数据走阔。\n- 境内特殊分化：中国信用债需","indicators":[],"opposing":[]},"KB-D47504BE":{"kb_id":"KB-D47504BE","title":"国债收益率拆解与期限溢价","domain":"市场","type":"基础概念","status":"legacy","one":"长期国债收益率不是单纯的“对未来政策利率的平均预期”，还包含投资者因持有长久期不确定性而索要的期限溢价（Term Pre","excerpt":"长期国债收益率不是单纯的“对未来政策利率的平均预期”，还包含投资者因持有长久期不确定性而索要的期限溢价（Term Premium）。\n标准三因子拆解\n\n名义国债收益率(n年) ≈ 预期平均短期实际利率 + 预期平均通胀 + 期限溢价（Term Premium）\n\n借助 TIPS（通胀保值国债）还可写成两块观测口径：\n\n名义国债收益率 = 实际国债收益率（TIPS） + 盈亏平衡通胀率（Breakeven Inflation = 名义 − TIPS）\n\n- 实际利率上升主导（TIPS 涨、Breakeven 稳）：紧缩效果最强，直接压高估值成长股与黄金（无息资产）的机会成本。\n- Breakeven 上升主导（通胀补偿涨、TIPS 稳）：再通胀或油价/关税等供给通胀预期升温。\n- 期限溢价上升主导：常出现在国债净供给激增、央行缩表（QT）、通胀波动率放大或外资边际减持时，特征是长端收益率比短端跳得更猛（熊陡）。\n两个经验估","indicators":[],"opposing":[]},"KB-FA14E51C":{"kb_id":"KB-FA14E51C","title":"数据中心经济性：capex、PUE 与电价占比","domain":"市场","type":"业内门道","status":"legacy","one":"决定数据中心回报的不是芯片价格，而是电价 × PUE × 负载率。","excerpt":"决定数据中心回报的不是芯片价格，而是电价 × PUE × 负载率。\n| 指标 | 含义 | 备注 |\n|---|---|---|\n| 建设成本 | 每 MW IT 负载的土建+机电+接入 | 需按地区核 |\n| PUE | 总能耗 ÷ IT 能耗 | 先进项目约 1.1–1.3（待核） |\n| 电价 | 工业电价/PPA | 地区差异极大 |\n| 负载率 | 实际负载 ÷ 设计容量 | 影响单位成本 |\n\n年电费 ≈ 装机 MW × 8760 × PUE × 电价 × 负载率\n单位算力成本 ≈ (年化 capex + 年电费 + 运维) ÷ 年有效算力\n\n敏感性（算术推算，非实测）：电价 +10% → 年电费 +10%；PUE 1.4→1.2 → 电费 -14%；负载率 80%→50% → 单位成本 +60%。","indicators":[],"opposing":[]},"KB-2BB8CCDF":{"kb_id":"KB-2BB8CCDF","title":"明斯基时刻与金融不稳定假说","domain":"市场","type":"基础概念","status":"legacy","one":"长期稳定本身会催生越来越激进的加杠杆行为，直到融资结构从“靠现金流还本”退化为“必须借新还旧”，一旦滚续卡壳便触发资产抛","excerpt":"长期稳定本身会催生越来越激进的加杠杆行为，直到融资结构从“靠现金流还本”退化为“必须借新还旧”，一旦滚续卡壳便触发资产抛售螺旋。\n海曼·明斯基（《稳定不稳定的经济》）将微观主体的资产负债现金流划分为三档：\n| 阶段 | 本金覆盖能力 | 利息覆盖能力 | 典型指标表现 |\n|---|---|---|---|\n| 对冲型融资（Hedge） | 经营现金流可覆盖 | 可覆盖 | 再融资占比低，DSR 健康，期限匹配 |\n| 投机型融资（Speculative） | 不可覆盖，须借新还旧 | 可覆盖 | 依赖短期滚续与低利率，高收益利差压在低位 |\n| 庞氏型融资（Ponzi） | 不可覆盖 | 不可覆盖，须靠新融资或资产涨价 | 再融资占比 \u003e40%~50%、利息资本化、隐性展期 |\n- 明斯基时刻（Minsky Moment）触发链：通胀或外部冲击迫使基准利率抬升 / 现金流下行 → 投机与庞氏主体滚续成本跳升或展期被拒","indicators":[],"opposing":[]},"KB-FF131754":{"kb_id":"KB-FF131754","title":"电网并网排队与交付周期","domain":"市场","type":"业内门道","status":"legacy","one":"数据中心真正的瓶颈不是盖楼，是排队等电网接入。","excerpt":"数据中心真正的瓶颈不是盖楼，是排队等电网接入。\n并网流程（美国为例）：申请 → 可行性研究 → 系统影响研究 → 并网协议 → 建设 → 通电。\n| 指标 | 含义 | 怎么看 |\n|---|---|---|\n| 队列容量（GW） | 排队中的发电/负荷总量 | 注意含大量「占位」申请，撤回率高 |\n| 平均等待月数 | 从申请到并网 | 越长，交付越慢 |\n| 撤回率 | 申请后放弃比例 | 高撤回率说明队列虚胖 |\n| 电网差异 | PJM 容量拍卖 / ERCOT 能源-only / CAISO | 规则不同，等待差数倍 |\n中国：数据中心多走「东数西算」枢纽与地方电网配套，审批与供电节奏由地方主导，与美国的队列制不同。","indicators":[],"opposing":[]},"KB-FA7D574F":{"kb_id":"KB-FA7D574F","title":"算力租赁定价与空置率","domain":"市场","type":"业内门道","status":"legacy","one":"机房租金与空置率，是算力供需最直接的价格信号。","excerpt":"机房租金与空置率，是算力供需最直接的价格信号。\n| 指标 | 含义 | 备注 |\n|---|---|---|\n| 批发租金（$/kW/月） | wholesale colocation 整栋/整层价格 | 与零售租金不同口径 |\n| 空置率 | 可租面积 ÷ 总供给 | 一级市场（新建）与二级市场分开看 |\n| 预租率（pre-leasing） | 未交付已签约比例 | 高预租率=需求强，但要看交付能否兑现 |\n| 合约期限 | 5–15 年常见 | 长期合约锁定价格，短期合约反映现货 |\n| 电力附加费 | 电价转嫁条款 | 电价上涨时，租金名义不变但实际成本上升 |","indicators":[],"opposing":[]},"KB-71705771":{"kb_id":"KB-71705771","title":"股债相关性与风险平价去杠杆","domain":"市场","type":"基础概念","status":"legacy","one":"传统“股60/债40”和风险平价策略依赖股债负相关；一旦通胀或利率冲击把股债相关性翻正（股债双杀），组合波动放大，会触发","excerpt":"传统“股60/债40”和风险平价策略依赖股债负相关；一旦通胀或利率冲击把股债相关性翻正（股债双杀），组合波动放大，会触发系统性降杠杆抛压。\n为什么股债相关性会翻号\n\n增长冲击主导（需求不足 / 低通胀）：增长↓ → 股市跌，同时降息/避险 → 债价涨  ⇒  股债负相关（股收益率 vs 债收益率 正相关）\n通胀/利率/供给冲击主导：通胀↑或发债过量 → 利率跳升 → 债价跌，同时高折现率/滞胀 → 股市跌 ⇒ 股债正相关（双杀）\n\n风险平价（Risk Parity）与波动率目标策略怎么放大波动\n1. 核心机制：策略不是按“市值 60/40”配，而是按风险贡献均等配，通常给低波动的国债配较高杠杆，使债券贡献的波动率 ≈ 股票。\n2. 平静期加仓：波动率下降 → 目标波动率模型自动提高债券和股票杠杆。\n3. 双杀去杠杆螺旋：\n   - 第一步：利率突发跳涨或股债相关系数由负转正 → 组合整体实现波动率突破目标上限；\n   - 第二步","indicators":[],"opposing":[]},"KB-AA02EA45":{"kb_id":"KB-AA02EA45","title":"股票回购与分红：代理冲突视角","domain":"市场","type":"业内门道","status":"legacy","one":"不能一看到公司公告“回购”就当利多；同样叫回购，可能是真金白银还富于股东，也可能是高价接盘大股东减持或借钱托价的代理冲突","excerpt":"不能一看到公司公告“回购”就当利多；同样叫回购，可能是真金白银还富于股东，也可能是高价接盘大股东减持或借钱托价的代理冲突。\n分红 vs 回购的本质与用途对比\n- 分红（Dividends）：现金按持股比例直接流出公司，对小股东落袋为安，但有税负且一旦宣布削减会释放极强负面信号（刚性最强）。\n- 回购（Share Repurchases）：用公司现金（或发债资金）在二级市场买回自家股票，灵活性高，可提升 EPS（分母缩水），但前提是“真注销”且未在高估区间接盘。\n辨别真假回报的四步清单（代理冲突视角）\n\n资金来源是否健康（自由现金流 \u003e 0，而非高息举债/募资刚完就回购）\n  ↓\n回购用途：注销减资（直接缩减股本） vs 用于股权激励/员工持股（左手转右手，总股本未降）\n  ↓\n执行进度 vs 嘴炮上限：“拟不超过 X 亿元”往往有下限极低或零执行，实际成交占比才是真信号\n  ↓\n同期重要股东行为：若回购同时叠加实控人/高管大额减持或定增解禁，","indicators":[],"opposing":[]},"KB-TH-003":{"kb_id":"KB-TH-003","title":"资本开支牛鞭效应与产能过剩周期","domain":"市场","type":"theory","status":"draft","one":"当上游资本品交付周期长达 2~4 年时，下游为抢产能而“超额下单”，一旦终端回报不及折旧速度，订单会沿供应链逐级放大崩塌","excerpt":"- 原始理论出处：Jay Forrester（1961）《工业动力学》牛鞭效应；Nicholas Kaldor（1934）蛛网周期模型；2000–2002 年北美电信光缆与基站资本开支过剩先例。\n- 制度前提：上游产能具备长建设周期与不可逆沉没成本，下游存在多家寡头军备竞赛式抢建，且资本市场前期容忍低短期 ROIC。\n- 传导时滞：从上游订单增速见顶到下游空置率抬升约 2~4 个季度；从 Capex 达峰到利润表折旧压力全面显影约 4~8 个季度。\n- 与对立理论的共解现象：均可能出现「远期 2028–2030 年加速器 Capex 预测下修、相关硬件股高波动回调，而当期云厂 Capex 仍在高增」。\n- 能够区分二者的关键观测：看算力租赁空置率、机柜批发租金（\\$/kW/月）、已通电机柜负载率与设备商 backlog 方向。若空置率显著走高、机柜租金/GPU 租赁单价同步下跌且云厂主动砍减在建合同，倾向本理论（需求与过度投资出清）；若空置率维持极低位、机柜租金与 PPA 电价续涨、下修仅集中于“拿不到电与许可的远期项目”，则倾向对立理论（KB-TH-004）。\n- 证据不足时的弃判条件：若缺少同期数据中心空置率、批发租金与电力设备新签订单分项，不得仅凭单家研究机构（如 SemiAnalysis）下修预测或股价单周回调断言已进入全面产能过剩，应标「缺物理供需数据/待核」。","indicators":["M7:SEC_CAPEX_OCF","M13:POWER_COMPUTE_RS","M13:DC_VACANCY_RATE"],"opposing":[{"id":"KB-TH-004","scope":"AI/数据中心远期资本开支下修究竟是“需求泡沫与重复下单出清”，还是“电力与许可物理硬约束导致的期限错配”","horizon":"6~24个月"}]},"KB-TH-004":{"kb_id":"KB-TH-004","title":"通用技术渗透 S 曲线与物理供给约束","domain":"市场","type":"theory","status":"draft","one":"通用目的技术（GPT）渗透早期常被电网、土地许可与设备产能等物理瓶颈卡住交付，表现是“远期总量推迟、近期稀缺资产涨价”，","excerpt":"- 原始理论出处：Timothy Bresnahan \u0026 Manuel Trajtenberg（1995）《General Purpose Technologies: Engines of Growth?》；Carlota Perez（2002）《技术革命与金融资本》（安装期 vs 展开期）。\n- 制度前提：底层技术仍在持续提升单位成本性能比，终端企业存在真实付费渗透需求，且能源/电网/审批等互补性基础设施供给弹性极低。\n- 传导时滞：物理瓶颈从暴露到拉升机柜租金与电力设备毛利约 2~6 个季度；电网扩容与燃机产能真正缓解短缺通常需 3~5 年。\n- 与对立理论的共解现象：在远期 Capex 预测下修、资本开支股高波动回调的初期（1~2 个季度内），盘面价格形态与“泡沫见顶”高度相似。\n- 能够区分二者的关键观测：跟踪核心枢纽数据中心空置率、批发机柜租金、PPA 购电协议价格及发电设备商新签订单。若空置率维持低位、租金与电价继续走高且已通电产能满载，支持本理论（供给约束型期限错配）；若空置率明显上行、租金与算力单价同步走弱且电力设备出现退单潮，则支持对立理论（KB-TH-003）。\n- 证据不足时的弃判条件：若尚未取得最新半年度空置率/机柜租金或电力设备财报订单数据，仅凭电力股相对芯片股跑赢的短期股价走势，不得断言“一定是物理瓶颈而非需求见顶”，应标「仅有市场代理、缺物理量验证/待核」。","indicators":["M13:POWER_COMPUTE_RS","M13:DC_VACANCY_RATE","M13:COLO_RENT_KW"],"opposing":[{"id":"KB-TH-003","scope":"AI/数据中心远期资本开支下修究竟是“电力与许可物理硬约束导致的期限错配”，还是“需求泡沫与重复下单出清”","horizon":"6~24个月"}]},"KB-TH-006":{"kb_id":"KB-TH-006","title":"金融加速器与衰退避险久期定价","domain":"市场","type":"theory","status":"draft","one":"风险资产下跌会侵蚀抵押品净值、推高外部融资溢价并触发信用收缩，最终迫使资金涌入无风险长端国债（Flight-to-Qua","excerpt":"- 原始理论出处：Ben Bernanke, Mark Gertler \u0026 Simon Gilchrist（1999）《The Financial Accelerator in a Quantitative Business Cycle Framework》（BGG 模型）；Nobuhiro Kiyotaki \u0026 John Moore（1997）《Credit Cycles》。\n- 制度前提：经济体存在高杠杆私募/企业/居民融资链条，且主权国债仍被全球机构视为流动性最高的安全抵押品（尚未发生本币信用崩盘）。\n- 传导时滞：保证金追缴与市场避险买盘在 3~15 个交易日显影；信用利差走阔传导至失业率抬升与违约率上升通常滞后 2~4 个季度。\n- 与对立理论的共解现象：在股市回调初期（VIX 首次突破 25~30 的前数日），两者均可出现股指急跌与波动率跳升。\n- 能够区分二者的关键观测：观察 VIX 维持 25+ 且铜/油同步下挫后的 1~4 周内，MKT:^TNX 是否明显下行（股债负相关恢复）以及高收益债利差是否系统性走阔。若 ^TNX 随经济/商品走弱快速回落且失业率/初请抬头，支持本理论（衰退避险定价）；若商品与股市承压但 ^TNX 仍死守高位甚至走高、市场焦点转向财政赤字与发债拍卖，则支持对立理论（KB-TH-005）。\n- 证据不足时的弃判条件：若缺少信用利差（HY OAS）与高频就业（初请失业金）佐证，或 VIX 仅单日脉冲而无跨资产","indicators":["MKT:^TNX","MKT:^VIX","MKT:HG=F","MKT:CL=F"],"opposing":[{"id":"KB-TH-005","scope":"当 VIX 飙升与风险资产回调时，长端美债收益率究竟因“金融加速器/衰退避险”而快速下行，还是因“财政主导/发债供给”而居高不下","horizon":"1~6个月"}]},"KB-777372D6":{"kb_id":"KB-777372D6","title":"BDI / SCFI / CCFI 的区别与适用","domain":"贸易","type":"口径陷阱","status":"legacy","one":"三个指数分属干散货、上海即期、全国综合，不可互换。","excerpt":"三个指数分属干散货、上海即期、全国综合，不可互换。\nBDI（波罗的海干散货指数，Baltic Exchange，日频）\n- 2018-03-01 起 = 40% 海岬型（Capesize）+ 30% 巴拿马型（Panamax）+ 30% 超灵便型（Supramax） 的期租评估加权，不再含 Handysize（Baltic Circular 04/18）。改动理由是外部分析给出干散货市场贡献 40/25/25/10，剔除 Handysize 对结果无统计影响。\n- 底层是期租等效日租金折算的指数点，不是运价（$/吨），也不对应任何一条航线。\n- 口径会变：1985 年起叫 BFI，成分与权重多次调整。跨年份比 BDI 必须注明版本。\nSCFI（上海出口集装箱运价指数，上海航交所，周频，周五）\n- 20 个分航线报价（其中 17 条有非零权重），权重公开且极不均匀：美西 40ft 17.5%、欧洲 40ft 15% + 20ft 5%、东","indicators":[],"opposing":[]},"KB-A82A294F":{"kb_id":"KB-A82A294F","title":"主要航道与咽喉（chokepoints）","domain":"贸易","type":"基础概念","status":"legacy","one":"四个咽喉卡的不是同一种货，必须按货类分开读。","excerpt":"四个咽喉卡的不是同一种货，必须按货类分开读。\nEIA 口径（2026-03 更新，数据到 1H25；单位百万桶/日，只统计石油与 LNG）\n| 咽喉 | 石油通过量 | 关键构成 | 替代路径 |\n|---|---|---|---|\n| 马六甲 | 23.2（占全球海运石油 29%） | 原油+凝析油 16.6、成品油 6.5；LNG 9.2 Bcf/d；中国占通过量 48% | 巽他/龙目海峡（更浅、更远） |\n| 霍尔木兹 | 20.9（≈全球液体消费 20%、海运石油 1/4） | 原油 14.7、成品油 6.1；LNG 11.4 Bcf/d（\u003e全球 LNG 贸易 20%） | 沙特东西管线 + 阿联酋管线合计约 4.7；伊朗 Jask 线有效约 0.3 |\n| 苏伊士 + SUMED | 4.9（2023 年曾是 8.8） | 原油 2.8、成品油 2.1；LNG 0.9 | 绕好望角（阿拉伯海→欧洲约 +15","indicators":[],"opposing":[]},"KB-26868F0B":{"kb_id":"KB-26868F0B","title":"全球价值链参与度（GVC participation）","domain":"贸易","type":"基础概念","status":"legacy","one":"出口里多少是外国增加值，多少又长在别人出口里。","excerpt":"出口里多少是外国增加值，多少又长在别人出口里。\n- 分解式（Koopman–Wang–Wei 2014；OECD TiVA 实现）：\n  总出口 = 国内增加值（被他国最终吸收）+ 返回的国内增加值 + 外国增加值（FVA）+ 纯重复计算项\n- 两个方向，缺一不完整：\n  - 后向参与度 = FVA / 总出口。TiVA 指标 EXGR_FVASH（Foreign value added share of gross exports）——\"我出口的东西里含多少进口\"。\n  - 前向参与度 = 本国增加值经他国加工后再出口的部分 / 总出口——\"我的零件长在别人的出口里\"。\n  - 参与度 = 前向 + 后向，通常报百分数。口径必须同版（行业分类、年份、汇率），否则不可比。\n- 位置比参与度更重要：后向高 = 靠组装端（越南、墨西哥的电子/汽车）；前向高 = 靠上游资源或核心件（澳大利亚铁矿、日本半导体材料）。\n- 重复计算有多大：同一块增加值每跨一","indicators":[],"opposing":[]},"KB-EC73F928":{"kb_id":"KB-EC73F928","title":"出口份额与显性比较优势（RCA）","domain":"贸易","type":"口径陷阱","status":"legacy","one":"出口份额看体量，RCA 看结构优势，两者不能互为证据。","excerpt":"出口份额看体量，RCA 看结构优势，两者不能互为证据。\n- 出口份额 = 该国出口额 / 世界出口额。看体量与议价能力，不看效率。\n- RCA（Balassa 1965） = (X_ij / X_i) ÷ (X_wj / X_w)\n  - X_ij = i 国 j 产品出口额，X_i = i 国总出口，X_wj = 世界 j 产品出口，X_w = 世界总出口。\n  - RCA \u003e 1 = 显示性比较优势（该产品在本国出口中的占比高于世界平均）；\u003c 1 = 劣势。它是相对值，永远有国家在 1 以上，所以 RCA 高不稀缺，高且份额大才稀缺。\n  - 对称化：RSCA = (RCA − 1)/(RCA + 1)，落在 (−1, 1)，便于跨产品平均（Laursen \u0026 Meliciani 的可选写法）。\n- 三个口径必须先固定：HS 6 位还是 2 位；毛出口还是增加值出口；货物还是货物+服务。换任何一个，RCA 排名都会变。","indicators":[],"opposing":[]},"KB-2B8C57C8":{"kb_id":"KB-2B8C57C8","title":"即期与长协（spot vs contract）","domain":"贸易","type":"业内门道","status":"legacy","one":"船公司收入是即期价与合同价的混合，指数只照到前半边。","excerpt":"船公司收入是即期价与合同价的混合，指数只照到前半边。\n- 集装箱：货主与船公司签年度/季度合同（固定价 FAK 或指数挂钩），剩余货量走即期。跨太平洋年度谈判通常在春季（新约 5 月生效），欧线多在年初。合同一旦签下，当年现货运价涨跌不影响这部分收入。\n  - 现货运价 ↑ → 只有合同重签时才变成收入弹性；\n  - 现货运价 ↓ → 合同价仍在保护收入。\n  - 于是利润相对指数的时滞约 1–2 个季度，再叠加燃油与租船成本的滞后。\n- 干散货：船东按航次/期租出租，即期 TCE vs 期租（1–3 年）；FFA（运费远期协议）可提前锁定。BDI 涨 ≠ 船东已经赚到，很多船东在上涨前就把船租出去了。\n- 判读要三个数，缺一不下结论：\n  1. 即期指数（SCFI / BDI）；\n  2. 公司披露的平均实现运价（$/TEU 或 $/day）；\n  3. 合同覆盖率（合同货量占比，公司披露或行业估算）。\n- 周期的标准","indicators":[],"opposing":[]},"KB-14972C36":{"kb_id":"KB-14972C36","title":"外汇储备循环与双赤字空间断裂（含 COFER 边界）","domain":"贸易","type":"基础概念","status":"legacy","one":"一国累计的经常账户顺差并不会自动变成“外汇储备现金趴在账上”，而是通过跨国资本输出、美债回流与黄金分散，与逆差核心国的财","excerpt":"一国累计的经常账户顺差并不会自动变成“外汇储备现金趴在账上”，而是通过跨国资本输出、美债回流与黄金分散，与逆差核心国的财政/经常双赤字构成一套全球对称循环（机制 M10）。\n顺差—逆差对称账本与官方外储锚（本库实测）\n| 角色 | 代表国（2025 WB 经常账户/GDP） | 2025 WB 外汇与黄金总储备 | 在全球循环里的位置 |\n|---|---|---|---|\n| 核心逆差消费者 | 美国 -3.83% · 英国 -3.13% | 美 $1,385B · 英 $214B | 通过贸易逆差输出美元流动性，靠资本账户净流入与发债融资闭环 |\n| 制造与金融顺差中心 | 中国 +3.77% · 德国 +4.45% · 日本 +4.87% · 韩国 +6.57% | 中 $3,749B · 日 $1,371B · 德 $572B · 韩 $4","indicators":[],"opposing":[]},"KB-16BB1CF1":{"kb_id":"KB-16BB1CF1","title":"经常账户与贸易顺差","domain":"贸易","type":"口径陷阱","status":"legacy","one":"经常账户含货物、服务、收入与转移四项。","excerpt":"经常账户含货物、服务、收入与转移四项。\n- BPM6 口径：CA = 货物 + 服务 + 初次收入（工资 + 投资收益）+ 二次收入（转移）。\n- 中国 2024（外汇局，美元计）：货物顺差 7680 亿；服务逆差 2290 亿；初次收入逆差 1300 亿；二次收入顺差 150 亿 → 经常账户顺差 4239 亿美元（约 GDP 2.2%，外汇局口径）。\n- 对照：美国 2024 经常账户约 −4.1% GDP；德国 +5.8%；日本 +4.6%；新加坡 +17.2%（IMF WEO，2024）。\n- 两层口径差，必须分开算：\n  1. 海关 vs 国际收支：中国 2024 海关货物顺差约 9900 亿美元（海关总署，具体值待核），国际收支口径只有 7680 亿。差额来自所有权转移原则、保税区/离岸转手买卖、加工贸易只计加工费。\n  2. 货物 vs 经常账户：差 3441 亿美元，几乎全被服务（−2290）与投资收益（−1300）吃掉。\n-","indicators":[],"opposing":[]},"KB-9DC6546E":{"kb_id":"KB-9DC6546E","title":"能源净进口依赖与全球经济生态位（静态底盘）","domain":"贸易","type":"基础概念","status":"legacy","one":"汇率、利率和股市天天在动，真正决定各国在断航、加税或能源暴涨面前“谁吃亏、谁受益”的，是低频几乎不变的贸易—产业—能","excerpt":"汇率、利率和股市天天在动，真正决定各国在断航、加税或能源暴涨面前“谁吃亏、谁受益”的，是低频几乎不变的贸易—产业—能源净进口生态位。\n### 一、各国低频经济生态位的四象限划分\n用已经相对稳定的年度慢变量，把主要经济体分进 4 类结构位置：\n| 生态位 | 核心识别特征（慢变量组合） | 典型经济体 | 遇到外部冲击时的结构脆弱点 / 缓冲垫 |\n|---|---|---|---|\n| 1. 消费与金融逆差核心 | 贸易依存度低（~25%）· 长期 CA/GDP \u003c 0 · 制造业占比低（~10%）· ka_open=1.0 + 储备货币发钞权 | 美国、英国 | 靠金融账户吸收全球盈余；不怕单个港口卡顿，怕财政赤字叠加外部减持推高长端利率 |\n| 2. 顺差制造中心 | 制造业占比高（18%–25%）· CA/GDP \u003e 0 · 全球出口份额大且 国内增加值率较高 | 中国、德国、日本、韩国 | 高度依赖海外终端需求与外部能源/矿产流入；关税","indicators":[],"opposing":[]},"KB-7A842E9E":{"kb_id":"KB-7A842E9E","title":"贸易依存度","domain":"贸易","type":"口径陷阱","status":"legacy","one":"分子毛值、分母增加值，比值天然虚高，小国必然高。","excerpt":"分子毛值、分母增加值，比值天然虚高，小国必然高。\n- 公式：贸易依存度 = (出口 + 进口) / GDP × 100%。单边写法：出口依存度、进口依存度。世界银行指标 TG.VAL.TOTL.GD.ZS（Trade % of GDP，货物+服务，现价美元）。\n- 实测值（2025，WDI 经 OWID 取数）：新加坡 320.3%、越南 190.3%、荷兰 150.1%、德国 78.5%、印度 46.3%、日本 44.9%、中国 38.0%、美国 25.0%。\n- 为什么大国天然低，三条机制缺一不可：\n  1. 分母大：大国国内分工链长，同样一块增加值在国内多次转手不计入贸易；\n  2. 分子是毛值：加工/转口国把同一块增加值反复计进进出口（→《全球价值链参与度》）；\n  3. 产业完整度：小国几乎每道工序都要跨境，大国可以把中间品留在境内。\n- 比值可以 \u003e100%，这不是数据错误，是口径本身的结果。新加坡 320% 主要来自转口贸易 + 炼化","indicators":[],"opposing":[]},"KB-FA6F6701":{"kb_id":"KB-FA6F6701","title":"运价指数 ≠ 运价","domain":"贸易","type":"口径陷阱","status":"legacy","one":"指数是一篮子的加权平均，不是任何一条航线报价。","excerpt":"指数是一篮子的加权平均，不是任何一条航线报价。\n三个层次的差异，按影响从大到小：\n1. 篮子权重。SCFI 里美西 40ft 占 17.5%、欧洲 40ft 15%，而南非/西非各只 2.5%。美西线单独涨 30% → 综合指数约涨 5.3%；南非线翻倍 → 综合只涨 2.5%。综合指数动 5%，可能只是两条航线的故事。\n2. 附加费。SCFI 报价含 BAF/低硫/旺季/战争/拥堵等附加费，不是纯海运费。\"海运费\"与\"全包价\"能差两成以上（比例随燃油与旺季浮动，具体区间待核）。\n3. 基期。指数点 = 报告期运价 / 基期运价 × 1000。基期不同则点数不可横比——同一周 SCFI 3633.45 vs CCFI 1924.69（2026-11-06），差近一倍纯属基期与篮子差异。\n再叠一层现实：航线之间的绝对运价差一个量级是常态。同一天上海→美西 40ft 与上海→南美 40ft 能差 2–3 倍；20ft 与 40ft 的单位成本也","indicators":[],"opposing":[]},"KB-6F2A54E6":{"kb_id":"KB-6F2A54E6","title":"关键商品与产业链：铜 / 铝 / 铁矿石 / 锂","domain":"商品","type":"基础概念","status":"legacy","one":"铜挂电网、铝挂光伏与汽车、铁矿挂中国地产、锂挂电池。","excerpt":"铜挂电网、铝挂光伏与汽车、铁矿挂中国地产、锂挂电池。\n铜（需求最分散，金融属性最强）\n- 需求端（IWCC 2025，全球）：建筑 25%、基建（电力+电信）18%、交通 15%、消费电子/空调等 22%、工业设备 11%、其他 9%。\n- 第一次加工：线材 63%、板带 11%、管 12%、棒型 9%、箔 5% —— 铜的形态就是\"电\"。\n- 供给与中国的位置：2025 年全球用铜 34.6 Mt（含直接熔炼废铜，再生输入率约 34%）；中国占精铜消费约 59%、精铜产量 48%、冶炼产能 44%；矿端智利 23%、刚果（金）15%、秘鲁 12%。\n- 驱动：电网投资（含数据中心）、地产竣工、空调产量。\"铜=地产\"是过时说法——建筑只占 25%，基建 18% + 电子/空调 22% 加起来更大。\n铝（能源密集型，成本曲线由电价决定）\n- 电解铝是高耗电环节，成本与电价强绑定；中国有产能天花板（约 4500 万吨，待核）。\n- 需求","indicators":[],"opposing":[]},"KB-A3D4F2E4":{"kb_id":"KB-A3D4F2E4","title":"原油定价基准：Brent / WTI / 上海原油（SC）","domain":"商品","type":"基础概念","status":"legacy","one":"三种油、三个交割地、三套规则，价差不是情绪。","excerpt":"三种油、三个交割地、三套规则，价差不是情绪。\nBrent（Dated Brent，Platts 评估）——不是一种油，是一个篮子\n- 篮子 = Brent、Forties、Oseberg、Ekofisk、Troll 五种北海油 + 美国 WTI Midland（2023 年 6 月起纳入），共六种。\n- 规则关键：取当日在评估期内最便宜的那一档成交价，不是加权平均。所以\"今天谁过剩\"会决定 Brent 反映谁。\n- 品质：Brent 本身 API 37.5 / 硫 0.4%；Forties 38.7 / 0.64%；Ekofisk 38.5 / 0.19%；Troll 35.9 / 0.14%（Platts 方法学，2026-08 版）。\n- 报价基础：FOB 北海装港（或 CIF 鹿特丹折算回 FOB），船货 70 万桶 Aframax 级别。\nWTI\n- 轻质低硫（约 API 40 / 硫 \u003c0.3%），交割地库欣（俄克拉何马）。内陆、管道与库容约束强","indicators":[],"opposing":[]},"KB-9BFDEDEE":{"kb_id":"KB-9BFDEDEE","title":"天然气与电力定价机制","domain":"商品","type":"基础概念","status":"legacy","one":"原油是全球统一海运市场，天然气是按管道和液化船运割裂的三大区域价格，而电力因难以大规模储存，是由边际成本最高的那台开机机","excerpt":"原油是全球统一海运市场，天然气是按管道和液化船运割裂的三大区域价格，而电力因难以大规模储存，是由边际成本最高的那台开机机组决定全市场电价。\n天然气：为什么全球没有单一“气价”\n气态占体积，跨洋运输必须先冷却成液化天然气（LNG）再气化，运损与船运/液化费极高，导致三大区域长期分化：\n- 美国 Henry Hub（HH）：页岩气伴生气供应极充沛、本地管网发达，平时价格远低于亚欧，主要反映北美产量、储气库注采季库存与国内出口终端（LNG 液化厂）产能。\n- 欧洲 TTF（荷兰产权转移设施）：失去俄罗斯低价管道气后高度依赖进口 LNG 船货与挪威管道气，价格锚转向全球现货 LNG 争夺成本 + 储气库冬季前补库进度。\n- 亚洲 JKM（Platts 日韩标杆）：与 TTF 在全球现货 LNG 船货上展开抢船竞争，同时亚洲传统长协仍保留与原油价格（如 JCC）挂钩的条款，兼具“油价长协 + 现货竞价”双特征。\n电力市场：为什么是“边际出清（Merit Orde","indicators":[],"opposing":[]},"KB-67BFF594":{"kb_id":"KB-67BFF594","title":"库存与价格","domain":"商品","type":"业内门道","status":"legacy","one":"低库存放大波动，不决定涨跌方向。","excerpt":"低库存放大波动，不决定涨跌方向。\n- 用覆盖天数，不用绝对量：库存 / 日均消费（days of cover）或库存/月消费。同样 100 万吨，在旺季和淡季含义完全不同；跨国家比较更是必须标准化。\n- 四条传导，缺一条就不成立：\n  1. 现货可得性——近月能不能提到货。看期限结构（back 结构 = 紧）+ 现货升水，而不是看总库存；\n  2. 需求还在不在——低库存 + 需求崩塌 = 照样跌（2020 年 4 月 WTI 负价格）；\n  3. 预期是否已定价——期货先动，库存数据滞后 1–2 周；数据公布时价格常已走完；\n  4. 有没有替代/释放机制——战略储备（SPR）、再生料、替代品、进口套利窗口。有释放机制的低库存不等于紧。\n- 库存口径四个坑：\n  - 商业库存 vs 战略储备（SPR / 国储）；\n  - 浮仓（海上漂着的不进任何统计）；\n  - 交易所仓单只覆盖可交割品——中国大量社会库存不在","indicators":[],"opposing":[]},"KB-010A3B42":{"kb_id":"KB-010A3B42","title":"期限结构：contango 与 backwardation","domain":"商品","type":"基础概念","status":"legacy","one":"近月比远月贵是 back，反之为 contango。","excerpt":"近月比远月贵是 back，反之为 contango。\n- 定义：比较 F(T1) 与 F(T2)，T2 \u003e T1。\n  - Backwardation：F(T1) \u003e F(T2)，曲线向下倾斜（近高远低）→ 现货紧张。\n  - Contango：F(T1) \u003c F(T2)，向上倾斜 → 现货充裕。\n- 理论锚（持有成本模型）：\n  \n  F = S × e^((r + c − y) × T)\n  \n  r 资金成本、c 仓储成本、y 便利收益（convenience yield）。\n  - 库存低 → 便利收益 y 高 → 曲线 back；\n  - 库存高 → y 低 → contango，且 contango 幅度上限约等于仓储 + 资金成本（超过就出现无风险套利：买现货、卖期货、入库交割）。\n- 展期收益（roll yield，年化）：\n  \n  roll ≈ (F_near − F_far) / F_","indicators":[],"opposing":[]},"KB-195CE52A":{"kb_id":"KB-195CE52A","title":"电力设备供应链：燃气轮机、变压器、柴发","domain":"商品","type":"业内门道","status":"legacy","one":"电力设备的交付周期，决定数据中心能不能按时通电。","excerpt":"电力设备的交付周期，决定数据中心能不能按时通电。\n| 设备 | 主要厂商 | 作用 | 交付周期（量级，待核） |\n|---|---|---|---|\n| 重型燃气轮机 | GE Vernova / Siemens Energy / 三菱重工 | 自建发电 | 3–5 年 |\n| 变压器 | 日立能源 / 西门子 / 通用电气 | 升压与并网 | 2–4 年 |\n| 柴油发电机 | Caterpillar / Cummins / 康明斯 | 备电 | 1–2 年 |\n关键指标：在手订单（backlog）、订单出货比（book-to-bill）、交付周期、价格涨幅。\n读法：backlog 连续上升 + book-to-bill \u003e 1 + 交付周期拉长 → 供给紧张，电价与设备价格有上行压力。","indicators":[],"opposing":[]},"KB-F240E80B":{"kb_id":"KB-F240E80B","title":"黄金的定价双锚：实际利率与央行购金","domain":"商品","type":"基础概念","status":"legacy","one":"传统金价只看美债实际利率一个锚（负相关）；2022 年后实际利率飙升而金价大涨至 3900+ 美元，说明央行购金与地缘信","excerpt":"传统金价只看美债实际利率一个锚（负相关）；2022 年后实际利率飙升而金价大涨至 3900+ 美元，说明央行购金与地缘信任折价成了第二个硬定价锚。\n双锚框架\n\n金价驱动 = 周期性机会成本锚（美元实际利率 + 美元强弱）  +  结构性信用对冲锚（央行净购金 + 主权/地缘信用溢价）\n\n1. 老锚：实际利率（机会成本）\n   - 黄金不产生利息或股息。美债实际利率（TIPS 收益率）越高，持金的机会成本越高，欧美黄金 ETF（以 SPDR GLD 为代表的金融投机与配置资金）越倾向流出。\n   - 当美元指数走强、美联储转向鹰派时，金价短周期仍对实际利率跃升非常敏感。\n2. 新锚：官方部门购金与储备重构（非价格敏感型买盘）\n   - 自 2022 年美欧冻结俄罗斯外汇储备后，新兴市场央行（中国、波兰、印度、土耳其等）为分散单一主权信用资产敞口，成为持续净买家。\n   - 关键属性：央行购金是战略配置盘、对 50~100 美元/盎司短期波动不","indicators":[],"opposing":[]},"KB-6DB806CC":{"kb_id":"KB-6DB806CC","title":"AI 资本开支的三个口径","domain":"市场","type":"口径陷阱","status":"legacy","one":"加速器 capex、云厂 capex、数据中心投资是三个量，直接比会得出相反结论。","excerpt":"加速器 capex、云厂 capex、数据中心投资是三个量，直接比会得出相反结论。\n| 口径 | 定义 | 来源 | 单位 |\n|---|---|---|---|\n| 加速器 capex | 全球采购 AI 加速器（GPU/ASIC）的开支 | SemiAnalysis 等 | 亿美元/年 |\n| 云厂总 capex | 微软/亚马逊/谷歌/Meta 财报资本支出（含数据中心、服务器、网络） | 10-Q/10-K | 亿美元/季 |\n| 数据中心建设投资 | 新建/扩建数据中心（土建、机电、接入） | CBRE/JLL | 亿美元/年 |\n换算要补的分母：\n1. 加速器 capex ÷ 云厂总 capex = 买卡占比；\n2. 数据中心投资 ÷ 云厂总 capex = 基建占比；\n3. 云厂 capex ÷ 营收 = 投入强度。","indicators":[],"opposing":[]},"KB-C450B3D5":{"kb_id":"KB-C450B3D5","title":"一致预期为什么常错","domain":"跨领域（方法层，主用于市场）","type":"业内门道","status":"legacy","one":"一致预期不是预测，是过去几个月预测的平均值——它天生慢半拍。","excerpt":"一致预期不是预测，是过去几个月预测的平均值——它天生慢半拍。\n### 一、先看它是什么：一个汇总量，不是一个判断\n一致预期 = 对同一指标的多家机构预测的汇总。汇总就有四个可变量，每个都改变结论：\n1. 纳入哪些机构（是否含已停止覆盖的、是否含买方）\n2. 时间窗口（取最近 3 个月 / 6 个月 / 全部在效期内报告）\n3. 权重（等权 / 按覆盖规模 / 按历史准确度）\n4. 是否剔除陈旧报告\n→ 判据一：用之前必须能回答\"这个数取的是哪段时间、几家机构、怎么加权\"。答不上来就写「口径未核」，不允许当基准用。\n（我们目前没有研报数据库，Wind/iFinD 的具体口径与更新频率待核——这一格必须实地读一次数据源说明，不能靠印象。）\n### 二、三个结构性错因\n① 激励导致的方向性偏差（不是能力问题）\n- 卖方评级的分布严重右偏：超九成\"买入/增持\"，2021 年\"卖出\"仅 5 篇（上海证券报 2022-01-14）。A","indicators":[],"opposing":[]},"KB-F23430ED":{"kb_id":"KB-F23430ED","title":"会议公报 vs 发布会 vs 文件","domain":"跨领域（方法层）","type":"业内门道","status":"legacy","one":"公报给方向，发布会给口径，文件给条款——三样东西不能互相替代。","excerpt":"公报给方向，发布会给口径，文件给条款——三样东西不能互相替代。\n### 一、三种载体对照\n| | 会议公报 / 通稿 | 发布会 / 吹风会 | 正式文件 |\n|---|---|---|---|\n| 典型来源 | 新华社播发会议通稿 | 国新办发布会、两会记者会、部委季度发布会 | 国发/国办发/部委发文件、法律、条例 |\n| 独有信息 | 排序、定调词、动词档位、有没有这句 | 口径澄清、数字、答问里的边界 | 条款、时限、责任主体、施行日期 |\n| 没有的东西 | 具体数字、执行主体、时限 | 新政策（通常只是解释） | 定调（定调在上游） |\n| 会不会变 | 措辞会随会议变 | 口径可能被下一场发布会改 | 条款只能靠修法改 |\n| 我们拿它干什么 | 判方向和优先级 | 钉口径、钉数字 | 判落地时间与可执行性 |\n权威性排序不能只用一根轴，要分两个问题：\n- 「这个方向会不会变？」→ 法律/条例 \u003e 中央文件 \u003e 部委文件 \u003e 公报表述 \u003e 发","indicators":[],"opposing":[]},"KB-442CC046":{"kb_id":"KB-442CC046","title":"单一叙事陷阱","domain":"跨领域（方法层）","type":"业内门道","status":"legacy","one":"所有人说法一致时，缺的不是证据，是反方。","excerpt":"所有人说法一致时，缺的不是证据，是反方。\n### 判据一：数\"独立源\"，不数\"报道数\"\n- 转载、编译、同一通稿改写 → 算 1 家。\n- 只有\"自己采访/自己拿到文件/自己算数据\"的算独立源。\n- 事件卡里写 源 N 家 / 独立 M 家（我们已有这个写法，如\"14 源 11 家\"）。M/N \u003c 1/3 时，把它当单一源处理。\n### 判据二：列出\"缺席者\"\n叙事一致时，问三个人为什么没说话：\n| 缺席者 | 说明什么 |\n|---|---|\n| 监管/主管部门 | 可能是没定论，也可能是已定论但不宜公开——两者含义相反，别猜 |\n| 被影响的一方（企业、地方、行业） | 通常最有动机反驳。沉默 = 要么认同，要么被约束，要么还没反应过来 |\n| 天然的反方（做空方、竞争者、受损行业） | 若完全没有反方，先怀疑\"反方是否存在\"，再怀疑\"渠道是否通畅\" |\n### 判据三：找\"被删掉的那一句\"\n比\"新增了什么词\"更强的信号，是上一版有、这一版没了。","indicators":[],"opposing":[]},"KB-46D562A3":{"kb_id":"KB-46D562A3","title":"卖方评级与目标价","domain":"跨领域（方法层，主用于市场）","type":"业内门道","status":"legacy","one":"\"买入\"不是看涨，是\"相对沪深300跑赢\"；而且九成研报都这么写。","excerpt":"\"买入\"不是看涨，是\"相对沪深300跑赢\"；而且九成研报都这么写。\n### 一、评级是相对评级，先翻译成一句话\n研报末尾的标准声明（逐字，行业通行模板）：\n\u003e 「评级标准为报告发布日后 6 到 12 个月内的相对市场表现……以报告发布日后的 6 到 12 个月内的公司股价（或行业指数）相对同期相关证券市场代表性指数的涨跌幅作为基准。其中：A 股市场以沪深300指数为基准，新三板以三板成指/做市指数，香港市场以摩根士丹利中国指数，美国市场以纳斯达克综合指数或标普500指数为基准。」\n→ 判据：读研报第一步，把\"买入\"翻译成\"未来 6–12 个月相对沪深300 跑赢 X 个百分点\"。 各家阈值不同（具体百分比各家自定，需逐家查其评级说明页，待核），所以跨券商比较评级档位没有意义。\n推论：大盘暴跌时，\"买入\"也可以亏钱；指数大跌年份，\"增持\"可能只是跌得少。评级从来不是绝对收益判断。\n### 二、分布严重右偏：这是结构问题，不是能力问题\n| 事实","indicators":[],"opposing":[]},"KB-5DCC90F4":{"kb_id":"KB-5DCC90F4","title":"反事实检验","domain":"跨领域（方法层）","type":"基础概念","status":"legacy","one":"好解释必须能同时解释\"没发生的那一半\"。","excerpt":"好解释必须能同时解释\"没发生的那一半\"。\n### 核心问句（写成一句话，塞进事件卡第 4 节）\n\u003e 如果这个原因不成立，哪个已经能观测到的东西应该长得不一样？\n注意三个要件：①\"原因不成立\"而不是\"原因不存在\"；②必须落到可观测的量；③必须是已经能拿到的数据（否则永远不检验）。\n### 三种对照样本（按可获取性排序）\n| 对照类型 | 怎么找 | 例子 |\n|---|---|---|\n| 内部对照（最强，数据同日同源） | 同一份数据里的分项/子样本 | 核心 CPI vs 整体 CPI；分省数据里政策未覆盖的省 |\n| 时间对照 | 同一对象在事件前/后，且外部条件近似 | 政策公布前 3 个月 vs 后 3 个月 |\n| 外部对照 | 同类主体未受该因素影响 | 同业公司、同类城市、同类品类 |\n### 反向预测清单（判定一个解释够不够硬）\n一个合格的原因，应该同时解释三件事：\n1. 发生的：目标现象。\n2. 没发生的：","indicators":[],"opposing":[]},"KB-0CD14636":{"kb_id":"KB-0CD14636","title":"可证伪原则","domain":"跨领域（方法层）","type":"基础概念","status":"legacy","one":"写不出\"什么结果算我输\"的判断，不是判断。","excerpt":"写不出\"什么结果算我输\"的判断，不是判断。\n### 一、claim 四要素（缺一即不可证伪）\n对象 + 方向 + 阈值 + 时点\n| | ✗ 不可证伪 | ✓ 可证伪 |\n|---|---|---|\n| 货币政策 | 「货币政策将保持宽松」 | 「2026-12-31 前，1 年期 LPR 至少下调 20bp」 |\n| 财政 | 「财政会更加积极」 | 「2026 年政府工作报告赤字率 ≥ 4%」 |\n| 市场 | 「A 股有支撑」 | 「沪深300 在 2026-06-30 收盘高于 2026-03-31」 |\n| 政策 | 「相关办法有望出台」 | 「该办法在国常会后 10 个工作日内于 gov.cn 印发」 |\n四要素里最常缺的是时点——没有时点的判断永远不到期，永远正确。\n### 二、30 秒三自检\n1. 反向情形：写下\"什么数据/公告出现时我认输\"。写不出 → 扔掉或改写。\n2. 可观测性：判据必须是第三方可查的原始发布（统计局、BLS、FO","indicators":[],"opposing":[]},"KB-BE77DF23":{"kb_id":"KB-BE77DF23","title":"同期发生不等于因果","domain":"跨领域（方法层）","type":"基础概念","status":"legacy","one":"两个变量一起动，只说明它们同时被别的什么推动，不说明谁推谁。","excerpt":"两个变量一起动，只说明它们同时被别的什么推动，不说明谁推谁。\n### 归因谬误清单（8 条，逐条给检测动作）\n| # | 谬误 | 长相 | 一条检测动作 |\n|---|---|---|---|\n| 1 | 后此谬误（post hoc） | B 在 A 之后 → A 导致 B | 问：A 与 B 之间隔了多久？中间有哪几跳？（政策→信心→投资→数据，跳不过去就不算链） |\n| 2 | 共变谬误（cum hoc） | A↑ B↑ → A 导致 B | 问：有没有第三个变量同时推 A 和 B？（流动性、基数、季节性） |\n| 3 | 反向因果 | 房价跌→地价跌，还是地价跌→房价跌 | 问：谁先动？用月度/日度数据排前后，不用年度数据 |\n| 4 | 第三变量 | 政策出台与股市上涨同月 | 数同期还有哪 3 个变量变了（外部利率、汇率、监管口径） |\n| 5 | 选择偏差 | 只统计\"降准后上涨\"的样本 | 分母是不是\"所有降准\"，还是\"我记得涨的那几次\" |\n| 6 | 回归均值 | 极","indicators":[],"opposing":[]},"KB-C8EA4B6E":{"kb_id":"KB-C8EA4B6E","title":"基率忽视","domain":"跨领域（方法层）","type":"基础概念","status":"legacy","one":"在问\"这次为什么特殊\"之前，先问\"这类事多久发生一次\"。","excerpt":"在问\"这次为什么特殊\"之前，先问\"这类事多久发生一次\"。\n### 一、四步（每步都有可错的点）\n① 定参考类\n不是\"经济\"，不是\"市场\"，而是可数的事件类：\n| ✗ 太粗 | ✓ 可数 |\n|---|---|\n| \"政策宽松后市场怎么走\" | \"央行在'稳健'基调年份里，12 个月内降准 ≥2 次的次数\" |\n| \"危机后的复苏\" | \"OECD 定义下的衰退结束后 12 个月，该国股指正收益的次数\" |\n参考类要包含：同类主体 + 同类触发 + 同类时间窗。\n② 数分母（最容易错的一步）\n分母是\"出现过多少次这类机会\"，不是\"发生过多少次结果\"。\n- 错：「过去 10 年降准 15 次，其中 9 次之后一个月上涨」→ 这是 P(上涨|降准) = 60%，缺了无条件对照 P(上涨|不降准)。若后者也是 60%，\"降准利好\"这个判断的信息量为零。\n- 也错（另一头）：「降准的概率是 100%」——因为只数了已降准的月份。要算降准概率，","indicators":[],"opposing":[]},"KB-993D3D92":{"kb_id":"KB-993D3D92","title":"官方措辞的强度等级","domain":"跨领域（方法层）","type":"业内门道","status":"legacy","one":"定调词分档位，动词分新旧，删除比新增更响。","excerpt":"定调词分档位，动词分新旧，删除比新增更响。\n### 一、档位表（货币，五档，由紧到松）\n从紧 \u003e 适度从紧 \u003e 稳健 \u003e 适度宽松 \u003e 宽松\n已核事实链：\n- 「稳健」自 2011 年起连续 14 年，2024 年 12 月 9 日政治局会议改为「适度宽松」，12 月 11–12 日中央经济工作会议确认。\n- 2025 年 12 月中央经济工作会议：「继续实施」适度宽松（延续，非新变化）；2026 年政府工作报告延续。\n- 同一档位内部仍有实际操作差异（连平：2011–2013 偏紧、2014–2019「稳健中性」、2020–2024 实质偏松）。→ 档位是标签，操作词才是读数。\n财政档位（同法）：积极 \u003e 更加积极 \u003e 更加积极有为。2024-12 从「积极」升为「更加积极」，并叠加「实施更加积极有为的宏观政策」这一更上位的表述；2025 与 2026 政府工作报告延续「更加积极有为」，赤字率 4% 左右（2025 年提出；2026 年赤字规模","indicators":[],"opposing":[]},"KB-7130A77D":{"kb_id":"KB-7130A77D","title":"\"据知情人士\"的可信度分级","domain":"跨领域（方法层）","type":"业内门道","status":"legacy","one":"判据不是\"匿不匿名\"，是\"这个源能不能被三个问题核掉\"。","excerpt":"判据不是\"匿不匿名\"，是\"这个源能不能被三个问题核掉\"。\n### 一、路透社的三要素（本卡的地基，逐字）\n路透新闻手册对评估匿名消息源的要求：\n\u003e 「两个或更多消息来源好于一个消息来源。评估匿名消息来源时，应权衡该消息来源的业绩记录、职位和动机。使用你的常识。如果信息听起来是错误的，应进一步核实。」\n\u003e\n\u003e 「在例外情况下，当新闻来自直接了解情况的可信赖的消息来源并且信息可靠时，路透社会播发来自单一、匿名消息来源的新闻。单一消息来源报道要经过特别的批准程序。」\n\u003e\n\u003e 「在做首创性报道时，努力证伪和证实你的报道。」「准确始终是第一位的。出错比时效慢更糟糕。」「在播发稿件前，应考虑你将怎样应对挑战或否认。」\n→ 三要素 + 两问，就是分级标尺：\n1. 业绩记录：这个源（或这家媒体）过去的同类爆料，后来被证实了多少？\n2. 职位：他在能知情的位子上吗？（\"接近监管人士\" vs \"某部委参与讨论的人士\"，差别很大）\n3. 动机：他","indicators":[],"opposing":[]},"KB-9DEA34F5":{"kb_id":"KB-9DEA34F5","title":"政策流程刻度：研究／审议／通过／印发","domain":"跨领域（方法层）","type":"业内门道","status":"legacy","one":"同样是\"在研究\"，离落地可能是三个月，也可能是三年。","excerpt":"同样是\"在研究\"，离落地可能是三个月，也可能是三年。\n### 一、两条轨道，两套刻度\n轨道 A：行政（国务院/部委）\n研究 → 审议 → 通过 → 印发 → 实施\n| 刻度 | 长相 | 可核痕迹 | 典型距离下一格 |\n|---|---|---|---|\n| 研究 | \"研究制定\"\"正在研究\" | 无文本 | 不确定，可能不出 |\n| 审议 | \"审议并原则通过\"\"讨论通过\" | 国常会通稿 | 7–10 个工作日到印发 |\n| 通过 | \"会议讨论通过\"（草案稿定稿） | 通稿 + 后续印发件 | 同上 |\n| 印发 | 有文号、有印发日期 | gov.cn 政策文件库 | 数日到数月到施行 |\n| 实施 | 有施行日、有配套细则 | 部门配套文件 | 视过渡期 |\n硬时限（国办函〔2015〕31 号，逐字）：国常会通过的拟印发文件，须在会后 7 个工作日内印发，需协调重大修改意见的 10 个工作日；牵头部门 3 个工作日内报国","indicators":[],"opposing":[]},"KB-C20D69ED":{"kb_id":"KB-C20D69ED","title":"涨跌叙述的选择性","domain":"跨领域（方法层，主用于宏观数据）","type":"口径陷阱","status":"legacy","one":"同一份数据，同比和环比能写出两条相反的标题，而且两条都是真的。","excerpt":"同一份数据，同比和环比能写出两条相反的标题，而且两条都是真的。\n### 一、四种写法（同一份数据至少能拆四层）\n| 维度 | 两边 | 什么时候会得出相反结论 |\n|---|---|---|\n| 同比 vs 环比 | 同比看趋势，环比看拐点 | 去年基数异常时，同比失真、环比正常 |\n| 累计 vs 单月 | 累计平滑，单月噪声大 | 年初单月受春节移位影响 |\n| 名义 vs 实际 | 实际 = 名义 − 价格平减 | 通胀高时名义好看、实际难看 |\n| 整体 vs 核心/分项 | 整体被食品能源主导 | 2023/7 的 CPI 就是典型 |\n还有一层：绝对量 vs 增速。基数低时增速很高但绝对量没回来——\"恢复至疫情前 90%\"和\"同比增长 8%\"可以同时为真。\n### 二、硬案例：2023 年 7 月 CPI（全部出自统计局同一份解读）\n| 口径 | 数值 | 可写成的标题 |\n|---|---|---|\n| 同比 | 由上月持平转为 −0.3% | 「CPI 转","indicators":[],"opposing":[]},"KB-CE6391B0":{"kb_id":"KB-CE6391B0","title":"主权债务重组与巴黎俱乐部机制","domain":"政治","type":"核心概念","status":"legacy","one":"当新兴市场发生主权违约时，真正的博弈往往不在经济算术，而在“巴黎俱乐部传统债权国 + 多边开发银行 + 商业债券持有人","excerpt":"当新兴市场发生主权违约时，真正的博弈往往不在经济算术，而在“巴黎俱乐部传统债权国 + 多边开发银行 + 商业债券持有人 + 新兴双边债权国”之间的优先受偿顺序与减记分摊谈判。\n- 重组的四大债权方阵营：\n  1. 多边机构（IMF/World Bank）：享有事实上的优先债权人地位（Preferred Creditor Status），原则上不削减本金；\n  2. 巴黎俱乐部（Paris Club）：OECD 传统官方双边债权国组织，强调“可比对待原则”（Comparability of Treatment）；\n  3. 新兴双边债权国：基础设施与政策性贷款份额上升，对削减本金与展期重组的口径常存在结构分歧；\n  4. 商业债券与私人银团：包含 Holdout（钉子户）风险与集体行动条款（CACs）的法律博弈。\n- G20 共同框架（Common Framework）卡点：IMF 出具债务可持续性分析（DSA）→ 各方争论多边银行是否让步、","indicators":[],"opposing":[]},"KB-5D0E2AEC":{"kb_id":"KB-5D0E2AEC","title":"产业政策补贴与反补贴贸易摩擦","domain":"政治","type":"基础概念","status":"legacy","one":"一国通过贴息信贷、税收抵免或土地优惠压低战略制造业成本，出口激增后极易在进口国引发“产能过剩与反补贴调查”，推动贸易壁垒","excerpt":"一国通过贴息信贷、税收抵免或土地优惠压低战略制造业成本，出口激增后极易在进口国引发“产能过剩与反补贴调查”，推动贸易壁垒多边蔓延。\n- 两类产业补贴的摩擦传导链：\n  1. 需求与本土含量补贴（如美国《通胀削减法案》IRA 税收抵免）：强制要求本地/盟友组装或电池矿物比例，诱使跨国车企及供应链把资本开支从母国转移至补贴国，但往往引发欧盟等盟友同样推出对等补贴竞赛。\n  2. 供给端产能扩张补贴（定向低息融资、退税、园区基础设施）：短期内大幅推升全行业投资（固定资产投资 \u003e 终端零售需求），国内 PPI 持续承压而企业为摊薄固定成本被迫转向海外低价出口。\n- 三项实操判别准则：\n  - 看 全球产能利用率 \u0026 行业利润率（国内企业盈利大面积微利/应收账款拉长同时出口量激增）；\n  - 看 目标国反制外溢圈：贸易摩擦是否从美欧一线扩大至巴西、印度、东南亚等新兴制造市场；\n  - 看 跨国企业资本开支流向（本土暂停扩产 vs 贴近补贴","indicators":[],"opposing":[]},"KB-9999FA56":{"kb_id":"KB-9999FA56","title":"关键矿产联盟与友岸外包规则","domain":"政治","type":"mechanism","status":"draft","one":"关键矿产竞争不是“能不能挖到矿”，而是通过原产地比例、受关注外国实体（FEOC）排除和碳边界规则，用法律条文重构锂、钴、","excerpt":"关键矿产竞争不是“能不能挖到矿”，而是通过原产地比例、受关注外国实体（FEOC）排除和碳边界规则，用法律条文重构锂、钴、镍、稀土的全球精炼与中游投资版图。\n- 三类合规过滤工具：\n  - 补贴排他门槛：如美国《通胀削减法案》(IRA) 对电池关键矿产在美或 FTA 协定国提取/加工占比的逐年递增要求，及 FEOC 一票否决权；\n  - 盟友矿产俱乐部：美国主导的矿产安全伙伴关系（MSP）、欧盟《关键原材料法案》（CRMA）设定的单一第三国依赖上限（65%）；\n  - 碳足迹与尽职调查壁垒：欧盟电池法规要求全生命周期碳足迹追踪，提高高煤电地区精炼产能的隐性关税。\n- 价格分化风险：合规矿（IRA/CRMA-compliant）与非合规矿之间在极端情形下可能出现双轨溢价（Green/Compliant Premium）。","indicators":[],"opposing":[]},"KB-446B496C":{"kb_id":"KB-446B496C","title":"出口管制与产业链技术脱钩","domain":"政治","type":"基础概念","status":"legacy","one":"出口管制不是普通关税：它通过“直接产品规则（FDPR）”跨越国界卡死供应链中不可替代的极窄瓶颈，逼使商业利益让位于安全合","excerpt":"出口管制不是普通关税：它通过“直接产品规则（FDPR）”跨越国界卡死供应链中不可替代的极窄瓶颈，逼使商业利益让位于安全合规。\n- 核心抓手识别：\n  1. 直接产品规则（FDPR）与实体清单：只要全球任何第三国代工厂用到了管制方软件（EDA）或核心设备（EUV/DUV/精密蚀刻），即便在海外生产的产品也可纳入管辖。\n  2. 跨部委与国会博弈（政治外溢窗口）：执法力度（许可批还是卡）取决于行政部门（如美国商务部 BIS vs 白宫安全顾问）与国会委员会（银行/外交/特种委员会听证）之间的压力平衡；合规审批人员人事动荡或听证传唤本身就是制度风向标。\n  3. 双向不对称卡脖子：算力硬件与光刻设计受出口管制约束，同时关键矿物精炼（稀土、镓、锗、锂加工）构成反向出口许可筹码。\n- 典型产业传导三阶段：\n  - 第 1 阶段（禁令落地前夕）：下游客户恐慌性提前备货（Pull-forward），短线财报反而呈现“超常规拉货增长”；","indicators":[],"opposing":[]},"KB-64335D15":{"kb_id":"KB-64335D15","title":"制裁工具与长臂管辖评估","domain":"政治","type":"业内门道","status":"legacy","one":"同样叫“制裁”，象征性冻结高官签证与踢出美元清算/实施二级制裁（Secondary Sanctions）的冲击量级相差十","excerpt":"同样叫“制裁”，象征性冻结高官签证与踢出美元清算/实施二级制裁（Secondary Sanctions）的冲击量级相差十倍以上。\n按破坏链条的实质咬合力分四档识别制裁强度：\n| 级别 | 常见工具（如 OFAC / EU / 商务部清单） | 实质外溢机制 |\n|---|---|---|\n| T1 象征/外交限制 | 政要旅行禁令、少量个人资产冻结、议会谴责议案 | 几乎不改贸易与金融流向，短线情绪噪音 |\n| T2 精准实体/技术列单 | 个别企业加入实体清单、限制特定军民两用件交付 | 局部供应链改道、合规成本与审批周期拉长 |\n| T3 一级部门制裁 | 能源巨头/主要商业银行/航运油轮列入 SDN 冻结清单 | 逼迫第三国买家寻找“影子船队”与本币结算，扩大区域贴水 |\n| T4 二级制裁 / 清算切断 | 威慑第三国银行/港口若与其交易则同失美元/欧元清算权 | 立刻冻结合同货权、保险与贸易融资，改变大宗商流与外储构成 |\n- “长臂","indicators":[],"opposing":[]},"KB-FF946A2D":{"kb_id":"KB-FF946A2D","title":"国际组织治理权与SDR投票权配额","domain":"政治","type":"核心概念","status":"legacy","one":"IMF 与世界银行的份额（Quota）不只是象征性的话语权，它直接决定特别提款权（SDR）增发分配比例、危机贷款额度上限","excerpt":"IMF 与世界银行的份额（Quota）不只是象征性的话语权，它直接决定特别提款权（SDR）增发分配比例、危机贷款额度上限，以及重大改革需 85% 绝对多数时的单国一票否决权。\n- IMF 份额（Quota）与 85% 超级多数阈值：美国拥有约 16.5% 投票权，对所有需要 85% 票数通过的重大决议（如份额占比重算、修改协定条款）拥有法定一票否决权。\n- SDR 的本质与局限：SDR 是储备资产补充分配权（按既有份额配发，而非按流动性需求），主要持有在央行间；不直接等价于可市场自由流通的美元现金，需通过自愿交易安排（VTA）向有需要国家兑换硬通货。\n- 第16轮份额总检查（2023/2024）等比增资特点：若只等比增资（Equiproportional Increase）而不重配份额占比，则各方权力比例冻结，新兴经济体代表性不足问题延后。","indicators":[],"opposing":[]},"KB-845F0D89":{"kb_id":"KB-845F0D89","title":"地缘峰会公报与实质约束力读法","domain":"政治","type":"practice","status":"draft","one":"看多边峰会（G7/G20/APEC/北约/双边元首会晤）不能只看新闻通稿里的宏观形容词，关键看“是否设常设工作组/时间表","excerpt":"看多边峰会（G7/G20/APEC/北约/双边元首会晤）不能只看新闻通稿里的宏观形容词，关键看“是否设常设工作组/时间表/拨款额/联合执法机制”，并逐字比对去年同场合文本。\n按约束力四阶梯度拆解峰会文本：\n1. L4 硬件承诺：明确法律机制设立、多国联合财政/武器出资额、具体生效日或制裁联动触发条文；\n2. L3 机制化工作组：明确外交、经贸或军事工作组层级与下次汇报节点（可跟踪是否按期开会验证）；\n3. L2 措辞梯度微调：逐年 diff 公报文本——例如从“支持……原则”到“深刻关切 / 强烈谴责”、或是否写入特定国家/地区名；\n4. L1 纯意愿表达：仅“欢迎讨论 / 认识到挑战 / 重申长期伙伴关系”，无资金无日程无机构挂钩 → 视为外交噪音。\n- 看“谁没签字 / 谁发补充声明”：如 G20 无法达成共识时常改为“东道主主席声明”，直接反映阵营内裂度。","indicators":[],"opposing":[]},"KB-C0541881":{"kb_id":"KB-C0541881","title":"外资安全审查与CFIUS否决链","domain":"政治","type":"业内门道","status":"legacy","one":"现代跨境并购和绿地投资面对的不只是“反垄断否决”，还有以美国 CFIUS 和欧盟 FDI 审查为代表的国家安全否决链——","excerpt":"现代跨境并购和绿地投资面对的不只是“反垄断否决”，还有以美国 CFIUS 和欧盟 FDI 审查为代表的国家安全否决链——甚至正在向“对外逆向投资禁令”延伸。\n- 双向审查网的演变：\n  1. 入境投资审查（Inbound FDI）：美国 CFIUS（基于 FIRRMA 扩大至关键技术 TID、关键基础设施、敏感个人数据及敏感设施周边不动产）、欧盟 FDI Screening 框架、英国 NSIA 2021；\n  2. 缓和协议与强行剥离（Mitigation \u0026 Divestment）：即便不直接总统令禁止，监管方也可强制签署高昂合规成本的《国家安全协议》，或事后追溯未申报交易强制限期剥离；\n  3. 出境逆向审查（Outbound Investment / EO 14105 等）：针对受关注国家/地区的半导体与微电子、量子信息、特定 AI 系统的美元 PE/VC/合资投资实施禁止或强制备案。\n- 交易套利观察：跨境并购公告后，看双方是否签署了针对","indicators":[],"opposing":[]},"KB-38B7382E":{"kb_id":"KB-38B7382E","title":"大选年关税威胁与行政令执行落差","domain":"政治","type":"业内门道","status":"legacy","one":"竞选集会上的“普遍加税 60%/20%”与政府上台后真正落地的有效税率（Effective Tariff Rate）之间","excerpt":"竞选集会上的“普遍加税 60%/20%”与政府上台后真正落地的有效税率（Effective Tariff Rate）之间，隔着法律授权路径、听证排查、产品豁免清单与供应链转口套利四大缓冲阀。\n拆解美国等经济体加征关税的四条法律工具速度与约束差异：\n| 法律工具 | 启动与生效速度 | 法律阻力与约束条件 |\n|---|---|---|\n| 301 条款（贸易代表） | 需正式调查、公众评论与听证（通常 6–12 个月） | 目标国别聚焦，易遭行业豁免游说稀释，但司法根基稳固 |\n| 232 条款（商务部国家安全） | 商务部调查期限法定 ≤270 天 | 需挂钩国家安全（钢铝、汽车、关键金属），适用范围有限 |\n| IEEPA 国际紧急经济权力法 | 总统宣布国家紧急状态即可快速动用 | 面临越权争议与联邦法院违宪/越权诉讼风险，持久性存疑 |\n| 互惠贸易与国会立法 | 需参众两院通过与协调委员会拉锯 | 执行周期最长、利益集团妥协多，但一旦立法最难逆转","indicators":[],"opposing":[]},"KB-74EEF1CD":{"kb_id":"KB-74EEF1CD","title":"政局稳定度WGI指标口径与脆弱国家识别","domain":"政治","type":"数据口径","status":"legacy","one":"世界银行全球治理指标（WGI：GOV_WGI_PV_EST、GE_EST、RL_EST）标准估计值严格落在","excerpt":"世界银行全球治理指标（WGI：GOV_WGI_PV_EST、GE_EST、RL_EST）标准估计值严格落在 [-2.5, +2.5] 正态近似区间，均值约 0；任何超出该量纲（如早期 DS57 废弃代码 PV.EST 出现的 -30~+18）均为错配数据。\n- 三个核心常用分项：\n  - GOV_WGI_PV_EST（政治稳定与无暴力/恐怖主义）：测度政府被非常规/暴力手段动摇的概率感知；\n  - GOV_WGI_GE_EST（政府效能）：评估公共服务质量、文官独立性与政策执行兑现力；\n  - GOV_WGI_RL_EST（法治水平）：契约执行信心、产权保护与司法独立度。\n- 读数校准：+1.0 以上通常对应高稳定高治理经济体；-0.5 至 -1.0 属承压预警区；\u003c-1.5 多对应持续内战、恶性动荡或主权制度崩溃态。\n- 复合指标特性：WGI 由 EIU、Freedom House、世界银行调查等 30","indicators":[],"opposing":[]},"KB-B4713BD0":{"kb_id":"KB-B4713BD0","title":"政府关门财政悬浮与债务上限冲击","domain":"政治","type":"核心概念","status":"legacy","one":"美国“政府关门”（拨款到期）主要打击短期 GDP 统计发布与联邦雇员支出节奏，不直接造成违约；真正引发货币市场海啸的是“","excerpt":"美国“政府关门”（拨款到期）主要打击短期 GDP 统计发布与联邦雇员支出节奏，不直接造成违约；真正引发货币市场海啸的是“债务上限（Debt Ceiling）X-Date 博弈”带来的 TGA 抽水与泄洪周期。\n- 政府关门（Government Shutdown）：年度 12 项拨款法案或临时持续决议（CR）到期未签。影响：非必要联邦机构停摆（BLS/BEA 延迟发布 CPI/非农）、承包商回款推迟，但国债付息（属强制支出 Mandatory）照常进行。\n- 债务上限僵局（Debt Limit）的三阶段流动性冲击：\n  1. 逼近上限阶段（非常措施期）：财政部消耗 TGA 余额且暂停净发债 → 市场相当于被净注入流动性（与表面危机新闻相反）；\n  2. X-Date 违约边缘：特定到期日国库券收益率出现“扭结/尖峰”（Kinked T-Bills），货币基金规避到期日风险；\n  3. 协议达成后 TGA 重建阶段：上限冻结/提高后财政部海量","indicators":[],"opposing":[]},"KB-45FA1B10":{"kb_id":"KB-45FA1B10","title":"数据中心选址的地方政治","domain":"政治","type":"业内门道","status":"legacy","one":"数据中心落在哪，由电价、水、土地和选票共同决定。","excerpt":"数据中心落在哪，由电价、水、土地和选票共同决定。\n| 变量 | 看什么 | 判据 |\n|---|---|---|\n| 电价与税收优惠 | 州/县是否给数据中心税收减免 | 优惠取消=项目经济性变差 |\n| 水权与冷却 | 是否要求闭式冷却/用水上限 | 限水=选址受限 |\n| 土地与分区 | 是否允许工业用电大户 | 分区否决=项目搁置 |\n| 社区抗议 | 是否有组织化反对 | 抗议持续=审批延后 |\n| 政治归属 | 州长/议会在野党变化 | 变天=政策转向概率上升 |\n判断顺序：先看州长与议会归属是否变化 → 再看是否出台暂停令（moratorium）或取消税收优惠 → 最后看具体县的分区投票。","indicators":[],"opposing":[]},"KB-ED011D70":{"kb_id":"KB-ED011D70","title":"选举周期与财政货币悬崖","domain":"政治","type":"业内门道","status":"legacy","one":"大选年与新旧政权交接窗口里，财政减税/加码易过关而紧缩难落地，“政府停摆/债务上限/央行主席换届”会把纯粹的政治议程直接","excerpt":"大选年与新旧政权交接窗口里，财政减税/加码易过关而紧缩难落地，“政府停摆/债务上限/央行主席换届”会把纯粹的政治议程直接折现成国债期限溢价。\n- 四个核心政治—经济节点：\n  1. 选前扩展与预算悬崖：执政党在重大选举年（及参众两院席位争夺如 Mississippi Senate 等关键翻转信
