y）：\n   - 光学卫星（如 Planet / Maxar / Airbus）：清晰辨别弹坑直径、机堡烧毁黑斑、桥梁断口；但受云层与黑夜限制；\n   - 合成孔径雷达（SAR）：穿透云层与黑夜观测金属舰船轮廓、大型轰炸机移防或集结营地变动；\n3. 海空电子轨迹（AIS / ADS-B）与电子干扰监测：\n   - 军机常关闭应答机，但加油机/运输机与战略侦察机（P-8A, RQ-4）常保留公开轨迹，反映前线压迫度","indicators":[],"opposing":[]},"KB-70687AC9":{"kb_id":"KB-70687AC9","title":"战略核威慑与核门槛模糊化信号","domain":"军事","type":"核心概念","status":"legacy","one":"现代核风险很少以“直接核打击”呈现，更多体现为“核学说（Doctrine）模糊化下调、非战略战术核力量前沿部署、以及常规","excerpt":"现代核风险很少以“直接核打击”呈现，更多体现为“核学说（Doctrine）模糊化下调、非战略战术核力量前沿部署、以及常规打击触及核预警与二次核反击基础设施的灰色重叠”。\n按风险层级由浅入深识别核信号：\n1. 修辞级：高层演讲或媒体表态重申核威慑能力，未改政策文本与战备状态 → 心理威慑（M11 短期波动通常可控）；\n2. 文件/条约级：正式发布新版国家核学说文本（扩大可触发核反击的常规攻击情景）、或退出/暂停《新削减战略武器条约》(New START) 核查与数据交换；\n3. 部署与演训级：将战术核弹头或具备双用途投送能力的载具（非战略核武器 Nonstrategic Nuclear Weapons）前进部署至盟友领土、或弹道导弹核潜艇/轰炸机提高出航战备频次；\n4. 预警与指挥链路触碰级：常规远程无人机/导弹击中超视距预警雷达（如沃罗涅日雷达站）、核指挥通信节点，触发“无核但伤及战略眼睛”的误判风险。\n- 双用途载具（Dual-capable","indicators":[],"opposing":[]},"KB-8D0865E9":{"kb_id":"KB-8D0865E9","title":"海上咽喉封锁与战争险溢价机制","domain":"军事","type":"基础概念","status":"legacy","one":"现代海上交火罕见全面击沉商船队，真正卡死全球运力、推升油价与集运指数的，是船东因“战争险保费暴涨（或拒保）被迫集体绕行+","excerpt":"现代海上交火罕见全面击沉商船队，真正卡死全球运力、推升油价与集运指数的，是船东因“战争险保费暴涨（或拒保）被迫集体绕行+15天”。\n### 一、区分两种完全不同的“堵船经济学”（对照 EIA CHOKEPOINTS_EIA）\n| 咽喉通道 | 石油 (mb/d) | LNG (Bcf/d) | 若遭袭击/封锁的真实物理与金融传导链 |\n|---|---|---|---|\n| 霍尔木兹海峡 | 20.9（≈全球20%） | 11.4（\u003e20%贸易） | 真·供应绝对硬缺口：管线旁路总上限仅约 ~4.7 mb/d，物理上无法通过绕海弥补 → 直接引爆能源 供给冲击（M3） 与布伦特大幅 Backwardation |\n| 马六甲海峡 | 23.2（全球海运~29%） | 9.2 | 东亚制造业与能源进口命门（中国占通过量约 ~48%），绕巽他/龙目海峡将大幅拉长油轮与干散货航期 |\n| 巴布曼德 \u0026 苏伊士 |","indicators":[],"opposing":[]},"KB-5114A1B1":{"kb_id":"KB-5114A1B1","title":"海军护航编队与红海绕行运力占用测算","domain":"军事","type":"数据口径","status":"legacy","one":"集装箱与油轮改道非洲好望角单程拉长约 3,500 海里、航时增加 10–14 天；在航线距离被动拉长 25%–35% 后","excerpt":"集装箱与油轮改道非洲好望角单程拉长约 3,500 海里、航时增加 10–14 天；在航线距离被动拉长 25%–35% 后，即使全球货量未增，也会等效冻结全行业约 6%–10% 的有效运力供给。\n用周转天数 × 即期/长协剪刀差拆解真实挤压深度：\n1. 航程乘数：亚欧航线原本约 30–35 天经苏伊士，绕好望角增至 40–48 天。按相同周班频率（Weekly Service）维护船期，船司必须在每条环线上额外投入 2–3 艘大型集装箱船；\n2. SCFI vs CCFI 分歧校验：\n   - SCFI（上海出口集装箱即期运价）对绕行抢舱与港口跳港极其敏感，先于合同价剧烈飙升；\n   - CCFI（中国出口集装箱综合运价）含约 50%–70% 年度长协权重，曲线滞后且波动温和——若 SCFI/CCFI 比值持续大幅拉大，说明扰动已由情绪转入结构性舱位紧缺；\n3. 军事护航边界：多国海军护航编队重点保护高风险船只或关键通道，但只要商业保","indicators":[],"opposing":[]},"KB-85EBD430":{"kb_id":"KB-85EBD430","title":"海底电缆与能源管线灰区破坏经济传导","domain":"军事","type":"mechanism","status":"draft","one":"全球 95% 以上的洲际数据流量（包括 SWIFT 与高频金融结算指令）经由水下光缆传输；对管线、光缆与海风电互联的“灰","excerpt":"全球 95% 以上的洲际数据流量（包括 SWIFT 与高频金融结算指令）经由水下光缆传输；对管线、光缆与海风电互联的“灰区破交”成本极低且极难归因，冲击路径直指区域气电价格与跨境通信韧性。\n- 三类物理易损枢纽：\n  1. 高密度光缆瓶颈海域：苏伊士/红海（欧亚数据主干道）、马六甲与吕宋海峡、波罗的海；单点断裂常有备用路由分流，但多根干线在狭窄海峡同时受损或修复船因战火延误入场（维修期可达数周）会推升亚欧时延与备份带宽溢价；\n  2. 跨国天然气海管：如波罗的海/地中海海底管道，一旦发生物理断裂或阀门关闭，立刻引发欧洲 TTF / 亚洲 JKM 基准天然气期价脉冲；\n  3. 跨海电力互联线路与海上风电升压站：中断后直接拉高原进口区域的实时边际电价。\n- 灰区归因困境（Attribution Delay）：锚链拖拽、无人潜航器破交与商用船伪装使得官方调查往往耗时数月，其间市场只能依靠商业维修调度、海军护航升级与能源现货升水定价。","indicators":[],"opposing":[]},"KB-E1D169C9":{"kb_id":"KB-E1D169C9","title":"电子战GPS欺骗与低轨星座军事依赖","domain":"军事","type":"核心概念","status":"legacy","one":"高烈度电子对抗能使纯依赖卫星导航（GPS/GLONASS）的制导弹药圆概率误差（CEP）从数米退化至数十上百米，并将战场","excerpt":"高烈度电子对抗能使纯依赖卫星导航（GPS/GLONASS）的制导弹药圆概率误差（CEP）从数米退化至数十上百米，并将战场指挥控制重心强推向低轨巨型通信星座与抗干扰视觉/惯性末端导引。\n- 导航压制（Jamming）与欺骗（Spoofing）区分：\n  - 压制：用大功率宽带噪音淹没微弱卫星信号，迫使制导武器退回纯惯性导航（INS），精度随飞行时间漂移；\n  - 欺骗：发射伪造伪距信号，诱导无人机或民航客机/商船 AIS 显示坐标漂移至数百公里外机场或海洋圆环——可直接用于无核/无火力灰区威慑及航道骚扰；\n- 低轨星座（LEO）战时脆弱性与主权争议：\n  - 地面终端密度远超传统高轨 GEO 卫星波束容量，且跳频抗截获强；\n  - 但由于属私营商业运营架构，地缘服务划界（Geofencing）权限高度集中于少数企业或母国政府出口许可监管之下，形成新的“单点政治开关风险”。","indicators":[],"opposing":[]},"KB-4A920081":{"kb_id":"KB-4A920081","title":"防空反导拦截成本比与弹药库耗竭阈值","domain":"军事","type":"mechanism","status":"draft","one":"当防御方持续用单发 \\$100万–\\$400万 的防空拦截弹去打 \\$2万–\\$5万 的单程攻击无人机时，胜负不取决于单","excerpt":"当防御方持续用单发 \\$100万–\\$400万 的防空拦截弹去打 \\$2万–\\$5万 的单程攻击无人机时，胜负不取决于单晚拦截率，而取决于防空库存与国防工业年产能何时在成本不对称中被先抽干。\n建立消耗战成本方程的三个观察尺度：\n| 维度 | 攻击端（无人机/低成本弹道） | 防御端（爱国者/标准SM/铁穹/萨德） | 决定性比率 |\n|---|---|---|---|\n| 单发边际成本 | 巡飞弹 \\$2万–\\$8万；诱饵弹更低 | 传统中远程防空弹 \\$100万–\\$400万+ | 交换比 1:20 ~ 1:100 |\n| 月度产补弹性 | 民用供应链复用率高，容易数千架扩产 | 固体发动机、导引头芯片产线受限，年产仅数百至千枚级 | 库存净消耗速率（Burn Rate vs Replacement） |\n| 破防反制路径 | 饱和齐射+低空地形穿透+混合高超音速弹 | 软杀伤电子战、激光/防空炮近防、源头打击发射阵地 | 成本对称性是否被低成本防空手段","indicators":[],"opposing":[]},"KB-C871E574":{"kb_id":"KB-C871E574","title":"凯恩斯主义 vs 货币主义与新古典","domain":"流派争论","type":"theory","status":"draft","one":"经济波动遇到冲击时，市场到底是靠财政托底修正的“有效需求不足”，还是必须严守货币规则、任何相机抉择都会被预期抵消？","excerpt":"经济波动遇到冲击时，市场到底是靠财政托底修正的“有效需求不足”，还是必须严守货币规则、任何相机抉择都会被预期抵消？\n### 流派交锋矩阵（基于经典著作核心命题）\n| 维度 | 凯恩斯主义（《就业、利息和货币通论》） | 货币主义（弗里德曼《美国货币史》） | 新古典 / 理性预期（卢卡斯批判） |\n|---|---|---|---|\n| 核心病灶假设 | 工资与价格黏性；有效需求不足时存在持续非自愿失业与平衡萎缩 | “通胀无论何时何地都是货币现象”；大萧条是央行货币收缩制造的，非市场内生 | 市场迅速出清；行为主体根据全部已知信息理性前瞻并内化政策规则 |\n| 短/长期政策效力 | 短期财政政策最有效（货币在流动性陷阱中失灵） | 短期货币有强实效应，但有 12~24 月不定长时滞；长期货币中性，仅决定物价 | 任何已被预期到的宏观刺激均无效；只有超预期噪声能短暂欺骗产出 |\n| 应对滞胀/紧缩处方 | 逆周期赤字投资与转移支付，先保就业","indicators":[],"opposing":[]},"KB-B762EA71":{"kb_id":"KB-B762EA71","title":"奥地利学派 vs 现代货币理论（MMT）","domain":"流派争论","type":"theory","status":"draft","one":"主权印钞与赤字融资，究竟是在真实资源约束前毫无违约风险的政策空间（MMT），还是必然扭曲资本时间结构、最终引发剧烈衰退与","excerpt":"主权印钞与赤字融资，究竟是在真实资源约束前毫无违约风险的政策空间（MMT），还是必然扭曲资本时间结构、最终引发剧烈衰退与滞胀的毒药（奥地利学派）？\n### 流派交锋矩阵\n| 维度 | 奥地利学派（米塞斯 / 哈耶克《价格与生产》） | 现代货币理论（凯尔顿《赤字迷思》/ 莫斯勒） |\n|---|---|---|\n| 利率与资本本质 | 自然利率由跨期真实储蓄决定；央行人为压低利率会向企业家发出“虚假储蓄信号” | 主权货币发行国对本币没有收入/偿付约束，基准利率本质上可由央行行政锁定 |\n| 赤字与通胀后果 | 信贷扩张必定引诱资本流向高迂回长周期“错误投资”（Malinvestment），热潮消退即迎清偿式大萧条 | 财政赤字等于民间净金融资产增量；唯一真实天花板是劳动力与能源等实际产能通胀（非债务上限） |\n| 极端情境主张 | 必须容忍危机期的自然出清、停止救助僵尸资产、恢复硬货币或自由银行纪律 | 停用债务占比 scaremongering","indicators":[],"opposing":[]},"KB-CE8FDFB5":{"kb_id":"KB-CE8FDFB5","title":"现实主义均势安全 vs 自由制度主义依存","domain":"流派争论","type":"theory","status":"draft","one":"国家间冲突与经贸交织时，高度相互依存的供应链到底是抑制战争的“压舱石”（自由制度主义），还是随时可被拧断扼喉的“武器化筹","excerpt":"国家间冲突与经贸交织时，高度相互依存的供应链到底是抑制战争的“压舱石”（自由制度主义），还是随时可被拧断扼喉的“武器化筹码”（现实主义与武器化相互依存）？\n### 流派交锋矩阵\n| 维度 | 现实主义 / 攻防均势（华尔兹 / 米尔斯海默） | 自由制度主义（基欧汉 / 奈《权力与相互依赖》） | 武器化相互依存（法雷尔 \u0026 纽曼） |\n|---|---|---|---|\n| 国家目标权重 | 相对收益（Relative Gains）优先：宁可自己慢 1%，也不让对手多赚 2% 转化成军力 | 绝对收益（Absolute Gains）优先：多边机制与深度贸易使冲突毁约成本高于收益 | 关注全球网络中心节点控制权（SWIFT、美元清算、EUV 光刻、海底光缆） |\n| 面对安全危机 | 安全困境螺旋：一国防御性扩军必然被他国视为进攻性威胁，诱导对等军备升级 | 机制与条约提供信息透明度与惩罚预期，促进危机降温与重回谈判桌 | 占据枢纽位置的一方优先选","indicators":[],"opposing":[]},"KB-276B6224":{"kb_id":"KB-276B6224","title":"重商主义制造优先 vs 自由贸易比较优势","domain":"流派争论","type":"theory","status":"draft","one":"大国究竟该按比较优势“能买则买、专攻高附加值金融/科技”，还是宁可承受短中期价格效率损失，也要用关税与补贴保住本土制造产","excerpt":"大国究竟该按比较优势“能买则买、专攻高附加值金融/科技”，还是宁可承受短中期价格效率损失，也要用关税与补贴保住本土制造产能与工业生态？\n### 流派交锋矩阵\n| 维度 | 自由贸易 / 比较优势派（李嘉图 / 赫克歇尔—俄林） | 生产力学派 / 新重商主义（李斯特《政治经济学的国民体系》） |\n|---|---|---|\n| 静态 vs 动态视角 | 各国专注要素禀赋优势品，自由交换扩大全球与双边消费可能性边界 | “财富的生产力比财富本身更重要”；幼稚工业与系统能力必须跨越规模学习曲线才有未来优势 |\n| 顺逆差定性 | 经常账户逆差是资本项目流入（外国信任投资本国）的自然镜像，无需行政干预 | 长期制造业外流导致技术空心化、国防动员与就业撕裂（见 斯托尔珀—萨缪尔森定理：受损要素持续承压） |\n| 政策工具箱 | 零关税/多边规则、反补贴限制、汇率自由浮动调节 | 选择性关税墙、本土含量补贴（如本土生产退税）、资本流出与产业外迁限制 |","indicators":[],"opposing":[]}}};
const KB_MAP = DATA.kb_map || {};
let currentRate = 1.0;
let currentTracks = [];

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function initTheme() {
  const saved = localStorage.getItem("em_theme");
  const btn = document.getElementById("theme-btn");
  if (saved === "dark") { document.documentElement.dataset.theme = "dark"; btn.textContent = "日间"; }
  btn.addEventListener("click", () => {
    const dark = document.documentElement.dataset.theme === "dark";
    document.documentElement.dataset.theme = dark ? "light" : "dark";
    localStorage.setItem("em_theme", dark ? "light" : "dark");
    btn.textContent = dark ? "夜间" : "日间";
  });
}

      </div>`;
    }).join("");
    body.innerHTML = `
      <div style="font-size:12px;color:var(--muted);">${esc(card.kb_id)} · ${esc(card.domain)} · ${esc(card.type)}</div>
      <h3 style="margin:6px 0 10px;font-size:18px;">${esc(card.title)}</h3>
      ${card.one ? `<p style="font-weight:600;color:var(--accent);">${esc(card.one)}</p>` : ""}
      <div style="font-size:13.5px;white-space:pre-line;color:var(--text-soft);background:var(--surface-alt);padding:12px 14px;border-radius:10px;">${esc(card.excerpt || "暂无摘要")}</div>
      ${(card.indicators || []).length ? `<div style="margin-top:10px;font-size:12.5px;color:var(--muted);">关键观察指标：${card.indicators.map(x => `<span class="pill pill-muted">${esc(x)}</span>`).join("")}</div>` : ""}
      ${oppHtml}
    `;
  }
  document.getElementById("kb-backdrop").classList.add("open");
  document.getElementById("kb-drawer").classList.add("open");
}
function closeKbDrawer() {
  document.getElementById("kb-backdrop").classList.remove("open");
  document.getElementById("kb-drawer").classList.remove("open");
}
window._openKb = openKbDrawer;

function playTrack(idx) {
  const tr = currentTracks[idx];
  const player = document.getElementById("wk-player");
  if (!tr || !player) return;
  player.src = tr.rel_url || "";
  player.playbackRate = currentRate;
  player.play().catch(() => {});
  document.getElementById("audio-now").textContent = `[${tr.orderLabel}] ${tr.title}（${tr.chars || 0} 字）`;
  document.querySelectorAll("#audio-tracks .track-pill").forEach((b, i) => b.classList.toggle("playing", i === idx));
}
window._playTrack = playTrack;

function renderAudioBar(issue) {
  const bar = document.getElementById("audio-bar");
  const tracks = (issue.audio && issue.audio.tracks) || [];
  currentTracks = tracks;
  if (!tracks.length) { bar.style.display = "none"; return; }
  bar.style.display = "block";
  const player = document.getElementById("wk-player");
  player.src = tracks[0].rel_url || "";
  document.getElementById("audio-now").textContent = `[${tracks[0].orderLabel}] ${tracks[0].title}（共 ${tracks.length} 段）`;
  document.getElementById("audio-tracks").innerHTML = tracks.map((t, i) =>
    `<button class="track-pill ${i===0?'playing':''}" onclick="window._playTrack(${i})">▶ ${esc(t.orderLabel)} ${esc((t.title||'').slice(0,22))}</button>`
  ).join("");
}

function renderStakeholdersHtml(artIdx, stakeholders) {
  if (!stakeholders || !stakeholders.length) return "";
  const cards = stakeholders.map(s => {
    const impCls = s.impact === "受益" ? "imp-good" : s.impact === "受损" ? "imp-bad" : "imp-warn";
    const pillCls = s.impact === "受益" ? "pill-good" : s.impact === "受损" ? "pill-bad" : "pill-warn";
    return `<div class="stk-card ${impCls}" data-imp="${esc(s.impact)}" data-layer="${esc(s.layer)}">
      <div class="stk-top">
        <div class="stk-name">${esc(s.actor)}</div>
        <span class="pill ${pillCls}">${esc(s.impact)}</span>
      </div>
      <div style="margin-bottom:6px;">
        <span class="pill">${esc(s.layer)}</span>
        <span class="pill pill-muted">${esc(s.evidence_tag || "激励推演·待核")}</span>
      </div>
      ${s.one_liner ? `<div class="stk-one">${esc(s.one_liner)}</div>` : ""}
      <div class="stk-row"><b>想要什么：</b>${esc(s.incentive)}</div>
      <div class="stk-row"><b>手里筹码：</b>${esc(s.leverage)}</div>
      <div class="stk-row"><b>卡在哪：</b>${esc(s.constraint)}</div>
    </div>`;
  }).join("");

  return `
    <div class="sec-h">
      <span>二、牌桌上的各方：谁受益、谁承压、谁进退两难</span>
      <span style="font-size:12px;font-weight:500;color:var(--muted);">共 ${stakeholders.length} 方 · 可按损益或维度筛选</span>
    </div>
    <div class="filter-bar" id="fbar-${artIdx}">
      <button class="fchip on" data-kind="all">全部 (${stakeholders.length})</button>
      <button class="fchip" data-kind="imp" data-val="受益">受益</button>
      <button class="fchip" data-kind="imp" data-val="受损">受损</button>
      <button class="fchip" data-kind="imp" data-val="分化/待核">分化/进退两难</button>
      <button class="fchip" data-kind="layer" data-val="产业链纵深">产业链</button>
      <button class="fchip" data-kind="layer" data-val="国内企业与部门">国内企业与部门</button>
      <button class="fchip" data-kind="layer" data-val="政治内部派系">政治派系</button>
      <button class="fchip" data-kind="layer" data-val="资本与金融派系">资本阵营</button>
    </div>
    <div class="stk-grid" id="sgrid-${artIdx}">${cards}</div>
  `;
}

function renderAchHtml(ach) {
  if (!ach || (!ach.hypotheses.length && !ach.evidences.length)) return "";
  const cellPill = c => {
    if (c.startsWith("支持")) return `<span class="pill pill-good">${esc(c)}</span>`;
    if (c.startsWith("反对")) return `<span class="pill pill-bad">${esc(c)}</span>`;
    if (c.startsWith("证据冲突")) return `<span class="pill pill-bad">${esc(c)}</span>`;
    if (c.startsWith("数据缺失")) return `<span class="pill pill-warn">${esc(c)}</span>`;
    return `<span style="color:var(--muted);font-size:12px;">${esc(c)}</span>`;
  };
  const sumRow = ach.summary_row
    ? `<tr style="background:var(--surface-warm);font-weight:700;"><td>诊断汇总</td><td>反证优先</td><td>${esc(ach.summary_row.label)}</td>${ach.summary_row.cells.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`
    : "";
  const kbPills = (ach.kb_notes || []).map(n => {
    const m = n.match(/(KB-[A-Z0-9-]+)/);
    const btn = m ? `<button class="kb-pill" onclick="window._openKb('${esc(m[1])}')">查看 ${esc(m[1])}</button>` : "";
    return `<div style="margin:6px 0;font-size:13.5px;color:var(--text-soft);">${esc(n)} ${btn}</div>`;
  }).join("");

  return `
    <section class="article" id="sec-ach">
      <div class="art-kicker">竞争性假设核查 · 不按支持数投票，看哪种解释被反证最少</div>
      <h2 class="art-title">本周核心分歧与 ACH 五态判别矩阵</h2>
      <div class="sec-h">一、摆在桌面上的几种解释</div>
      <div class="table-wrap"><table>
        <thead><tr><th>编号</th><th>视角</th><th>核心主张</th><th>怎么验证谁对谁错</th></tr></thead>
        <tbody>${ach.hypotheses.map(h => `<tr><td><span class="pill">${esc(h.hid)}</span></td><td><strong>${esc(h.label)}</strong></td><td>${esc(h.desc)}</td><td style="color:var(--muted);">${esc(h.test)}</td></tr>`).join("")}</tbody>
      </table></div>
      <div class="sec-h">二、本周独立事实逐条核对</div>
      <div class="table-wrap"><table>
        <thead><tr><th>证据</th><th>来源</th><th>事实摘要</th>${ach.matrix_headers.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead>
        <tbody>
          ${ach.evidences.map(e => `<tr><td><span class="pill">${esc(e.eid)}</span></td><td style="color:var(--muted);font-size:12px;">${esc(e.source)}</td><td><strong>${esc(e.summary)}</strong></td>${e.cells.map(c => `<td>${cellPill(c)}</td>`).join("")}</tr>`).join("")}
          ${sumRow}
        </tbody>
      </table></div>
      ${kbPills ? `<div class="sec-h">三、涉及的基础原理与反方提醒（点击可看全文）</div><div>${kbPills}</div>` : ""}
    </section>
  `;
}

function renderIssue(issue) {
  renderAudioBar(issue);
  const stories = issue.stories || [];
  const tracks = (issue.audio && issue.audio.tracks) || [];

  // TOC
  document.getElementById("toc-nav").innerHTML = `
    <div class="toc-title">本期导览 · ${esc(issue.week)}</div>
    <a href="#sec-hero">30 秒速览本周</a>
    ${stories.map((st, i) => `<a href="#story-${i+1}">${i+1}. ${esc(st.title)}</a>`).join("")}
    <a href="#sec-ach">ACH 分歧核查矩阵</a>
  `;

  const heroHtml = `
    <section class="hero" id="sec-hero">
      <div class="hero-kicker">新闻周刊 · ${esc(issue.week)}（${esc(issue.range || "")}） · 数据严格截止 ${esc(issue.cutoff_day || "—")}（收盘 ${esc(issue.max_obs_date || "—")}）</div>
      <h1>本周看懂这 ${stories.length} 件事</h1>
      ${issue.one_liner ? `<div class="hero-oneliner">${esc(issue.one_liner)}</div>` : ""}
      ${issue.briefing ? `<details style="margin:8px 0 12px;"><summary style="cursor:pointer;font-size:13px;color:var(--muted);font-weight:600;">展开本周专业盘面与偏离速览（含市场代码）</summary><p style="margin:8px 0 0;color:var(--text-soft);font-size:13.5px;background:var(--surface-alt);padding:10px 14px;border-radius:10px;">${esc(issue.briefing)}</p></details>` : ""}
      <div class="quick-grid">
        ${stories.map((st, i) => `
          <div class="quick-card" onclick="document.getElementById('story-${i+1}').scrollIntoView({behavior:'smooth'})">
            <div class="q-num">专题 0${i+1} · ${esc(st.chain_name || "")}</div>
            <div class="q-title">${esc(st.title)}</div>
            <div class="q-sub">${esc((st.plain_lead || st.subtitle || "").slice(0, 68))}</div>
          </div>
        `).join("")}
      </div>
    </section>
  `;

  const storiesHtml = stories.map((st, i) => {
    const label = String(i + 1).padStart(2, "0");
    const trIdx = tracks.findIndex(t => t.orderLabel === label);
    const playBtn = trIdx >= 0 ? `<button class="ctrl-btn" onclick="window._playTrack(${trIdx})">▶ 听本篇语音</button>` : "";
    const factsHtml = (st.facts_timeline || []).length
      ? `<div class="sec-h">一、本周发生了什么</div><ul class="timeline">${st.facts_timeline.map(f => `<li>${esc(f)}</li>`).join("")}</ul>`
      : "";
    const stkHtml = renderStakeholdersHtml(i, st.stakeholders || []);
    const insList = st.insights || [];
    const insHtml = insList.length ? `
      <div class="sec-h">三、往深里想两层（含对普通人与实体经济的影响）</div>
      <div class="ins-list">
        ${insList.map(item => `
          <div class="ins-card">
            <h4>${esc(item.heading)}</h4>
            ${item.takeaway ? `<div class="ins-takeaway">${esc(item.takeaway)}</div>` : ""}
            <p class="ins-body">${esc(item.body)}</p>
            ${(item.refs || []).length ? `<div style="margin-top:6px;">${item.refs.map(r => `<button class="kb-pill" onclick="window._openKb('${esc(r)}')">原理参考 · ${esc(r)}</button>`).join("")}</div>` : ""}
          </div>
        `).join("")}
      </div>
    ` : "";

    const ce = st.counter_evidence;
    const ceHtml = (ce && typeof ce === "object" && (ce.misreading || ce.rebuttal)) ? `
      <div class="sec-h">四、别被带节奏：最容易误读的一件事</div>
      <div class="ce-grid">
        <div class="ce-box ce-mis"><div style="font-size:12px;font-weight:700;color:var(--bad);margin-bottom:4px;">常见误读</div>${esc(ce.misreading)}</div>
        <div class="ce-box ce-reb"><div style="font-size:12px;font-weight:700;color:var(--good);margin-bottom:4px;">事实怎么说</div>${esc(ce.rebuttal)}</div>
      </div>
      ${ce.flip_condition ? `<div class="ce-flip"><strong>什么情况算我们看错：</strong>${esc(ce.flip_condition)}</div>` : ""}
    ` : "";

    const ws = st.watch_signals || [];
    const wsHtml = ws.length ? `
      <div class="sec-h">五、未来 2–4 周盯紧这几个风向标</div>
      <div class="watch-grid">
        ${ws.map(w => `
          <div class="watch-card">
            <div style="display:flex;justify-content:space-between;gap:6px;margin-bottom:4px;">
              <strong>${esc(w.object)}</strong>
              <span class="pill pill-muted">${esc(w.deadline || "—")}</span>
            </div>
            <div style="color:var(--accent);font-weight:600;margin-bottom:4px;">${esc(w.metric)} · 触发线：${esc(w.threshold)}</div>
            <div style="color:var(--text-soft);">${esc(w.verdict)}</div>
          </div>
        `).join("")}
      </div>
    ` : "";

    return `
      <article class="article" id="story-${i+1}">
        <div class="art-head">
          <div>
            <div class="art-kicker">专题 0${i+1} · ${esc(st.chain_name || "")} · 跨日线索 ${st.source_count || 0} 条</div>
            <h2 class="art-title">${esc(st.title)}</h2>
          </div>
          ${playBtn}
        </div>
        ${(st.plain_lead || st.subtitle) ? `<div class="lead-box"><div class="lead-tag">三秒看懂</div><div>${esc(st.plain_lead || st.subtitle)}</div></div>` : ""}
        ${factsHtml}
        ${stkHtml}
        ${insHtml}
        ${ceHtml}
        ${wsHtml}
      </article>
    `;
  }).join("");

  document.getElementById("main-content").innerHTML = heroHtml + storiesHtml + renderAchHtml(issue.ach);

  // Bind stakeholder filter chips
  stories.forEach((_, idx) => {
    const fbar = document.getElementById(`fbar-${idx}`);
    const sgrid = document.getElementById(`sgrid-${idx}`);
    if (!fbar || !sgrid) return;
    fbar.querySelectorAll(".fchip").forEach(btn => {
      btn.addEventListener("click", () => {
        fbar.querySelectorAll(".fchip").forEach(b => b.classList.remove("on"));
        btn.classList.add("on");
        const kind = btn.dataset.kind, val = btn.dataset.val;
        sgrid.querySelectorAll(".stk-card").forEach(c => {
          const show = kind === "all" || (kind === "imp" && c.dataset.imp === val) || (kind === "layer" && c.dataset.layer === val);
          c.style.display = show ? "" : "none";
        });
      });
    });
  });
}

(function boot() {
  initTheme();
  document.getElementById("kb-backdrop").addEventListener("click", closeKbDrawer);
  document.getElementById("kb-close").addEventListener("click", closeKbDrawer);

  document.querySelectorAll(".audio-bar [data-rate]").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".audio-bar [data-rate]").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentRate = Number(btn.dataset.rate) || 1.0;
      const p = document.getElementById("wk-player");
      if (p) p.playbackRate = currentRate;
    });
  });
  const player = document.getElementById("wk-player");
  player.addEventListener("ended", () => {
    const active = document.querySelector("#audio-tracks .track-pill.playing");
    if (!active) return;
    const all = [...document.querySelectorAll("#audio-tracks .track-pill")];
    const idx = all.indexOf(active);
    if (idx >= 0 && idx + 1 < currentTracks.length) playTrack(idx + 1);
  });

  const issues = DATA.issues || [];
  const sel = document.getElementById("issue-select");
  issues.forEach((is, idx) => sel.add(new Option(`${is.week}（${is.range || ""}）`, String(idx))));
  sel.addEventListener("change", () => renderIssue(issues[Number(sel.value)]));
  if (issues.length) renderIssue(issues[0]);
  else document.getElementById("main-content").innerHTML = '<div class="hero"><h1>暂无已生成的周报</h1></div>';
})();
</script>
</body>
</html>
