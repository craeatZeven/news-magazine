<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>深度周刊 · 经济与时政</title>
<style>
  :root {
    --chrome: #2F343A;
    --chrome-line: #23272C;
    --chrome-ink: #F2EFE8;
    --chrome-ink-soft: #C5C0B6;
    --paper: #F7F4EE;
    --paper-deep: #EFEAE0;
    --paper-elev: #FCFBF8;
    --ink: #1F1D1A;
    --ink-soft: #433E37;
    --ink-faint: #6F685E;
    --rule: #DDD6C9;
    --accent: #9E3B2B;
    --accent-ink: #FCFBF8;
    --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --fs-h1: clamp(32px, 5vw, 68px);
    --fs-h2: 28px;
    --fs-h3: 21px;
    --fs-body: 17px;
    --fs-meta: 13px;
  }
  html[data-theme="dark"] {
    --chrome: #16191D;
    --chrome-line: #262B33;
    --chrome-ink: #F0ECE4;
    --chrome-ink-soft: #A7A298;
    --paper: #191C20;
    --paper-deep: #21252B;
    --paper-elev: #1E2228;
    --ink: #EBE6DD;
    --ink-soft: #C8C2B7;
    --ink-faint: #989186;
    --rule: #303640;
    --accent: #D97757;
    --accent-ink: #16191D;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  button, select { font-family: inherit; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: var(--fs-body);
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }

  /* 阅读进度条（杂志 SOP M6） */
  .reading-progress {
    position: fixed; top: 0; left: 0; height: 3px; width: 0%;
    background: var(--accent); z-index: 100;
  }

  /* chrome 层：深暖灰顶栏（仅保留 日报 / 周报） */
  .layer-chrome {
    position: sticky; top: 0; z-index: 50;
    background: var(--chrome);
    border-bottom: 1px solid var(--chrome-line);
    color: var(--chrome-ink);
  }
  .chrome-inner {
    max-width: 920px; margin: 0 auto; padding: 10px 24px;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
  }
  .brand {
    display: inline-flex; align-items: center; min-height: 44px;
    font-family: var(--serif); font-size: var(--fs-h3); font-weight: 700;
    letter-spacing: 0.04em; color: var(--chrome-ink); text-decoration: none;
  }
  .nav-group { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; }
  .nav-link {
    display: inline-flex; align-items: center; min-height: 44px; padding: 0 4px;
    font-size: var(--fs-meta); font-weight: 600; letter-spacing: 0.04em;
    color: var(--chrome-ink-soft); text-decoration: none;
    border-bottom: 2px solid transparent;
  }
  .nav-link:hover { color: var(--chrome-ink); }
  .nav-link.active { color: var(--chrome-ink); border-bottom-color: var(--accent); }
  .chrome-ctrl {
    display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px; max-width: 100%;
  }
  .issue-sel, .theme-btn {
    min-height: 44px; padding: 0 10px; max-width: 100%; min-width: 0;
    background: var(--chrome-line); color: var(--chrome-ink);
    border: 1px solid var(--chrome-line); border-radius: 2px;
    font-family: var(--mono); font-size: var(--fs-meta); cursor: pointer;
  }
  .issue-sel { max-width: min(240px, 72vw); }
  .theme-btn { min-width: 44px; }
  .theme-btn:hover, .issue-sel:focus { border-color: var(--chrome-ink-soft); outline: none; }

  /* 精简播客条（无彩色胶囊，纯 hairline 档案语汇） */
  .audio-strip {
    background: var(--paper-deep);
    border-bottom: 1px solid var(--rule);
  }
  .audio-inner {
    max-width: 680px; margin: 0 auto; padding: 12px 20px;
  }
  .audio-row {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
  }
  .audio-label {
    font-family: var(--mono); font-size: var(--fs-meta); color: var(--ink-soft); min-width: 0;
  }
  .audio-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; max-width: 100%; }
  .audio-el { height: 36px; width: min(260px, 100%); max-width: 100%; }
  .rate-btn {
    min-height: 44px; min-width: 44px; padding: 0 8px;
    background: transparent; color: var(--ink-faint);
    border: 0; border-bottom: 2px solid transparent;
    font-family: var(--mono); font-size: var(--fs-meta); cursor: pointer;
  }
  .rate-btn.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 700; }
  .track-list {
    display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px;
    padding-top: 8px; border-top: 1px solid var(--rule);
  }
  .track-link {
    min-height: 44px; padding: 4px 0;
    background: transparent; border: 0; border-bottom: 2px solid transparent;
    color: var(--ink-soft); font-size: var(--fs-meta); text-align: left; cursor: pointer;
  }
  .track-link:hover { color: var(--ink); }
  .track-link.playing { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }

  /* 阅读主轴：编辑式单栏纵线（styles/reading.md R1: 640-700px） */
  main.layer-reading {
    max-width: 680px;
    margin: 0 auto;
    padding: 40px 20px 88px;
    overflow-wrap: break-word;
  }

  /* 刊头（h1 44px vs 正文 17px = 2.59×） */
  .issue-header {
    padding-bottom: 28px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 36px;
  }
  .issue-kicker {
    font-family: var(--mono); font-size: var(--fs-meta);
    letter-spacing: 0.04em; color: var(--ink-faint); margin: 0 0 10px;
  }
  .issue-header h1 {
    font-family: var(--serif); font-size: var(--fs-h1);
    line-height: 1.2; font-weight: 700; letter-spacing: -0.015em;
    margin: 0 0 18px; color: var(--ink);
  }
  /* 引文块行高配平（styles/reading.md R5 & magazine-polish-archive.css） */
  .layer-reading blockquote {
    border-left: 3px solid var(--accent);
    margin: 1.4em 0;
    padding: 3px 36px 0 24px;
    font-size: 0.94em;
    line-height: calc((1.75 - 0.05) / 0.94);
    color: var(--ink-soft);
  }

  /* 目录：档案层目录行（0 圆角 0 阴影，hairline 分隔） */
  .layer-archive .toc-row {
    display: grid; grid-template-columns: 36px minmax(0, 1fr);
    gap: 6px 12px; padding: 12px 0;
    border-bottom: 1px solid var(--rule);
    text-decoration: none; color: var(--ink);
  }
  .layer-archive .toc-row:hover { background: var(--paper-deep); }
  .toc-idx {
    font-family: var(--mono); font-size: var(--fs-meta); color: var(--accent);
    padding-top: 3px;
  }
  .toc-title { font-family: var(--serif); font-size: var(--fs-body); font-weight: 700; line-height: 1.45; }
  .toc-sub { font-size: var(--fs-meta); color: var(--ink-faint); margin-top: 2px; line-height: 1.5; }

  /* 专题文章本体（零圆角零阴影，纯排版层级） */
  .essay-article {
    padding: 40px 0 44px;
    border-bottom: 1px solid var(--rule);
    scroll-margin-top: 72px;
  }
  .essay-meta-row {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
    margin-bottom: 10px;
  }
  .essay-kicker {
    font-family: var(--mono); font-size: var(--fs-meta); color: var(--ink-faint);
  }
  .listen-inline {
    min-height: 44px; padding: 0 2px;
    background: transparent; border: 0; border-bottom: 1px solid var(--accent);
    color: var(--accent); font-size: var(--fs-meta); font-weight: 600; cursor: pointer;
  }
  .essay-article h2 {
    position: relative; padding-left: 16px;
    font-family: var(--serif); font-size: var(--fs-h2);
    line-height: 1.32; font-weight: 700; margin: 0 0 18px; color: var(--ink);
  }
  .essay-article h2::before {
    content: ""; position: absolute; left: 0; top: 6px; bottom: 6px;
    width: 4px; background: var(--accent);
  }
  .essay-article h3 {
    font-family: var(--serif); font-size: var(--fs-h3);
    line-height: 1.38; font-weight: 700; margin: 2em 0 0.7em; color: var(--ink);
  }
  .essay-article p {
    margin: 0 0 1.35em;
    color: var(--ink-soft);
  }

  /* 文末原生 <details>：档案层目录行，零卡片嵌套 */
  .audit-details {
    margin-top: 28px;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    padding: 4px 0;
  }
  .audit-details > summary {
    min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    cursor: pointer; list-style: none;
    font-size: var(--fs-meta); font-weight: 600; color: var(--ink-faint);
  }
  .audit-details > summary > span:last-child { white-space: nowrap; flex-shrink: 0; }
  .audit-details > summary:hover { color: var(--ink); }
  .audit-body { padding: 8px 0 16px; }
  .audit-sub {
    font-family: var(--mono); font-size: var(--fs-meta); color: var(--ink-faint);
    margin: 14px 0 6px; letter-spacing: 0.03em;
  }
  .arch-item {
    padding: 10px 0; border-bottom: 1px solid var(--rule);
    font-size: var(--fs-meta); line-height: 1.65;
  }
  .arch-item:last-child { border-bottom: 0; }
  .arch-actor { font-weight: 700; color: var(--ink); }
  .arch-impact {
    font-family: var(--mono); font-size: var(--fs-meta);
    color: var(--accent); margin-left: 8px;
  }
  .arch-desc { color: var(--ink-soft); margin-top: 2px; }

  .site-footer {
    max-width: 680px; margin: 0 auto; padding: 24px 20px 48px;
    font-family: var(--mono); font-size: var(--fs-meta); color: var(--ink-faint);
    display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px;
  }
  .site-footer a { color: var(--ink-soft); text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }

  /* 返回顶部（杂志 SOP M7） */
  .back-top {
    position: fixed; right: 20px; bottom: 20px; z-index: 80;
    width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid var(--accent); background: var(--paper-elev); color: var(--accent);
    font-size: var(--fs-body); cursor: pointer;
    display: grid; place-items: center;
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
  }
  .back-top.show { opacity: 1; pointer-events: auto; }

  @media (max-width: 640px) {
    :root { --fs-h1: 30px; --fs-h2: 22px; --fs-h3: 18px; --fs-body: 16.5px; }
    .chrome-inner {
      padding: 4px max(12px, env(safe-area-inset-left)) 4px max(12px, env(safe-area-inset-right));
      gap: 6px 10px;
    }
    .brand { font-size: var(--fs-body); }
    .nav-group { gap: 12px; }
    .chrome-ctrl { width: 100%; flex-wrap: nowrap; justify-content: space-between; }
    .issue-sel { flex: 1; max-width: none; height: 44px; padding: 0 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .audio-inner { padding: 8px 14px; }
    .audio-controls { width: 100%; justify-content: space-between; }
    .audio-el { width: 100%; }
    .track-list {
      flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch;
      scrollbar-width: none; gap: 14px; padding-bottom: 2px;
    }
    .track-list::-webkit-scrollbar { display: none; }
    .track-link { flex: 0 0 auto; white-space: nowrap; }
    main.layer-reading {
      padding: 22px max(16px, env(safe-area-inset-left)) 36px max(16px, env(safe-area-inset-right));
    }
    .site-footer { padding: 20px 16px calc(76px + env(safe-area-inset-bottom)); }
    .issue-header { padding-bottom: 20px; margin-bottom: 24px; }
    .essay-article { padding: 28px 0 32px; }
    .layer-reading blockquote { padding: 3px 12px 0 16px; margin: 1.1em 0; }
    .back-top { right: 14px; bottom: calc(16px + env(safe-area-inset-bottom)); }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
  @media print {
    .layer-chrome, .audio-strip, .back-top, .reading-progress, .listen-inline { display: none !important; }
    .layer-reading blockquote, .layer-reading table { break-inside: avoid; page-break-inside: avoid; }
    .layer-reading h2, .layer-reading h3 { break-after: avoid; page-break-after: avoid; }
  }
</style>
</head>

<script>
const DATA = {"generated_at":"2026-11-22 11:37","issues":[{"week":"2026-W47","range":"2026-11-16..2026-11-22","cutoff_day":"2026-11-22","one_liner":"标普单日跌3.70%、VIX飙26.20%至35.89而10Y降至4.912%，是流动性挤兑式去杠杆而非通胀再加速。","stories":[{"chain_name":"大国经贸、关税与长臂制裁双轨博弈链条","title":"握手归握手，制裁归制裁：普通人要算的三笔账","article":{"title":"握手归握手，制裁归制裁：普通人要算的三笔账","lead":"这周中美俄元首在深圳首次面对面会晤，场面热闹。但同一天，美国财政部照发涉俄制裁通用许可，市场用大跌回应。对普通人来说，峰会排场离生活很远，可油价、订单和养老金账户的波动却很近。","sections":[{"heading":"峰会握手了，但制裁的机器没停","paragraphs":["这周最热闹的新闻，是中美俄元首在深圳首次面对面会晤。外交部称其具有开创性意义，特朗普还给峰会打了12分。但同一天，美国财政部外国资产控制办公室发布了针对俄罗斯的两项通用许可，继续给特定交易开口子。这说明元首握手和制裁发单是两条并行的轨道，排场不等于协议。","市场的反应很直接。标普500指数五个交易日累计下跌8.61%，恐慌指数单日跳涨26.20%。科技股跌得比周期股狠，纳斯达克单日跌5.28%，道指只跌1.93%。投资者担心的不是协议快来了，而是不确定性根本没消除。","通用许可的文本没有披露逐条授权清单，受影响交易笔数也没公布。企业拿不到明确边界，只能按最严口径准备合规。跨国贸易商和国内出口企业最怕这种模糊，因为每张许可证背后都是真金白银的合规成本和绕道成本。"]},{"heading":"为什么更实质的东西没谈成","paragraphs":["峰会谈成了什么？从公开信息看，主要是恢复了面对面沟通渠道，各方表达了继续谈的意愿。但限核协议、对俄制裁放松、关税下调这些实质议题，都没有落地。特朗普自己说限核协议虽难仍会推进，等于承认这次没谈成。","没谈成的根子在于，美国内部不是铁板一块。白宫行政层想用峰会排场换短期交易筹码，但国会两党和财政部、商务部的制裁官僚按自己的节奏走。峰会前后，财政部照发通用许可，商务部实体清单也没松。欧盟那边，冯德莱恩还在提新一轮对俄制裁和援乌方案。","所以握手只是拍照，制裁和关税的官僚轨道照旧。企业拿不到逐条许可清单，银行仍按最严口径放款，中小企业的订单和结算约束一点没松。把峰会当利好，是这周最容易犯的误读。"]},{"heading":"油价、债市和黄金各说各话","paragraphs":["原油市场这周信号有点矛盾。布伦特原油收89.87美元，单日跌2.29%；WTI反而微涨0.49%，两者价差拉大。这说明市场对俄油供应中断的担忧在降温，而不是加剧。对普通人来说，油价短期没继续冲高是好事，能源账单压力暂时缓了一口气。","但债市和黄金在讲另一个故事。10年期美债收益率降到4.912%，单日下行14个基点，债价上涨，这是避险资金在买国债。黄金单日跌3.98%，连避险资产也被抛，说明投资者在换现金。股债同周大跌，理财和养老金账户的净值还会晃。","这种各说各话的盘面，本质是市场在交易需求弱，而不是供应断。欧洲工厂成本、国内出口订单、全球贸易融资，都在这条链条上被重新定价。普通人感受到的，是进口商品价格、理财收益和就业机会的波动。"]},{"heading":"落到普通人身上，接下来盯什么实事","paragraphs":["第一笔账是能源账单。欧盟喊新一轮对俄制裁，若柴油和天然气再紧，欧洲工厂成本会传导到进口商品价格。第二笔是就业和订单。国内制造业PMI十月49.3，低于50的荣枯线，出口企业面对制裁合规和结算约束，中小企业订单最容易被银行宁可错杀卡住。","第三笔是养老金和储蓄。股债同周大跌，理财净值缩水，而各国央行在增持黄金、调整外储币种，说明机构也在防风险。中国官方外储3.4万亿美元，黄金储备超3000亿美元，这种多元化本身就是对制裁风险的回应。","接下来一两个月，盯三件实事：美国财政部通用许可到期前是否续期并扩大授权范围；布伦特与WTI价差是否继续拉大；国内制造业PMI能否回到50以上。这三件事分别对应能源成本、订单压力和就业前景。别把峰会排场当利好，盯住油价和订单的实际变化，才是普通人能做的。"]}]},"stakeholders":[{"actor":"美国财政部OFAC","layer":"政治内部派系","impact":"分化/待核","one_liner":"峰会握手的同时，制裁机器照常发许可证","constraint":"高层缓和口风与官僚惯性并存，不敢松太多"},{"actor":"白宫行政层（特朗普团队）","layer":"政治内部派系","impact":"分化/待核","one_liner":"想用峰会排场换短期交易筹码","constraint":"国会两党和制裁官僚不配合，协议难落地"},{"actor":"欧盟理事会与冯德莱恩团队","layer":"政治内部派系","impact":"受损","one_liner":"一边喊新一轮对俄制裁，一边怕能源成本再涨","constraint":"内部成员国能源账单压力大，团结难维持"},{"actor":"跨国制造与大宗商品贸易商","layer":"产业链纵深","impact":"受损","one_liner":"每张许可证背后都是合规成本和绕道成本","constraint":"许可逐条清单未披露，不敢押注"},{"actor":"东盟与墨西哥转口组装枢纽","layer":"产业链纵深","impact":"分化/待核","one_liner":"承接绕道红利，但面临原产地穿透审查","constraint":"一旦被穿透审查，红利变罚单"},{"actor":"国内出口制造与跨境电商企业","layer":"国内企业与部门","impact":"受损","one_liner":"直面关税、实体清单和跨境结算约束","constraint":"制裁合规口径趋严，银行不敢放款"},{"actor":"全球美元清算银行与贸易融资机构","layer":"资本与金融派系","impact":"分化/待核","one_liner":"按最严口径预留保证金，放大制裁摩擦","constraint":"宁可错杀不敢漏放，中小企业最先被卡"},{"actor":"各国央行与主权储备管理机构","layer":"资本与金融派系","impact":"分化/待核","one_liner":"地缘制裁风险推动外储多元化和购金","constraint":"美元资产仍占大头，转身慢"}],"watch_signals":[{"object":"美国财政部OFAC通用许可55F与115D","metric":"是否续期或扩大授权范围","threshold":"到期前发布续期公告且明确覆盖更多交易","deadline":"2026-12-31","verdict":"续期且扩围说明制裁实际放松；不续或缩水说明官僚轨道照旧，企业还得按最严口径准备。"},{"object":"布伦特原油与WTI价差","metric":"价差是否继续拉大","threshold":"价差超过8美元/桶","deadline":"2026-12-15","verdict":"价差拉大说明市场担心俄油供应中断，能源账单压力上升；价差收窄说明供应担忧降温。"},{"object":"中国制造业PMI","metric":"能否回到50以上","threshold":"2026年11月PMI高于50","deadline":"2026-12-01","verdict":"回到50以上说明出口企业订单和合规压力缓解；继续低于50说明中小企业还在承压。"}]},{"chain_name":"全球能源供应与海运咽喉全链条","title":"霍尔木兹连环触雷：油价运费怎么走","article":{"title":"霍尔木兹连环触雷：油价运费怎么走","lead":"这周霍尔木兹海峡接连有油轮触雷爆炸，美军又空袭了伊朗岛屿，油价和航运保费跟着晃。普通人要盯的不是新闻标题，而是加油站的油价、快递和机票的成本，还有手里能源、航运相关的基金和养老金。","sections":[{"heading":"海峡炸船，油价涨了但炒家却在撤","paragraphs":["这周霍尔木兹海峡不太平。伊朗说两艘油轮在霍尔木兹海峡触雷爆炸，其中一艘装着超过200万桶原油，另有一艘超级油轮在波斯湾沉没。美军以回应驻巴林基地遇袭为由，空袭了海峡附近的伊朗岛屿和导弹设施，同一天又有一艘油轮碰水雷。消息一出，布伦特原油收在92.57美元一桶，美国原油收在83.98美元，都比上周往上走了走。","但有意思的是，炒油的人反而在撤。美国商品期货交易委员会的数据显示，当周投机者手里的美国原油净多头仓位减少了近一万手，降到六万手出头，是十个月最低。翻译成大白话：一边看着新闻喊紧张，一边在悄悄减仓。原因是他们更怕股市和债市那边的去杠杆把油价一起拖下水，这周美股跌得不轻，恐慌指数一天跳了两成多。所以油价的地缘溢价有，但没到失控的地步。","更关键的是，双方都在留谈判口子。伊朗说海峡两日方案还在考虑，若美方提出有条件方案愿意谈；特朗普称将与伊朗达成永久性协议。但同一天，伊朗革命卫队打击了巴林美军基地，说明强硬派还在用摩擦当筹码。谈成了什么？目前只是双方都表达了愿意谈的姿态，没有停火协议，也没有解除制裁的时间表。为什么更实质的东西没谈成？因为革命卫队要在安全事务上说了算，而美国国会鹰派要求更硬，两边内部都有人不想现在收手。"]},{"heading":"真正卡脖子的不是油，是保险和船","paragraphs":["霍尔木兹海峡不是普通水道，全球海运石油有大约29%要从这里过，中国进口的油有相当一部分也走这条线。但油轮触雷之后，最先反应的不是油价，是保险。伦敦劳合社那边的战争险承保辛迪加会重新报价，保费一跳，船东就得算账：绕行好望角多烧几天油、多付船员薪水，和硬着头皮过海峡比，哪个划算。保费涨到某个阈值，船就不走了，运价跟着涨，炼厂到厂成本再抬一层。","所以普通人看到的是加油站价格，背后其实是保险精算师在定价。国内油运企业像中远海能、招商轮船，运价和战争险保费一起涨，短期收入弹性大，但船和船员的安全风险也实打实。炼厂和化工、航空物流企业则两头受挤：原油到厂价和运费一起抬，下游需求偏弱，涨价转不出去，毛利被压薄。","还有一个容易被忽略的变量是黑海。普京表示克里米亚大桥遭袭后，不再讨论海上停火，黑海方向的运粮和运油风险同步上升。两条咽喉同时出问题，船东的绕行选择更少，保费更难降下来。"]},{"heading":"别把地缘新闻直接当买入信号","paragraphs":["很多人一看海峡炸船就喊“油要断供、油价要飞天”，把地缘新闻直接当成买入信号。本周的硬事实不支持这个说法。第一，油价虽然涨了，但投机净多头仓位反而降到十个月新低，说明专业资金在撤不是在追。第二，伊朗自己说海峡方案还在考虑，愿意谈，特朗普也说将达成永久性协议，双方都在留谈判口子。","第三，美国能源价格环比涨幅只有0.7%左右，远低于机械基准，说明油价向物价的传导目前还温和。第四，中国制造业景气度还在荣枯线下方，需求端不强，油价往上冲缺乏实体支撑。所以更准确的判断是：地缘溢价有，但断供恐慌被夸大了。","当然，如果海峡连续多日没有油轮通过、战争险保费跳到船东普遍停航的水平，或者伊朗革命卫队直接宣布封锁海峡，那说明断供风险真的来了，我们判断偏乐观。"]},{"heading":"落到普通人身上：油价、运费和养老金","paragraphs":["对普通家庭来说，最直接的感受是加油和物流。国内成品油调价跟着国际油价走，布伦特在90美元上下晃，下一轮调价窗口大概率是往上调，但幅度会被战略储备投放和调价机制平滑掉一部分。再往深一层，化工品、塑料、化肥和航空煤油都跟着原油走，快递和机票成本会慢慢抬。","就业方面，油运企业运价高的时候招人扩船，炼厂和化工企业毛利被压的时候可能减产控本。如果你手里有能源、航运相关的基金或者养老金组合，这周这类资产波动明显放大，恐慌指数一天涨了两成多，说明市场在重新定价风险。中小企业里，跑运输的、做外贸的，运费和保费上涨会直接吃掉利润。","接下来一两个月，盯几件实事就够了。一是霍尔木兹海峡每日通过的油轮艘数，连续三天低于正常水平的一半，说明船东真不敢走了。二是布伦特原油收盘价是否连续两天站稳95美元，站稳了国内调价压力更大。三是美国原油投机净多头仓位是否回升到8万手以上，回升说明专业资金重新看多。四是伦敦战争险保费报价是否比月初翻倍，翻倍说明承保方认为风险实质性上升。这些信号比新闻标题实在。"]}]},"stakeholders":[{"actor":"伊朗革命卫队","layer":"政治内部派系","impact":"分化/待核","one_liner":"海峡北岸的实际控盘者，既想用摩擦当谈判筹码，又怕把石油出口现金流彻底打没","constraint":"一旦海峡真被封死，伊朗自己的油也运不出去，财政先扛不住"},{"actor":"伊朗务实派政府与石油部","layer":"政治内部派系","impact":"受损","one_liner":"想靠出口石油换外汇稳汇率稳物价，最怕强硬派把海峡事情闹大","constraint":"安全事务上说了不算，革命卫队的动作随时把谈判桌掀翻"},{"actor":"美国行政层（白宫与国务院）","layer":"政治内部派系","impact":"分化/待核","one_liner":"既想压伊朗，又怕油价反弹推高通胀、影响选票和美联储降息节奏","constraint":"国会鹰派要求更硬，海湾盟友要求保护航道，两边都不能得罪"},{"actor":"中远海能、招商轮船等油运企业","layer":"国内企业与部门","impact":"受益","one_liner":"运价和战争险保费一起涨，短期收入弹性大，但船和船员的安全风险也实打实","constraint":"战争险保费跳升会吃掉利润，船员安全和船体受损是硬约束"},{"actor":"国内炼厂与化工、航空物流企业","layer":"产业链纵深","impact":"受损","one_liner":"原油到厂价和运费一起抬，成品油、化工品和机票成本被两头挤","constraint":"下游需求偏弱，涨价转不出去，毛利被压薄"},{"actor":"伦敦劳合社战争险承保辛迪加","layer":"资本与金融派系","impact":"受益","one_liner":"海峡每炸一艘船，战争险保费就往上跳一档，跳到船东觉得不划算就不走了","constraint":"再保险成本也在涨，定低了赔穿，定高了客户绕行"},{"actor":"大宗商品对冲基金与原油做市商","layer":"资本与金融派系","impact":"分化/待核","one_liner":"地缘消息一出就冲进去买，但本周净多头仓位反而降到十个月新低，说明有人在撤","constraint":"仓位已经很低，再追涨怕接最后一棒，不追又怕错过"},{"actor":"国家发改委与战略石油储备部门","layer":"国内企业与部门","impact":"分化/待核","one_liner":"成品油调价跟着国际油价走，储备吞吐是平抑波动的缓冲垫","constraint":"调价太慢炼厂亏，调价太快老百姓疼，两头难"}],"watch_signals":[{"object":"霍尔木兹海峡油轮通行量","metric":"每日通过海峡的油轮艘数","threshold":"连续三天低于正常水平的一半","deadline":"2026-11-28","verdict":"到了这条线说明船东真不敢走了，运费和保费会再跳一档；没到说明市场还在正常消化风险。"},{"object":"布伦特原油期货","metric":"收盘价是否站稳95美元","threshold":"连续两天收在95美元以上","deadline":"2026-11-28","verdict":"站稳说明地缘溢价在扩大，国内下一轮成品油调价压力更大；没站稳说明市场认为冲突可控。"},{"object":"美国原油投机净多头仓位","metric":"CFTC每周公布的净多头手数","threshold":"回升到8万手以上","deadline":"2026-11-28","verdict":"回升说明投机资金重新看多油价；继续在6万手附近说明专业资金还在观望。"},{"object":"伦敦战争险保费报价","metric":"油轮单次通过海峡的战争险费率","threshold":"比月初翻一倍以上","deadline":"2026-11-28","verdict":"翻倍说明承保方认为风险实质性上升，船东绕行会增多；没翻倍说明保险市场还稳得住。"}]},{"chain_name":"AI 算力—模型—云厂—资本—监管全链条","title":"英伟达换帅，算力链的裂缝与账单","article":{"title":"英伟达换帅，算力链的裂缝与账单","lead":"这周英伟达创始人黄仁勋辞职，同一天阿波罗和高盛完成440亿美元GPU抵押融资。一边是芯片龙头人事地震，一边是资本继续加注算力。普通人要关心的是：AI投资会不会放缓，电费、就业和理财收益会受什么影响。","sections":[{"heading":"换帅不改订单，但裂缝已经出现","paragraphs":["黄仁勋辞职的消息出来后，市场第一反应是英伟达还稳不稳。从本周事实看，SpaceX仍要买英伟达芯片，阿波罗和高盛还以GPU作抵押放出440亿美元，说明大客户短期没撤单。但谷歌TPU被专家视为趁乱抢长期买家的窗口，微软也推便宜专用模型降低对单一供应商依赖。英伟达的城墙不是一天塌的，可客户分散风险的动作会加快。","这种裂缝不是来自需求突然消失，而是来自客户心态变化。过去大家没得选，现在谷歌TPU迭代多代，微软自研模型能直接嵌入Office和Azure，苹果也在研发自有AI代理。英伟达仍是AI训练芯片的绝对主力，但“必须买英伟达”正在变成“可以先试试别的”。对国内出海链来说，海外云厂资本开支节奏仍是订单命门，客户分散意味着订单分配更不确定。","真正要盯的不是人事变动本身，而是下一财季数据中心收入环比增速。如果增速掉到5%以下，说明换帅后客户开始分散订单；如果还在10%以上，说明需求仍强，人事影响有限。这个数字比任何表态都实在。"]},{"heading":"GPU变成抵押品，风险藏在水下","paragraphs":["阿波罗和高盛这笔440亿美元融资，本质是把GPU未来租金收入打包成债务卖出去。好处是云厂不用自己掏全款就能扩算力，坏处是GPU折旧快、二手价难估，一旦AI需求增速放缓，抵押品价值下跌会触发连锁减记。本周纳斯达克单日跌超5%、恐慌指数跳升近三成，说明市场对高杠杆算力投资已开始紧张。","这种金融加速器效应，会让算力链的波动比实体需求更剧烈。芯片还是那些芯片，但被抵押、被证券化之后，价格波动会被杠杆放大。云厂扩产时皆大欢喜，一旦租金收入不及预期，减记和违约就会反过来收紧信贷，形成“越跌越不敢投”的循环。这不是说融资本身有问题，而是提醒我们：算力链的风险已经从工厂车间转移到了资产负债表上。","对普通人来说，这条传导链不算远。科技股高波动会传导到养老目标基金和QDII净值，而GPU抵押融资的折价或违约，会先冲击机构投资者，再慢慢渗透到更广泛的理财市场。"]},{"heading":"谈成了融资和上市，没谈成的是回报路径","paragraphs":["本周谈成的事不少：阿波罗和高盛完成440亿美元GPU抵押融资定价，Anthropic向英国及欧洲散户售股11亿美元并获准在纳斯达克上市，特朗普政府还把英伟达、微软、OpenAI等20多家企业列入AI“国家领军企业”名单。资金和订单都在继续，说明短期需求没断。","但更实质的东西没谈成：算力投资的回报路径仍不清晰。Anthropic估值被加密期货押注到1.7万亿美元，可盈利模式还在摸索；微软推便宜专用模型抢客户，但和OpenAI的合作协议存在利益冲突；谷歌TPU想抢长期买家，外部生态却远不如CUDA成熟。大家谈成了“继续加注”，没谈成“怎么收回本钱”。","所以“英伟达创始人一走，AI算力链就要崩了”的说法站不住脚。本周硬事实不支持崩盘论：SpaceX仍要买芯片，440亿美元融资完成定价，Anthropic获准上市，国家领军企业名单也给了政策背书。真正要盯的是资本开支回报能否兑现，以及高杠杆融资在需求放缓时的反噬。"]},{"heading":"普通人的账单：电费、就业和理财先感知","paragraphs":["AI数据中心抢电抢地，天然气近20日涨近42%，电力设备积压订单高企。对普通人来说，数据中心密集地区电价上行压力更直接；国内光模块、液冷、服务器工厂订单跟着海外云厂资本开支走，订单一放缓加班和招聘就先缩。理财端，科技股高波动会传导到养老目标基金和QDII净值。","接下来一两个月，可以盯几件实事：美国天然气期货20日涨跌幅，如果从当前水平回落超20%，说明数据中心抢电压力缓解，电价传导减弱；A股光模块与液冷板块，如果两家以上主要云厂下调资本开支指引，国内出海链订单就要减速，工厂加班和招聘先受影响；谷歌云如果新增3家以上知名企业采用TPU，说明替代真在发生。","若算力投资从抢建转向消化，上游产能过剩风险会在两三个季度后显现，届时相关就业和中小企业订单感受更明显。这不是说AI要凉，而是说任何一轮抢建都有节奏，普通人的账单和招聘启事，往往比股价更早感知冷暖。"]}]},"stakeholders":[{"actor":"英伟达（Nvidia）","layer":"产业链纵深","impact":"分化/待核","one_liner":"AI芯片龙头，创始人辞职后进入过渡期，但订单和融资热度未减。","constraint":"创始人离任带来战略连续性疑问，谷歌TPU等定制芯片正趁机抢单。"},{"actor":"阿波罗全球管理公司与高盛","layer":"资本与金融派系","impact":"受益","one_liner":"华尔街机构用GPU作抵押放出440亿美元，把芯片变成金融资产。","constraint":"GPU折旧快、二手价值难评估，一旦算力需求放缓抵押品缩水。"},{"actor":"微软（Microsoft）","layer":"产业链纵深","impact":"受益","one_liner":"一边是OpenAI最大金主，一边推便宜专用模型抢同一批客户。","constraint":"与OpenAI的合作协议存在利益冲突，自研模型可能得罪盟友。"},{"actor":"Anthropic","layer":"产业链纵深","impact":"受益","one_liner":"本周向欧洲散户卖股11亿美元并获准纳斯达克上市，估值预期高涨。","constraint":"上市定价受市场波动影响，大客户集中且盈利路径仍不清晰。"},{"actor":"谷歌（Google Cloud与TPU团队）","layer":"产业链纵深","impact":"受益","one_liner":"英伟达动荡被专家视为TPU抢长期买家的窗口，定制芯片路线受关注。","constraint":"TPU主要自用和少数客户，外部生态远不如CUDA成熟。"},{"actor":"美国共和党对华技术封锁鹰派（以商务部工业与安全局为代表）","layer":"政治内部派系","impact":"分化/待核","one_liner":"主张收紧芯片出口管制，与亲商放松派在AI政策上拉扯。","constraint":"过度管制伤及英伟达等企业海外收入，与特朗普“国家领军企业”扶持名单存在张力。"},{"actor":"苹果公司","layer":"国内企业与部门","impact":"分化/待核","one_liner":"本周确认研发自有AI代理，不想在AI入口上被OpenAI和Anthropic卡住。","constraint":"AI大模型起步晚，研发投入和人才储备落后于头部模型公司。"},{"actor":"A股海外算力出海链（光模块、AI服务器、液冷与电力设备供应商）","layer":"国内企业与部门","impact":"分化/待核","one_liner":"国内工厂给海外云厂供硬件，英伟达动荡和资本开支节奏直接影响订单。","constraint":"客户集中度高，海外云厂资本开支一旦放缓订单就波动。"}],"watch_signals":[{"object":"英伟达","metric":"下一财季数据中心收入环比增速","threshold":"环比增速低于5%","deadline":"2027-02-28","verdict":"低于5%说明换帅后客户开始分散订单；高于10%说明需求仍强，人事影响有限。"},{"object":"谷歌云","metric":"公开宣布采用TPU的外部大客户数量","threshold":"新增3家以上知名企业","deadline":"2027-03-31","verdict":"新增多说明TPU真在抢英伟达份额；没有新增说明替代还停留在口头上。"},{"object":"美国天然气期货","metric":"20日涨跌幅","threshold":"从当前水平回落超20%","deadline":"2026-12-31","verdict":"回落说明数据中心抢电压力缓解，电价传导减弱；继续上涨则普通人电费压力更大。"},{"object":"A股光模块与液冷板块","metric":"海外云厂资本开支指引下调家数","threshold":"两家以上主要云厂下调","deadline":"2027-01-31","verdict":"下调多说明国内出海链订单要减速，工厂加班和招聘先受影响；没有下调说明订单仍稳。"}]},{"chain_name":"美债期限溢价、财政主导与全球美元流动性链条","title":"加息预期重来：全球资产同跌的传导与普通人账单","article":{"title":"加息预期重来：全球资产同跌的传导与普通人账单","lead":"这周市场突然相信美联储还要连着加息。美股、黄金、铜一起大跌，恐慌指数单日涨超两成。表面看是行情波动，背后是利率预期、杠杆资金和普通家庭账单之间的一条传导链。","sections":[{"heading":"一、数据与纪要互相强化，加息预期为何突然变强","paragraphs":["本周关键变化是经济数据与官方表态互相强化。美国10月零售销售同比增长创四年新高，说明消费需求仍旺；随后公布的美联储10月会议纪要显示，几乎所有官员认为仍需进一步加息。法国巴黎银行随即把预测改为连续三次加息、每次25个基点。市场原本押注加息接近尾声，现在被迫修正。","利率是各类资产定价的锚，锚往上抬，股票、黄金、铜就一起承压。11月21日纳斯达克100指数单日跌5.5%，英伟达跌14%，标普500跌3.7%，道指跌1.93%。黄金当天跌近4%，铜跌近3%，恐慌指数冲上37，创2025年4月以来新高。这不是某一条消息的冲击，而是预期方向变了。","美联储内部并非铁板一块。有官员释放连续加息四次的最鹰派信号，也有“三把手”明确表示当前无需激进举措，加息节奏要看人工智能投资等新变量。10月会议纪要同时提示关注人工智能投资风险。鹰派担心通胀粘住，鸽派担心金融稳定和就业下行，两股力量拉扯，市场只能跟着数据来回定价。"]},{"heading":"二、股金铜同跌：杠杆资金补保证金才是放大器","paragraphs":["平时黄金和铜走势并不同步，这次一起跌，说明不是各自基本面同时出问题，而是杠杆资金在补保证金。对冲基金的基差交易、风险平价基金和期权做市商，都依赖低波动环境加杠杆；波动率一跳升，风控规则就逼它们减仓，卖盘互相踩踏。普通投资者看到的是“避险资产也不避险”，本质是流动性冲击。","美国财政部在这条链上也有角色。两党减税和军费刚性扩张，赤字压不下来，财政部要发大量国债。短债与长债的发行比例直接影响长端利率和期限溢价。长债供给多，期限溢价就容易往上走，按揭利率和美元债成本跟着水涨船高。这是财政与货币政策交互作用的结果，不是某一次会议能解决的。","海外官方买盘也在变化。中国官方外汇储备规模3.4万亿美元左右，黄金储备约3064亿美元，央行购金替代部分美债配置的节奏，会影响美债长端需求和黄金定价。日本30年期国债收益率本周下降3个基点至4.025%，日本央行委员高田创提到，一旦加息开始对企业行为产生不利影响，可视为政策利率接近中性水平并考虑潜在降息。主要央行各有关切，全球利率的共振比单看美联储更复杂。"]},{"heading":"三、从华尔街到普通家庭：房贷、养老金与出口订单","paragraphs":["对美国普通家庭，按揭利率跟着长端国债走，加息预期不降温，房贷和信用卡成本就下不来。就业市场已现裂痕，澳大利亚10月就业人数减少4.35万，失业率升至4.9%，高于预估的4.7%，显示高利率已在挤压用工需求。美国失业率4.1%虽低，但下行风险在累积。","对中国老百姓，全球利率高企压制外需，国内制造业PMI已连续低于50，出口企业订单更不确定。保险机构前三季度平均综合投资收益率仅2.28%，养老金和理财收益难有明显起色。中小企业若借过美元债，再融资成本更高。人民币汇率方面，本周美元指数在103.8附近，人民币在6.68附近，跨境资本流动管理压力仍在。","物价方面，能源和铜价回落短期缓解成本，但强美元和需求走弱可能拖累工资增长。南非10月通胀率升至5.2%，创近两年半新高，说明新兴市场输入型压力并未消失。国内10月CPI环比持平，制造业PMI低于50，内需偏弱意味着物价传导有限，但企业利润和就业压力更值得关注。"]},{"heading":"四、误读与真实风险：接下来一两个月盯什么","paragraphs":["市面上流行说“加息风暴来了，现金为王，黄金避险失灵”。本周黄金大跌主因是实际利率走高和杠杆资金补保证金，不是黄金长期避险功能消失。美国10月CPI环比0.35%，低于机械基准，能源CPI环比0.699%也明显低于基准，说明通胀压力并非全面失控。美联储内部也有官员明确表示当前无需激进举措。若后续就业和通胀同步走弱，加息预期可能快速降温，当前抛售反而可能过度。","接下来一两个月，盯四件实事。第一，美国10年期国债收益率能否站稳5%以上，连续三日收于5%以上说明期限溢价和加息预期继续升温，房贷利率难降；回落则市场开始定价紧缩尾声。第二，恐慌指数能否回落至25以下，回落说明杠杆去化告一段落，股金铜同跌的流动性冲击缓解；持续高于30则抛售可能自我强化。","第三，美国11月非农就业与失业率，新增低于10万或失业率升破4.5%，会迫使美联储放缓加息，利好债市和黄金；若就业仍强，加息预期继续压制资产价格。第四，中国11月制造业PMI能否回到50以上，回到50以上说明外需和国内订单企稳，出口企业压力减轻；继续低于50则中小企业订单和就业承压。这些信号比单日涨跌更能说明方向。"]}]},"stakeholders":[{"actor":"美联储内部鹰派官员（如本周释放连续加息信号的委员）","layer":"政治内部派系","impact":"受益","one_liner":"担心通胀粘住，主张用更高利率压住需求","constraint":"怕加息过猛触发股市暴跌和就业快速恶化"},{"actor":"美联储内部谨慎派（如“三把手”等主张看数据行事者）","layer":"政治内部派系","impact":"分化/待核","one_liner":"认为无需激进，担心金融稳定和就业下行","constraint":"通胀数据反复，鸽派表态容易被市场解读为放松"},{"actor":"美国财政部发债部门","layer":"政治内部派系","impact":"受损","one_liner":"要发大量国债，长债供给多不多直接影响期限溢价","constraint":"两党减税和军费刚性扩张，赤字压不下来"},{"actor":"美股长久期科技股（英伟达、Anthropic等AI概念）","layer":"产业链纵深","impact":"受损","one_liner":"估值靠未来现金流折现，利率一升就杀估值","constraint":"加息预期升温直接压低远期盈利现值，抛售自我强化"},{"actor":"黄金与铜等大宗商品交易资金","layer":"产业链纵深","impact":"受损","one_liner":"黄金靠实际利率和避险双锚，铜看制造业周期","constraint":"实际利率走高削弱黄金吸引力，强美元压制铜价"},{"a let currentRate = 1.0;
let currentTracks = [];

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function initTheme() {
  const saved = localStorage.getItem("em_theme");
  const btn = document.getElementById("theme-btn");
  if (saved === "dark") { document.documentElement.dataset.theme = "dark"; btn.textContent = "日间"; }
  btn.addEventListener("click", () => {
    const dark = document.documentElement.dataset.theme === "dark";
    document.documentElement.dataset.theme = dark ? "light" : "dark";
    localStorage.setItem("em_theme", dark ? "light" : "dark");
    btn.textContent = dark ? "夜间" : "日间";
  });
}

function playTrack(idx) {
  const tr = currentTracks[idx];
  const player = document.getElementById("wk-player");
  if (!tr || !player) return;
  player.src = tr.rel_url || "";
  player.playbackRate = currentRate;
  player.play().catch(() => {});
  document.getElementById("audio-now").textContent = "正在收听：" + tr.orderLabel + " " + tr.title;
  document.querySelectorAll("#track-list .track-link").forEach((b, i) => b.classList.toggle("playing", i === idx));
}
window._playTrack = playTrack;

function renderAudioStrip(issue) {
  const strip = document.getElementById("audio-strip");
  const tracks = (issue.audio && issue.audio.tracks) || [];
  currentTracks = tracks;
  if (!tracks.length) { strip.style.display = "none"; return; }
  strip.style.display = "block";
  const player = document.getElementById("wk-player");
  player.src = tracks[0].rel_url || "";
  document.getElementById("audio-now").textContent = "语音播客（" + tracks.length + " 段）· " + tracks[0].title;
  document.getElementById("track-list").innerHTML = tracks.map((t, i) =>
    `<button type="button" class="track-link ${i === 0 ? "playing" : ""}" onclick="window._playTrack(${i})">${esc(t.orderLabel)} ${esc((t.title || "").slice(0, 24))}</button>`
  ).join("");
}

          <span>附：各方立场与未来几周观察点（${stks.length} 方 · ${ws.length} 项）</span>
          <span>展开 / 收起</span>
        </summary>
        <div class="audit-body layer-archive">
          ${stks.length ? `<div class="audit-sub">相关各方处境</div>` + stks.map(s => `
            <div class="arch-item">
              <span class="arch-actor">${esc(s.actor)}</span>
              <span class="arch-impact">${esc(s.impact)} · ${esc(s.layer)}</span>
              <div class="arch-desc">${esc(s.one_liner)}${s.constraint ? "（痛点：" + esc(s.constraint) + "）" : ""}</div>
            </div>
          `).join("") : ""}
          ${ws.length ? `<div class="audit-sub">接下来盯什么</div>` + ws.map(w => `
            <div class="arch-item">
              <span class="arch-actor">${esc(w.object)} · ${esc(w.metric)}</span>
              <span class="arch-impact">${esc(w.deadline || "")}</span>
              <div class="arch-desc">触发线：${esc(w.threshold)} —— ${esc(w.verdict)}</div>
            </div>
          `).join("") : ""}
        </div>
      </details>
    ` : "";

    return `
      <article class="essay-article" id="story-${i + 1}">
        <div class="essay-meta-row">
          <span class="essay-kicker">专题 0${i + 1} · ${esc(st.chain_name || "")}</span>
          ${listenBtn}
        </div>
        <h2>${esc(art.title || st.title)}</h2>
        ${art.lead ? `<blockquote>${esc(art.lead)}</blockquote>` : ""}
        ${bodyHtml}
        ${detailsHtml}
      </article>
    `;
  }).join("");

  document.getElementById("main-content").innerHTML = headerHtml + articlesHtml;
}

(function boot() {
  initTheme();
  const bar = document.getElementById("reading-progress");
  const topBtn = document.getElementById("back-top");
  topBtn.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
  function onScroll() {
    const y = window.scrollY || document.documentElement.scrollTop;
    const h = document.documentElement.scrollHeight - window.innerHeight;
    bar.style.width = (h > 0 ? Math.min(100, y / h * 100) : 0) + "%";
    topBtn.classList.toggle("show", y > 400);
  }
  window.addEventListener("scroll", onScroll, { passive: true });
  onScroll();

  document.querySelectorAll(".audio-strip [data-rate]").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".audio-strip [data-rate]").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentRate = Number(btn.dataset.rate) || 1.0;
      const p = document.getElementById("wk-player");
      if (p) p.playbackRate = currentRate;
    });
  });
  document.getElementById("wk-player").addEventListener("ended", () => {
    const active = document.querySelector("#track-list .track-link.playing");
    if (!active) return;
    const all = [...document.querySelectorAll("#track-list .track-link")];
    const idx = all.indexOf(active);
    if (idx >= 0 && idx + 1 < currentTracks.length) playTrack(idx + 1);
  });

  const issues = DATA.issues || [];
  const sel = document.getElementById("issue-select");
  issues.forEach((is, idx) => sel.add(new Option(is.week + "（" + (is.range || "") + "）", String(idx))));
  sel.addEventListener("change", () => renderIssue(issues[Number(sel.value)]));
  if (issues.length) renderIssue(issues[0]);
  else document.getElementById("main-content").innerHTML = '<header class="issue-header"><h1>暂无已生成的周刊</h1></header>';
})();
</script>
</body>
</html>
