function projectPoint(d) {
  const c = globe.getCoords(d.lat, d.lng, 0.02);
  const cam = globe.camera().position;
  const up = globe.camera().up || { x: 0, y: 1, z: 0 };

  // 视线基：相机看向原点
  let fx = -cam.x, fy = -cam.y, fz = -cam.z;
  const fl = Math.sqrt(fx * fx + fy * fy + fz * fz) || 1;
  fx /= fl; fy /= fl; fz /= fl;
  let rx = fy * up.z - fz * up.y;
  let ry = fz * up.x - fx * up.z;
  let rz = fx * up.y - fy * up.x;
  const rl = Math.sqrt(rx * rx + ry * ry + rz * rz) || 1;
  rx /= rl; ry /= rl; rz /= rl;
  const ux = ry * fz - rz * fy;
  const uy = rz * fx - rx * fz;
  const uz = rx * fy - ry * fx;

  const dx = (c.x - cam.x) * rx + (c.y - cam.y) * ry + (c.z - cam.z) * rz;
  const dy = (c.x - cam.x) * ux + (c.y - cam.y) * uy + (c.z - cam.z) * uz;
  const dz = (c.x - cam.x) * fx + (c.y - cam.y) * fy + (c.z - cam.z) * fz;
  if (dz <= 0.1) return null;

  const f = 1 / Math.tan((globe.camera().fov * Math.PI) / 360);
  const aspect = window.innerWidth / window.innerHeight;
  const ndcX = (dx / dz) * f / aspect;
  const ndcY = (dy / dz) * f;
  return {
    x: ((ndcX + 1) / 2) * window.innerWidth,
    y: ((1 - ndcY) / 2) * window.innerHeight,
  };
}

function showPanel(d) {
  const titles = (d.titles || []).map(t => '<li>' + t + '</li>').join('');
  panel.innerHTML = '<h3>' + d.country + '</h3><p class="cnt">新闻条数：' + d.count + ' · 主领域：' + (d.domain || '其他') + '</p><ul>' + titles + '</ul>';

  const proj = projectPoint(d);
  if (proj) {
    const panelW = 300;
    const panelH = Math.min(340, 110 + (d.titles || []).length * 44);
    let top = proj.y - panelH / 2;
    top = Math.max(12, Math.min(window.innerHeight - panelH - 12, top));
    panel.style.top = top + 'px';
    const tailY = Math.max(24, Math.min(panelH - 24, proj.y - top));
    panel.style.setProperty('--tail-y', tailY + 'px');
  } else {
    panel.style.top = '22px';
  }
  panel.classList.add('show');
}

function frontPoint() {
  const cam = globe.camera().position;
  const cl = Math.sqrt(cam.x * cam.x + cam.y * cam.y + cam.z * cam.z) || 1;
  const cx = cam.x / cl, cy = cam.y / cl, cz = cam.z / cl;
  let best = null;
  let bestDot = -Infinity;
  for (const p of points) {
    const c = globe.getCoords(p.lat, p.lng, 0.02);
    const len = Math.sqrt(c.x * c.x + c.y * c.y + c.z * c.z) || 1;
    const dot = (c.x * cx + c.y * cy + c.z * cz) / len;
    if (dot > bestDot) {
      bestDot = dot;
      best = p;
    }
  }
  return best;
}

const globe = Globe()(document.getElementById('globe'))
  .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg')
  .backgroundColor('rgba(0,0,0,0)')
  .showAtmosphere(true)
  .atmosphereColor('#2f5d8a')
  .atmosphereAltitude(0.22)
  .width(window.innerWidth)
  .height(window.innerHeight)
  .pointsData(points)
  .pointLat(d => d.lat)
  .pointLng(d => d.lng)
  .pointColor(d => d.color)
  .pointRadius(d => 0.35 + Math.sqrt(d.count) * 0.13)
  .pointAltitude(d => 0.012 + Math.min(d.count, 40) * 0.003)
  .pointLabel(d => '<div class="globe-tooltip"><b>' + d.country + '</b> · ' + d.count + ' 条<br>' + (d.domain || '') + '</div>')
  .ringsData(rings)
  .ringLat(d => d.lat)
  .ringLng(d => d.lng)
  .ringColor(() => t => 'rgba(255,90,60,' + (1 - t) + ')')
  .ringMaxRadius(d => 2 + Math.sqrt(d.count) * 0.5)
  .ringPropagationSpeed(1.1)
  .ringRepeatPeriod(900);

// 时间轴：按天回看各国新闻量
if (dayKeys.length > 1) {
  tlCtrl.style.display = 'flex';
  tlRange.max = dayKeys.length - 1;
  const updateDay = (i) => {
    const day = dayKeys[i];
    const pts = dailyPoints[day] || [];
    globe.pointsData(pts);
    tlLabel.textContent = day + ' · ' + pts.length + ' 国有新闻';
  };
  tlRange.addEventListener('input', () => updateDay(Number(tlRange.value)));
  tlRange.value = dayKeys.length - 1;
  updateDay(dayKeys.length - 1);
}

// 自动缓慢巡航；用户一拖就停，松手停稳后弹对话框
const controls = globe.controls();
controls.autoRotate = true;
controls.autoRotateSpeed = 0.35;
controls.addEventListener('start', () => {
  controls.autoRotate = false;
  hidePanel();
});
controls.addEventListener('end', () => {
  const d = frontPoint();
  if (d) showPanel(d);
});

// 冲突热度多边形（在线加载 GeoJSON，失败自动降级为纯点模式）
fetch('https://raw.githubusercontent.com/vasturiano/globe.gl/master/example/datasets/ne_110m_admin_0_countries.geojson')
  .then(r => r.json())
  .then(geo => {
    globe
      .polygonsData(geo.features)
      .polygonCapColor(f => {
        const props = f.properties || {};
        const name = props.ADMIN || props.NAME || '';
        const hit = Object.keys(enHeat).find(k => k.toLowerCase() === String(name).toLowerCase());
        return hit ? heatColor(enHeat[hit]) : 'rgba(44,53,64,0.28)';
      })
      .polygonSideColor(() => 'rgba(255,255,255,0.05)')
      .polygonStrokeColor(() => 'rgba(255,255,255,0.12)')
      .polygonAltitude(0.006);
  })
  .catch(() => { console.warn('geojson load failed, points-only mode'); });

window.addEventListener('resize', () => {
  globe.width(window.innerWidth).height(window.innerHeight);
});
</script>
